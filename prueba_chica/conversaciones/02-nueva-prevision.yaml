# Copia comprobable de la conversación: la fuente es el .md. Formato: prueba_chica/corredor.py.
fuente: tests/conversaciones/02-nueva-prevision.md
numero: "02"
titulo: "Llego el 27, el proveedor se demoró"
mide: garantias
persona: Marcos
inicio: "2026-10-20 09:00"
# La de comunicaciones vence el 30 y tiene su propia escalera (aviso previo el 27, pedido el 30):
# el .md no la sigue. Lo que Leda manda sobre ella se registra, pero no se compara.
foco: [PLC]

tareas:
  PLC:
    titulo: Programar PLC de la comprimidora
    responsable: Marcos
    vence: "2026-10-23"
    estado: en_curso
    desde: "2026-10-19"
  COM:
    titulo: Revisar comunicaciones industriales de la comprimidora
    responsable: Marcos
    vence: "2026-10-30"
    estado: asignada
    depende_de: PLC

pasos:
  - paso: 1
    quien: Leda
    relojes: ["2026-10-20 10:00"]
    salen:
      - a: Marcos
        tipo: aviso_previo
        tarea: PLC
        hechos: {vence: "2026-10-23", necesita_respuesta: false}
    estado_despues:
      ultimo_aviso: {Marcos: PLC}
    dice:
      - la tarea del PLC
      - que vence el viernes 23
      - que no hace falta contestar
    no_dice:
      - la tarea de comunicaciones

  - paso: 2
    quien: Marcos
    a_las: "2026-10-20 15:40"
    escribe: "llego el 27, el proveedor se demoró"
    jugadas:
      - {nombre: anotar_prevision, tarea: PLC, fecha: "2026-10-27",
         motivo: "el proveedor se demoró"}
    efectos:
      previsiones: [{tarea: PLC, fecha: "2026-10-27", motivo: presente}]
      avisos_guardados:
        - tipo: nueva_prevision
          tarea: PLC
          a: Ismael
          estado: guardado
          hechos: {prevision: "2026-10-27", fecha_comprometida: "2026-10-23",
                   atraso_dias_habiles: 2, dependientes: [COM], motivo: presente}
    hechos:
      - jugada: anotar_prevision
        resultado: anotado
        tarea: PLC
        prevision: "2026-10-27"
        fecha_comprometida: "2026-10-23"
        atraso_dias_habiles: 2
        aviso_al_referente: {a: Ismael Soschinski, estado: guardado_sin_enviar}
    pregunta: null
    estado_despues:
      pregunta_abierta: null
      para_despues: []
    dice:
      - la previsión del 27 y su motivo
      - que la fecha comprometida sigue siendo el 23
      - que Ismael se entera, sólo si el código informa que el aviso quedó guardado
    no_dice:
      - que la fecha cambió
      - que Ismael aceptó
      - que la tarea está bloqueada

  - paso: 3
    quien: Leda
    relojes: ["2026-10-20 15:41"]
    salen:
      - a: Ismael
        tipo: nueva_prevision
        tarea: PLC
        hechos: {prevision: "2026-10-27", fecha_comprometida: "2026-10-23",
                 atraso_dias_habiles: 2, dependientes: [COM], motivo: presente}
    estado_despues:
      de: Ismael
      pregunta_abierta: null
    dice:
      - la tarea del PLC
      - que Marcos prevé llegar el martes 27 y por qué
      - que la fecha comprometida es el viernes 23
      - el atraso, dos días hábiles
      - que la tarea de comunicaciones depende de ella
    no_dice:
      - que la fecha ya cambió
      - cómo se cambia la fecha
      - un atraso que no salga del código
      - nada que Marcos no dijo

  - paso: 4
    quien: Leda
    relojes: ["2026-10-23 10:00"]
    salen:
      - a: Marcos
        tipo: vencimiento_con_prevision
        tarea: PLC
        hechos:
          necesita_respuesta: false
          vence: "2026-10-23"
          prevision_vigente:
            fecha: "2026-10-27"
            atraso_dias_habiles: 2
            aviso_al_referente: {a: Ismael Soschinski, estado: enviado}
          pide_el_estado_el: {fecha: "2026-10-27", estado: todavia_no}
    estado_despues:
      pregunta_abierta: null
      esperas_abiertas: []
    dice:
      - que la tarea del PLC vencía hoy
      - que Marcos dio el 27 como previsión y que Ismael está al tanto (según el estado de su aviso)
      - que el martes 27 le va a pedir el estado, como algo que todavía no pasó
    no_dice:
      - que la fecha cambió
      - nada que trate a Marcos como si no hubiera avisado
      - que va a escalar
      - una pregunta

  - paso: 5
    quien: nadie
    relojes: ["2026-10-23 16:00", "2026-10-26 10:00", "2026-10-26 16:00"]
    salen: []

  - paso: 6
    quien: Leda
    relojes: ["2026-10-27 10:00"]
    salen:
      - a: Marcos
        tipo: pedido_de_estado
        tarea: PLC
        hechos:
          numero: 1
          necesita_respuesta: true
          seguimiento_por: prevision
          vence: "2026-10-23"
          atraso_dias_habiles: 2
          prevision_vigente: {fecha: "2026-10-27"}
    estado_despues:
      esperas_abiertas: [PLC]
      pregunta_abierta: {tipo: estado_de_la_tarea, tarea: PLC}
    dice:
      - que hoy es el día que Marcos previó para la tarea del PLC
      - que la fecha comprometida era el viernes 23 y el atraso, dos días hábiles
      - pide el estado
    no_dice:
      - que la fecha comprometida cambió
      - que va a escalar
      - un reproche

  - paso: 7
    quien: nadie
    relojes: ["2026-10-27 16:00", "2026-10-28 10:00", "2026-10-28 16:00", "2026-10-29 10:00",
              "2026-10-29 16:00", "2026-10-30 10:00", "2026-10-30 16:00"]
    salen:
      - a: Marcos
        el: "2026-10-28"
        tipo: pedido_de_estado
        tarea: PLC
        hechos: {numero: 2, seguimiento_por: prevision}
      - a: Marcos
        el: "2026-10-29"
        tipo: pedido_de_estado
        tarea: PLC
        hechos: {numero: 3, seguimiento_por: prevision,
                 si_no_hay_respuesta: {se_avisa_a: [Ismael Soschinski], estado: todavia_no}}
      - a: Ismael
        el: "2026-10-30"
        tipo: escalamiento
        tarea: PLC
        hechos: {aviso: falta_de_respuesta, seguimiento_por: prevision, vence: "2026-10-23",
                 atraso_dias_habiles: 5, pedido_desde: "2026-10-27",
                 prevision_vigente: {fecha: "2026-10-27"}}
    dice:
      - "el 28, el segundo pedido; el 29, el tercero, que avisa que se le va a avisar a Ismael"
      - "el 30, a Ismael: la falta de respuesta, con la previsión, la fecha comprometida y el atraso"
    no_dice:
      - "a Ismael: que persiga o resuelva algo (es información)"
