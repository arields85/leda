<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Mis tareas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0f1316; --raise:#171c21; --line:#262d34;
  --ink:#ffffff; --ink-2:#b6bdc4; --ink-3:#8d969f;
  --green:#43a26b; --green-ink:#86d4a4; --orange:#ee7a3a; --neutral:#2a3138;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:var(--ground);color:var(--ink)}
body{font-family:"Sora",system-ui,sans-serif;-webkit-font-smoothing:antialiased;position:relative;font-variant-numeric:tabular-nums}
::selection{background:var(--green);color:var(--ground)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:12px}

/* top line */
.top{position:absolute;inset:0 0 auto 0;padding:14px 16px 0;display:flex;justify-content:space-between;align-items:flex-start}
.top h1{font-size:15px;font-weight:600;letter-spacing:-.01em}
.top h1 span{color:var(--ink-3);font-weight:400}
.top .who{font-size:13px;color:var(--ink-2);margin-top:4px}
.top .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.top .day{font-size:13px;color:var(--ink-2);padding-top:2px}
.all{font-size:13px;font-weight:600;color:var(--ink);padding:6px 10px;margin-right:-10px;border-radius:10px;transition:background .2s cubic-bezier(.16,1,.3,1)}
.all:hover{background:var(--raise)}

/* position in the feed: 4 dots, ordered by due */
.dots{position:absolute;left:6px;top:286px;display:flex;flex-direction:column;gap:7px;list-style:none}
.dots li{width:4px;height:4px;border-radius:2px;background:#3a434c}
.dots li[aria-current]{height:18px;background:var(--ink)}

/* runway: business days from today to due */
.runway{position:absolute;left:24px;right:24px;top:124px}
.track{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.track div{position:relative;padding-top:14px;font-size:13px;color:var(--ink-3)}
.track div::before{content:"";position:absolute;top:-4px;left:0;width:7px;height:7px;border-radius:50%;background:#3a434c}
.track b{display:block;font-size:22px;font-weight:500;color:var(--ink-2);letter-spacing:-.02em;margin-bottom:2px}
.track .today::before{background:var(--green);box-shadow:0 0 0 3px var(--ground)}
.track .today b,.track .due,.track .due b{color:var(--ink)}
.track .due::before{background:var(--ink);border-radius:1px;transform:rotate(45deg)}

/* caption, anchored low-left */
.scrim{position:absolute;inset:auto 0 0 0;height:470px;background:linear-gradient(to bottom,rgba(15,19,22,0) 0%,rgba(9,12,14,.55) 55%,rgba(9,12,14,.85) 100%);pointer-events:none}
.task{position:absolute;left:20px;width:268px;bottom:102px}
.meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);margin-bottom:14px}
.state{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;background:rgba(67,162,107,.16);color:var(--green-ink);font-weight:600}
.state::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}
.task h2{font-size:38px;line-height:1.06;font-weight:600;letter-spacing:-.035em;text-wrap:balance}
.due-line{margin-top:12px;font-size:15px;font-weight:600}
.task p{margin-top:10px;font-size:14px;line-height:1.55;color:var(--ink-2);max-width:32ch}
.rev{margin-top:14px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.av{width:24px;height:24px;border-radius:8px;background:var(--neutral);color:var(--ink);display:grid;place-items:center;font-size:11px;font-weight:700}

/* right rail of actions: filled rounded squares */
.rail{position:absolute;right:12px;bottom:112px;width:76px;display:flex;flex-direction:column;gap:18px;list-style:none}
.act{display:flex;flex-direction:column;align-items:center;gap:7px;width:76px;font-size:12px;font-weight:600;line-height:1.2;text-align:center}
.act .g{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.3);transition:transform .2s cubic-bezier(.16,1,.3,1),filter .2s cubic-bezier(.16,1,.3,1)}
.act:hover .g{filter:brightness(1.08)}
.act:active .g{transform:scale(.94)}
.act svg{width:26px;height:26px;fill:currentColor}
.done .g{background:var(--green)}
.need .g{background:var(--orange)}
.more .g{background:var(--neutral)}

/* peek of the next task */
.next{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--raise);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:10px 20px 0;display:block;text-align:left;width:100%}
.next::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:#3a434c;margin:0 auto 12px}
.next .l1{font-size:15px;font-weight:600}
.next .l1 span{color:var(--ink-3);font-weight:400}
.next .l2{margin-top:4px;font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.next .idle{display:inline-flex;align-items:center;gap:6px}
.next .idle::before{content:"";width:6px;height:6px;border-radius:50%;border:1.5px solid var(--ink-3)}
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>Mis tareas <span>· 1 de 4</span></h1>
    <div class="who">Nahuel · Tableros</div>
  </div>
  <div class="right">
    <div class="day">jueves 15/10</div>
    <button type="button" class="all">Ver todas (4)</button>
  </div>
</header>

<ol class="dots" aria-label="Tarea 1 de 4, ordenadas por vencimiento">
  <li aria-current="step"></li><li></li><li></li><li></li>
</ol>

<section class="runway" aria-label="Días hábiles hasta el vencimiento">
  <div class="track">
    <div class="today"><b>15</b>hoy</div>
    <div><b>16</b>vie</div>
    <div><b>19</b>lun</div>
    <div class="due"><b>20</b>vence</div>
  </div>
</section>

<div class="scrim" aria-hidden="true"></div>

<article class="task" aria-labelledby="t1">
  <div class="meta"><span class="state">en curso</span><span>Tablero de planta</span></div>
  <h2 id="t1">Armar el tablero</h2>
  <div class="due-line">vence mar 20/10</div>
  <p>Montar y cablear el tablero principal según el plano rev. C.</p>
  <div class="rev"><span class="av" aria-hidden="true">M</span>la revisa Marcos</div>
</article>

<ul class="rail" aria-label="Qué pasó con esta tarea">
  <li><button type="button" class="act done">
    <span class="g"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.3 18.7 3.4 12.8a1.6 1.6 0 0 1 2.3-2.3l3.6 3.6 9-9a1.6 1.6 0 0 1 2.3 2.3L9.3 18.7z"/></svg></span>Ya la terminé</button></li>
  <li><button type="button" class="act need">
    <span class="g"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 2.5a1.3 1.3 0 0 1 1.3 1.3V4h12.4a.8.8 0 0 1 .65 1.27L16.6 9l2.75 3.73a.8.8 0 0 1-.65 1.27H6.3v6.2a1.3 1.3 0 0 1-2.6 0V3.8A1.3 1.3 0 0 1 5 2.5z"/></svg></span>Me falta algo</button></li>
  <li><button type="button" class="act more">
    <span class="g"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12a1 1 0 0 1 0 2h-.5v2.6c0 1.6-.8 3.1-2.1 4L13.6 12l1.8 1.4c1.3.9 2.1 2.4 2.1 4V20h.5a1 1 0 0 1 0 2H6a1 1 0 0 1 0-2h.5v-2.6c0-1.6.8-3.1 2.1-4l1.8-1.4-1.8-1.4c-1.3-.9-2.1-2.4-2.1-4V4H6a1 1 0 0 1 0-2z"/></svg></span>Más tiempo</button></li>
</ul>

<button type="button" class="next" aria-label="Ver la siguiente tarea: Probar el PLC">
  <div class="l1"><span>Siguiente:</span> Probar el PLC</div>
  <div class="l2"><span>vence mié 28/10</span><span aria-hidden="true">·</span><span class="idle">sin empezar</span></div>
</button>

</body>
</html>
