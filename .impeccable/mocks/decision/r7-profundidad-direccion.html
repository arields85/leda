<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Tablero · Ismael</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --top: #2a3134;
    --bottom: #1b2023;
    --raised: #283034;
    --bar: #30383c;
    --ink: #ecebe6;
    --ink-soft: #b9bab5;
    --ink-mute: #9fa19e;
    --hair: rgba(236, 235, 230, 0.08);
    --line: rgba(236, 235, 230, 0.12);
    --line-strong: rgba(236, 235, 230, 0.30);
    --wait: #e3a27a;
    --doing: #9cc7a4;
    --gutter: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-x: hidden; background-color: var(--bottom); }
  html, body { width: 390px; min-height: 100vh; min-height: 100dvh; }
  body { position: relative; color: var(--ink); }
  body::before {
    content: ""; position: fixed; top: 0; left: 0; z-index: -1;
    width: 390px; height: 100vh; height: 100dvh; pointer-events: none;
    background:
      radial-gradient(ellipse 130% 42% at 50% 0%, rgba(236, 235, 230, 0.05), rgba(236, 235, 230, 0) 72%),
      linear-gradient(180deg, var(--top) 0%, var(--bottom) 100%);
  }
  body {
    font: 400 16px/1.4 "Source Sans 3", system-ui, sans-serif;
    font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1, "lnum" 1;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--ink); color: var(--bottom); }
  :focus-visible { outline: 1.5px solid var(--ink); outline-offset: 3px; border-radius: 4px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { display: block; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  header { padding: 20px var(--gutter) 0; display: flex; align-items: center; justify-content: space-between; }
  .who { font-size: 17px; font-weight: 600; line-height: 24px; }
  .who span { color: var(--ink-mute); font-weight: 400; }
  .today { color: var(--ink-mute); font-size: 14px; line-height: 20px; }
  .new {
    display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px 0 12px;
    border: 1px solid var(--line-strong); border-radius: 999px; font-size: 15px; font-weight: 600;
  }
  .new:hover { border-color: var(--ink); }
  .new:active { background: rgba(236, 235, 230, 0.06); }

  .hero { padding: 28px var(--gutter) 0; }
  .hero h2 { font-size: 38px; line-height: 44px; font-weight: 600; letter-spacing: -0.02em; }
  .hero h2 em { font-style: normal; color: var(--wait); }
  .hero .why { margin-top: 6px; font-size: 16px; line-height: 22px; color: var(--ink-soft); }
  .hero .count { margin-top: 6px; font-size: 14px; line-height: 20px; color: var(--ink-mute); }

  .week { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 20px var(--gutter) 0; }
  .day {
    display: flex; flex-direction: column; align-items: center; padding: 8px 0;
    color: var(--ink-mute); font-size: 13px; line-height: 16px;
    border: 1px solid transparent; border-radius: 8px;
  }
  .day b { font-weight: 400; font-size: 20px; line-height: 24px; color: var(--ink-soft); margin: 4px 0; }
  .day.is-today { color: var(--ink); border-color: var(--line-strong); background: rgba(236, 235, 230, 0.04); }
  .day.is-today b { color: var(--ink); font-weight: 600; }
  .day small { font-size: 12px; line-height: 16px; min-height: 16px; }
  .day small.due { color: var(--wait); }

  main { padding: 20px var(--gutter) calc(110px + env(safe-area-inset-bottom, 0px)); }
  .group { background: var(--raised); border: 1px solid var(--hair); border-radius: 12px; list-style: none; overflow: hidden; }
  .group li + li { border-top: 1px solid var(--hair); }
  .task { display: grid; grid-template-columns: 1fr auto; column-gap: 16px; row-gap: 2px; width: 100%; text-align: left; padding: 14px 16px; }
  .task:hover { background: rgba(236, 235, 230, 0.03); }
  .task:active { background: rgba(236, 235, 230, 0.06); }
  .t { font-size: 17px; line-height: 24px; font-weight: 600; letter-spacing: -0.005em; }
  .d { font-size: 15px; line-height: 24px; color: var(--ink-soft); text-align: right; }
  .s { font-size: 14px; line-height: 20px; grid-column: 1 / -1; }
  .s.doing { color: var(--doing); }
  .s.idle { color: var(--ink-mute); }
  .x { grid-column: 1 / -1; font-size: 15px; line-height: 20px; color: var(--ink-soft); margin-top: 2px; }

  h3 { font-size: 14px; line-height: 20px; font-weight: 600; color: var(--ink-mute); padding: 20px 4px 8px; }
  .quiet { background: rgba(236, 235, 230, 0.02); border: 1px solid var(--hair); border-radius: 12px; }
  .done { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 12px 16px; color: var(--ink-mute); font-size: 15px; line-height: 24px; }
  .done .name { color: var(--ink-soft); }

  .tabbar {
    position: fixed; left: 0; width: 390px; bottom: 0; z-index: 10;
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px;
    padding: 6px 8px calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--bottom); border-top: 1px solid var(--line);
  }
  .tabbar a {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    min-height: 52px; color: var(--ink-mute); text-decoration: none;
    font-size: 12px; line-height: 14px; white-space: nowrap;
  }
  .tabbar a:hover { color: var(--ink); }
  .tabbar a[aria-current="page"] { color: var(--ink); font-weight: 600; }
  .tabbar a[aria-current="page"]::before {
    content: ""; position: absolute; top: -7px; width: 28px; height: 2px; border-radius: 4px; background: var(--ink);
  }
</style>
</head>
<body>
  <header>
    <div>
      <h1 class="who">Ismael <span>· Dirección</span></h1>
      <p class="today">jueves 15/10</p>
    </div>
    <button class="new" aria-label="Nueva tarea">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Nueva
    </button>
  </header>

  <section class="hero" aria-label="Resumen">
    <h2><em>1</em> vence mañana</h2>
    <p class="why">Firmar el plano rev. C · lo espera Marcos para seguir</p>
    <p class="count">5 abiertas en el equipo · 1 esperando</p>
  </section>

  <section class="week" aria-label="Esta semana">
    <div class="day">lun<b>12</b><small></small></div>
    <div class="day">mar<b>13</b><small></small></div>
    <div class="day">mié<b>14</b><small></small></div>
    <div class="day is-today" aria-current="date">jue<b>15</b><small>hoy</small></div>
    <div class="day">vie<b>16</b><small class="due">1 vence</small></div>
  </section>

  <main>
    <ol class="group" aria-label="Tus tareas abiertas">
      <li><button class="task">
        <span class="t">Firmar el plano rev. C</span><span class="d">vie 16/10</span>
        <span class="s idle">sin empezar</span>
        <span class="x">Lo espera Marcos para seguir.</span>
      </button></li>
      <li><button class="task">
        <span class="t">Aprobar el presupuesto</span><span class="d">mié 21/10</span>
        <span class="s doing">en curso</span>
      </button></li>
    </ol>

    <h3>Terminadas esta semana</h3>
    <div class="quiet">
      <div class="done"><span class="name">Definir las prioridades del mes</span><span>lun 12/10</span></div>
    </div>
  </main>

  <nav class="tabbar" aria-label="Vistas">
    <a href="#" aria-current="page">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5l2 2 3.5-3.5M13 8h7M4 16.5l2 2 3.5-3.5M13 17h7"/></svg>
      Mis tareas
    </a>
    <a href="#">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
      Mi sector
    </a>
    <a href="#">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
      Lo que pedí
    </a>
    <a href="#">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4M4 16l8 4 8-4"/></svg>
      Áreas
    </a>
    <a href="#">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M15.5 5.2a3 3 0 0 1 0 5.6M17 13.6a5.5 5.5 0 0 1 3.5 5.4"/></svg>
      Equipo
    </a>
  </nav>
</body>
</html>
