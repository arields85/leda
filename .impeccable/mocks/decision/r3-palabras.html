<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Mis tareas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#101418; --raise:#171c21; --line:#262d34;
  --ink:#f4f6f8; --ink-2:#b4bcc4; --ink-3:#8b949d;
  --green:#3f9b62; --green-ink:#7fd19c; --orange:#e8743b; --orange-ink:#f3a175;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:var(--ground);color:var(--ink)}
body{font-family:"Source Sans 3",system-ui,sans-serif;-webkit-font-smoothing:antialiased;position:relative;font-variant-numeric:tabular-nums}
::selection{background:var(--green);color:#fff}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* top line */
.top{position:absolute;inset:0 0 auto 0;padding:14px 16px 0;display:flex;justify-content:space-between;align-items:flex-start}
.top h1{font-size:17px;font-weight:700;letter-spacing:-.005em}
.top h1 span{color:var(--ink-3);font-weight:500}
.top .who{font-size:14px;color:var(--ink-2);margin-top:2px}
.top .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.top .day{font-size:14px;color:var(--ink-2);padding-top:2px}
.all{min-height:44px;padding:0 14px;margin-right:-6px;border-radius:22px;font-size:15px;font-weight:600;color:var(--ink);border:1px solid var(--line);background:var(--raise);transition:background .2s cubic-bezier(.16,1,.3,1)}
.all:hover{background:#1f262c}
.all:focus-visible{border-radius:22px}

/* position in the feed: 4 dots, ordered by due */
.dots{position:absolute;left:6px;top:300px;display:flex;flex-direction:column;gap:7px;list-style:none}
.dots li{width:4px;height:4px;border-radius:2px;background:#3a434c}
.dots li[aria-current]{height:18px;background:var(--ink)}

/* runway: business days from today to due */
.runway{position:absolute;left:24px;right:24px;top:140px}
.track{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.track div{position:relative;padding-top:14px;font-size:14px;color:var(--ink-3)}
.track div::before{content:"";position:absolute;top:-4px;left:0;width:7px;height:7px;border-radius:50%;background:#3a434c}
.track b{display:block;font-size:24px;font-weight:600;color:var(--ink-2);margin-bottom:1px}
.track .today::before{background:var(--green);box-shadow:0 0 0 3px var(--ground)}
.track .today b,.track .due,.track .due b{color:var(--ink)}
.track .due::before{background:var(--ink);border-radius:1px;transform:rotate(45deg)}

/* caption, anchored low-left */
.scrim{position:absolute;inset:auto 0 0 0;height:470px;background:linear-gradient(to bottom,rgba(16,20,24,0) 0%,rgba(10,13,16,.55) 55%,rgba(10,13,16,.85) 100%);pointer-events:none}
.task{position:absolute;left:20px;width:212px;bottom:104px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:14px;color:var(--ink-2);margin-bottom:12px}
.state{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;background:rgba(63,155,98,.16);color:var(--green-ink);font-weight:600}
.state::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}
.task h2{font-size:40px;line-height:1.05;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.due-line{margin-top:10px;font-size:17px;font-weight:600}
.task p{margin-top:10px;font-size:16px;line-height:1.45;color:var(--ink-2)}
.rev{margin-top:14px;display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink-2)}
.av{width:26px;height:26px;border-radius:50%;background:#2a3238;color:var(--ink);display:grid;place-items:center;font-size:13px;font-weight:700}

/* right column of actions: plain text buttons */
.rail{position:absolute;right:14px;bottom:112px;width:130px;display:flex;flex-direction:column;gap:10px;list-style:none}
.act{display:block;width:100%;min-height:52px;padding:8px 14px;border-radius:26px;font-size:16px;font-weight:600;line-height:1.2;text-align:center;text-wrap:balance;transition:background .2s cubic-bezier(.16,1,.3,1),transform .2s cubic-bezier(.16,1,.3,1)}
.act:active{transform:scale(.97)}
.act:focus-visible{border-radius:26px}
.act.done{background:var(--green);color:#fff;font-size:19px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.act.done:hover{background:#378a56}
.act.need{background:rgba(232,116,59,.12);border:1px solid rgba(232,116,59,.6);color:var(--orange-ink)}
.act.need:hover{background:rgba(232,116,59,.2)}
.act.time{background:var(--raise);border:1px solid var(--line);color:var(--ink)}
.act.time:hover{background:#1f262c}

/* peek of the next task */
.next{position:absolute;left:0;right:0;bottom:0;height:86px;background:var(--raise);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:10px 20px 0;display:block;text-align:left;width:100%}
.next::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:#3a434c;margin:0 auto 12px}
.next .l1{font-size:17px;font-weight:700}
.next .l1 span{color:var(--ink-3);font-weight:500}
.next .l2{margin-top:3px;font-size:14px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.next .idle{display:inline-flex;align-items:center;gap:6px}
.next .idle::before{content:"";width:6px;height:6px;border-radius:50%;border:1.5px solid var(--ink-3)}
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>Mis tareas <span>· 1 de 4</span></h1>
    <div class="who">Nahuel · Tableros</div>
  </div>
  <div class="side">
    <div class="day">jueves 15/10</div>
    <button type="button" class="all">Ver todas (4)</button>
  </div>
</header>

<ol class="dots" aria-label="Tarea 1 de 4, ordenadas por vencimiento">
  <li aria-current="step"></li><li></li><li></li><li></li>
</ol>

<section class="runway" aria-label="Días hábiles hasta el vencimiento">
  <div class="track">
    <div class="today"><b>15</b>hoy</div>
    <div><b>16</b>vie</div>
    <div><b>19</b>lun</div>
    <div class="due"><b>20</b>vence</div>
  </div>
</section>

<div class="scrim" aria-hidden="true"></div>

<article class="task" aria-labelledby="t1">
  <div class="meta"><span class="state">en curso</span><span>Tablero de planta</span></div>
  <h2 id="t1">Armar el tablero</h2>
  <div class="due-line">vence mar 20/10</div>
  <p>Montar y cablear el tablero principal según el plano rev. C.</p>
  <div class="rev"><span class="av" aria-hidden="true">M</span>la revisa Marcos</div>
</article>

<ul class="rail" aria-label="Qué pasó con esta tarea">
  <li><button type="button" class="act done">Ya la terminé</button></li>
  <li><button type="button" class="act need">Me falta algo para seguir</button></li>
  <li><button type="button" class="act time">Pedir más tiempo</button></li>
</ul>

<button type="button" class="next" aria-label="Ver la siguiente tarea: Probar el PLC">
  <div class="l1"><span>Siguiente:</span> Probar el PLC</div>
  <div class="l2"><span>vence mié 28/10</span><span aria-hidden="true">·</span><span class="idle">sin empezar</span></div>
</button>

</body>
</html>
