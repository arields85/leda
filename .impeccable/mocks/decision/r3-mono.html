<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Mis tareas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0e1114; --raise:#161a1e; --line:#272d33; --line-2:#3a424a;
  --ink:#e9ecef; --ink-2:#b3bbc3; --ink-3:#8c959e;
  --green:#4fb37a; --green-ink:#8fdcae; --orange:#f08a4b;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:"Hanken Grotesk",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:var(--ground);color:var(--ink)}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;position:relative}
::selection{background:var(--green);color:var(--ground)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* top line */
.top{position:absolute;inset:0 0 auto 0;padding:14px 16px 0;display:flex;justify-content:space-between;align-items:flex-start}
.top h1{font-size:16px;font-weight:600;letter-spacing:-.005em}
.top h1 span{color:var(--ink-3);font-weight:500}
.top .who{font-size:13px;color:var(--ink-2);margin-top:3px}
.top .right{display:flex;flex-direction:column;align-items:flex-end}
.top .day{font-size:12px;color:var(--ink-2);padding-top:3px}
.all{min-height:44px;margin-right:-8px;padding:0 8px;font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink-2);border-radius:4px;transition:color .2s cubic-bezier(.16,1,.3,1),background .2s cubic-bezier(.16,1,.3,1)}
.all:hover{color:var(--ink);background:var(--raise)}

/* position in the feed: 4 dots, ordered by due */
.dots{position:absolute;left:6px;top:300px;display:flex;flex-direction:column;gap:7px;list-style:none}
.dots li{width:4px;height:4px;border-radius:2px;background:var(--line-2)}
.dots li[aria-current]{height:18px;background:var(--ink)}

/* strip of business days from today to due */
.runway{position:absolute;left:24px;right:24px;top:122px}
.track{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.track div{position:relative;padding-top:14px;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.track div::before{content:"";position:absolute;top:-4px;left:0;width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.track b{display:block;font-size:22px;font-weight:500;color:var(--ink-2);letter-spacing:-.02em;margin-bottom:2px;font-variant-numeric:tabular-nums}
.track .today::before{background:var(--green);box-shadow:0 0 0 3px var(--ground)}
.track .today b,.track .due b,.track .due{color:var(--ink)}
.track .due::before{background:var(--ink);border-radius:1px;transform:rotate(45deg)}

/* caption, anchored low-left */
.scrim{position:absolute;inset:auto 0 0 0;height:440px;background:linear-gradient(to bottom,rgba(14,17,20,0) 0%,rgba(9,11,13,.5) 60%,rgba(9,11,13,.8) 100%);pointer-events:none}
.task{position:absolute;left:18px;width:206px;bottom:104px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--ink-2);margin-bottom:12px}
.state{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:4px;border:1px solid rgba(79,179,122,.4);color:var(--green-ink);font-family:var(--mono);font-size:12px;font-weight:500}
.state::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}
.task h2{font-size:34px;line-height:1.06;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.due-line{margin-top:10px;font-family:var(--mono);font-size:14px;font-weight:500}
.task p{margin-top:12px;font-size:14px;line-height:1.45;color:var(--ink-2)}
.rev{margin-top:14px;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.av{width:24px;height:24px;border-radius:50%;background:#262e35;color:var(--ink);display:grid;place-items:center;font-size:12px;font-weight:600}

/* stacked actions, worded like Leda's chat buttons */
.rail{position:absolute;right:16px;bottom:110px;width:138px;display:flex;flex-direction:column;gap:10px;list-style:none}
.act{display:block;width:100%;min-height:48px;padding:9px 12px;border-radius:4px;border:1px solid var(--line-2);background:var(--raise);font-family:var(--mono);font-size:13px;font-weight:500;line-height:1.35;text-align:left;transition:background .2s cubic-bezier(.16,1,.3,1),border-color .2s cubic-bezier(.16,1,.3,1),transform .15s cubic-bezier(.16,1,.3,1)}
.act:hover{background:#1e2429;border-color:#4a535c}
.act:active{transform:translateY(1px)}
.act.done{background:var(--green);border-color:var(--green);color:var(--ground);font-weight:600}
.act.done:hover{background:#5cc088;border-color:#5cc088}
.act.need{color:var(--orange);border-color:rgba(240,138,75,.55)}
.act.need:hover{border-color:var(--orange)}

/* peek of the next task */
.next{position:absolute;left:0;right:0;bottom:0;height:86px;background:var(--raise);border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding:10px 20px 0;display:block;text-align:left;width:100%}
.next::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 12px}
.next .l1{font-size:15px;font-weight:600}
.next .l1 span{color:var(--ink-3);font-weight:500}
.next .l2{margin-top:5px;font-family:var(--mono);font-size:12px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.next .idle{display:inline-flex;align-items:center;gap:6px}
.next .idle::before{content:"";width:6px;height:6px;border-radius:50%;border:1.5px solid var(--ink-3)}
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>Mis tareas <span>· 1 de 4</span></h1>
    <div class="who">Nahuel · Tableros</div>
  </div>
  <div class="right">
    <div class="day mono">jueves 15/10</div>
    <button type="button" class="all">&gt; Ver todas (4)</button>
  </div>
</header>

<ol class="dots" aria-label="Tarea 1 de 4, ordenadas por vencimiento">
  <li aria-current="step"></li><li></li><li></li><li></li>
</ol>

<section class="runway" aria-label="Días hábiles hasta el vencimiento">
  <div class="track">
    <div class="today"><b>15</b>hoy</div>
    <div><b>16</b>vie</div>
    <div><b>19</b>lun</div>
    <div class="due"><b>20</b>vence</div>
  </div>
</section>

<div class="scrim" aria-hidden="true"></div>

<article class="task" aria-labelledby="t1">
  <div class="meta"><span class="state">en curso</span><span>Tablero de planta</span></div>
  <h2 id="t1">Armar el tablero</h2>
  <div class="due-line">vence mar 20/10</div>
  <p>Montar y cablear el tablero principal según el plano rev. C.</p>
  <div class="rev"><span class="av" aria-hidden="true">M</span>la revisa Marcos</div>
</article>

<ul class="rail" aria-label="Qué pasó con esta tarea">
  <li><button type="button" class="act done">&gt; Ya la terminé</button></li>
  <li><button type="button" class="act need">&gt; Me falta algo para seguir</button></li>
  <li><button type="button" class="act">&gt; Pedir más tiempo</button></li>
</ul>

<button type="button" class="next" aria-label="Ver la siguiente tarea: Probar el PLC">
  <div class="l1"><span>Siguiente:</span> Probar el PLC</div>
  <div class="l2"><span>vence mié 28/10</span><span aria-hidden="true">·</span><span class="idle">sin empezar</span></div>
</button>

</body>
</html>
