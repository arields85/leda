# D12: un referente crea tareas en su web (con el enlace de entrada); los objetivos los crea
# Dirección (sin enlace, nombrando a quien los crea).
pasos:
  - paso: 1
    quien: Marcos
    a_las: "2026-10-19 10:30"
    escribe: "necesito cargarle una tarea a nahuel para que revise los sensores"
    jugadas:
      - {nombre: pedir_crear, que_quiere_crear: tarea}
    efectos:
      enlaces_de_entrada: [{de: Marcos}]
    hechos:
      - {jugada: pedir_crear, resultado: se_crea_en_la_web, que_quiere_crear: tarea,
         puede_hacerlo_en_la_web: true, lleva_el_enlace_de_entrada_a_la_web: true,
         sirve_una_sola_vez: true, vence_a_las_24_horas: true}
    pregunta: null
    botones: []
    enlace: false
    enlace_web: true
    estado_despues:
      pregunta_abierta: null
    dice:
      - que las tareas se cargan en la web y que ahí va su enlace para entrar
      - que el enlace sirve una vez y vence en 24 horas
    no_dice:
      - que cargó la tarea
      - una dirección o un enlace escrito por la IA

  - paso: 2
    quien: Marcos
    a_las: "2026-10-19 11:00"
    escribe: "y si quiero crear un objetivo para la linea 3?"
    jugadas:
      - {nombre: pedir_crear, que_quiere_crear: objetivo}
    efectos: {}
    hechos:
      - {jugada: pedir_crear, resultado: se_crea_en_la_web, que_quiere_crear: objetivo,
         puede_hacerlo_en_la_web: false, lo_hacen: [Ismael Soschinski],
         lleva_el_enlace_de_entrada_a_la_web: ausente, pronto_podra_proponerlo: ausente}
    pregunta: null
    botones: []
    enlace: false
    enlace_web: false
    estado_despues:
      pregunta_abierta: null
    dice:
      - que los objetivos los crea Dirección, Ismael
    no_dice:
      - que creó el objetivo
      - que él lo puede crear en la web
