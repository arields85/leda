numero: "53"
titulo: "Crear por chat: un referente"
mide: garantias
persona: Marcos
inicio: "2026-10-19 09:00"

tareas:
  PLC:
    titulo: Programar PLC de la comprimidora
    criterio: "La comprimidora arranca desde el PLC y completa 20 ciclos sin fallas"
    responsable: Marcos
    vence: "2026-10-26"
    estado: asignada

# D12: un referente crea tareas en su web (con el botón "Cargar la tarea", ADR 0024); los
# objetivos los crea Dirección (sin botón, nombrando a quien los crea).
pasos:
  - paso: 1
    quien: Marcos
    a_las: "2026-10-19 10:30"
    escribe: "necesito cargarle una tarea a nahuel para que revise los sensores"
    jugadas:
      - {nombre: pedir_crear, que_quiere_crear: tarea}
    efectos: {}
    hechos:
      - {jugada: pedir_crear, resultado: lo_puede_crear, que_quiere_crear: tarea,
         lleva_el_boton: Cargar la tarea}
    pregunta: null
    botones: []
    enlace: false
    enlace_web: true
    estado_despues:
      pregunta_abierta: null
    dice:
      - que la carga él mismo, tocando «Cargar la tarea»
    no_dice:
      - que cargó la tarea
      - que por chat no se creó nada
      - un enlace, o que pida uno
      - una dirección escrita por la IA

  - paso: 2
    quien: Marcos
    a_las: "2026-10-19 11:00"
    escribe: "y si quiero crear un objetivo para la linea 3?"
    jugadas:
      - {nombre: pedir_crear, que_quiere_crear: objetivo}
    efectos: {}
    hechos:
      - {jugada: pedir_crear, resultado: lo_crean_otros, que_quiere_crear: objetivo,
         lo_hacen: [Ismael Soschinski], lleva_el_boton: ausente,
         pronto_podra_proponerlo: ausente}
    pregunta: null
    botones: []
    enlace: false
    enlace_web: false
    estado_despues:
      pregunta_abierta: null
    dice:
      - que los objetivos los crea Dirección, Ismael
    no_dice:
      - que creó el objetivo
      - que por chat no se creó ninguno
      - que él lo puede crear en la web
