# Copia comprobable de la conversación: la fuente es el .md. Formato: tests/conversaciones/README.md.
fuente: tests/conversaciones/17-destrabar.md
numero: "17"
titulo: "Llegó el switch, sigo"
mide: garantias
persona: Marcos
inicio: "2026-10-20 09:00"
foco: [PLC]

tareas:
  PLC:
    titulo: Programar PLC de la comprimidora
    responsable: Marcos
    vence: "2026-10-23"
    estado: en_curso
    desde: "2026-10-19"
  COM:
    titulo: Revisar comunicaciones industriales de la comprimidora
    responsable: Marcos
    vence: "2026-10-30"
    estado: asignada
    depende_de: PLC

# Lo que ya pasó (estado inicial del .md): el aviso previo del martes 20 y el bloqueo de esa
# mañana, con la pregunta de quién lo destraba. Corre por el motor; los textos los redacta la IA
# de la corrida.
preludio:
  - quien: Leda
    relojes: ["2026-10-20 10:00"]
    salen: [{a: Marcos, tipo: aviso_previo, tarea: PLC}]
  - quien: Marcos
    a_las: "2026-10-20 10:20"
    escribe: "estoy trabado, espero el switch"
    jugadas:
      - {nombre: anotar_bloqueo, tarea: PLC, causa: "espero el switch"}

pasos:
  - paso: 1
    quien: Marcos
    a_las: "2026-10-21 09:40"
    escribe: "llego el switch, sigo"
    jugadas:
      - {nombre: destrabar, tarea: PLC}
    efectos:
      estados: {PLC: en_curso}
      bloqueos_resueltos: [PLC]
    hechos:
      - {jugada: destrabar, resultado: anotado, tarea: PLC,
         bloqueo_resuelto: {causa: "espero el switch"}, estado: en_curso,
         vuelve_a_pedir_el_estado: ausente, pregunta: ausente}
    pregunta: null
    estado_despues:
      pregunta_abierta: null
      para_despues: []
      esperas_abiertas: []
    dice:
      - que quedó anotado que la tarea se destrabó y sigue en curso
      - "el próximo paso concreto: que Leda le pide el estado el viernes 23, el día del vencimiento, o que puede avisar si se vuelve a trabar"
    no_dice:
      - que arrancó la tarea
      - una fecha para terminarla que nadie dio
      - otra vez la pregunta de quién lo destraba
      - que Ismael se enteró

  - paso: 2
    quien: nadie
    relojes: ["2026-10-21 10:00", "2026-10-22 10:00"]
    salen: []
    estado_despues:
      esperas_abiertas: []
    dice:
      - ninguna repregunta de quién lo destraba
      - nada a Ismael

  - paso: 3
    quien: Leda
    relojes: ["2026-10-23 10:00"]
    salen:
      - a: Marcos
        tipo: pedido_de_estado
        tarea: PLC
        hechos: {numero: 1, necesita_respuesta: true, vence: "2026-10-23",
                 atraso_dias_habiles: 0, estado: en_curso}
    estado_despues:
      pregunta_abierta: {tipo: estado_de_la_tarea, tarea: PLC}
      esperas_abiertas: [PLC]
    dice:
      - que la tarea del PLC vence hoy
      - pide el estado
    no_dice:
      - que va a avisar a Ismael
      - nada del bloqueo, que ya se cerró

  - paso: 4
    quien: Marcos
    a_las: "2026-10-23 10:20"
    escribe: "se quemo la fuente, otra vez parado"
    jugadas:
      - {nombre: anotar_bloqueo, tarea: PLC, causa: "se quemo la fuente"}
    efectos:
      estados: {PLC: bloqueada}
      bloqueos: [{tarea: PLC, causa: presente}]
    hechos:
      - {jugada: anotar_bloqueo, resultado: anotado, tarea: PLC, causa: presente,
         pregunta: quien_destraba}
    pregunta: {tipo: quien_destraba, tarea: PLC}
    estado_despues:
      pregunta_abierta: {tipo: quien_destraba, tarea: PLC}
      esperas_abiertas: [PLC]
    dice:
      - que quedó anotado el bloqueo y su causa
      - "una sola pregunta: quién lo puede destrabar"
    no_dice:
      - que Ismael se enteró o se va a enterar
      - el bloqueo anterior

  - paso: 5
    quien: Marcos
    a_las: "2026-10-23 11:30"
    escribe: "ya cambie la fuente, sigo"
    jugadas:
      - {nombre: destrabar, tarea: PLC}
    efectos:
      estados: {PLC: en_curso}
      bloqueos_resueltos: [PLC]
      avisos_guardados:
        - {tipo: repregunta_de_estado, tarea: PLC, a: Marcos, estado: guardado}
    hechos:
      - jugada: destrabar
        resultado: anotado
        tarea: PLC
        bloqueo_resuelto: {causa: "se quemo la fuente"}
        estado: en_curso
        vuelve_a_pedir_el_estado: {llega: "~2026-10-26"}
        veces_sin_algo_cierto: 1
        vencida: ausente
        pregunta: ausente
    pregunta: null
    estado_despues:
      pregunta_abierta: null
      para_despues: []
      esperas_abiertas: [PLC]
    dice:
      - que quedó anotado que la tarea se destrabó y sigue en curso
      - que el lunes le vuelve a pedir el estado
    no_dice:
      - una fecha para terminarla
      - que va a avisar a Ismael o que se escala
      - un reproche
      - otra pregunta

  - paso: 6
    quien: Leda
    relojes: ["2026-10-26 10:00"]
    salen:
      - a: Marcos
        tipo: repregunta_de_estado
        tarea: PLC
        hechos: {necesita_respuesta: true, avance_anterior: {jugada: destrabar, dijo: presente},
                 espera_algo_cierto: presente, si_no_hay_respuesta: ausente}
    estado_despues:
      pregunta_abierta: {tipo: estado_de_la_tarea, tarea: PLC}
      esperas_abiertas: [PLC]
    dice:
      - que la tarea del PLC venció el viernes 23
      - lo que Marcos contó (que se destrabó)
      - pide el estado
    no_dice:
      - que va a avisar a Ismael
      - un reproche
