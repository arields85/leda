# Copia comprobable de la conversación: la fuente es el .md. Formato: tests/conversaciones/README.md.
fuente: tests/conversaciones/21-entrega-con-evidencia.md
numero: "21"
titulo: "La entrega con su evidencia"
mide: garantias
persona: Marcos
inicio: "2026-10-19 09:00"

tareas:
  PLC:
    titulo: Programar PLC de la comprimidora
    criterio: "La comprimidora arranca desde el PLC y completa 20 ciclos sin fallas"
    responsable: Marcos
    vence: "2026-10-23"
    estado: en_curso
    desde: "2026-10-19"
  COM:
    titulo: Revisar comunicaciones industriales de la comprimidora
    criterio: "Los equipos de la comprimidora se comunican con el PLC por la red de planta sin errores durante una hora"
    responsable: Marcos
    vence: "2026-10-30"
    estado: asignada

# Lo que pide OT (`espacios/corework.yaml`, con las clases de cada tipo del ADR 0019, decisión 5).
evidencia:
  ot: [explicacion, resultado_de_prueba, captura, archivo]

# Lo que Marcos mandó durante la tarea y dijo que era del PLC (cómo se llega a esto es la 22).
mandado_antes:
  - {tarea: PLC, que: foto, el: "2026-10-20 11:05"}
  - {tarea: PLC, que: archivo, nombre: comprimidora_v3.zip, el: "2026-10-21 16:00"}

preludio:
  - quien: Leda
    relojes: ["2026-10-20 10:00"]
    salen: [{a: Marcos, tipo: aviso_previo, tarea: PLC}]

# El paso 8 corre desde la porción 3a de la C-3: el aviso a Ismael redactado por el motor, con las
# fotos adjuntas; desde la 3b, con los botones Aprobar y Pedir cambios; desde la 4, con el enlace
# a la página de la tarea al final, que agrega el despachador y sale sin vista previa (`enlace`).
pasos:
  # Lo escrito no dice todo el criterio (que arranca desde el PLC): Leda pregunta sólo esa parte,
  # con un ejemplo, y no hay nada que confirmar (decisión 10; C-3d, D7: con la IA real, 5 de 5).
  - paso: 1
    quien: Marcos
    a_las: "2026-10-22 15:10"
    escribe: "termine el plc!! ahi va la pantalla y el contador, 20 ciclos sin una falla"
    manda: [{que: foto}, {que: foto}]
    jugadas:
      - nombre: entregar
        tarea: PLC
        el_texto_cubre: [explicacion, resultado_de_prueba]
        lo_descrito_cubre: []
        # El ejemplo lo escribe la IA con sus palabras (sacado del criterio; la cocina lo verifica).
        # Lo que cubre el texto y lo descrito pueden faltar (la ficha los declara opcionales; un
        # texto cubre siempre lo que sólo un texto puede cubrir); si vienen, son éstos.
        puede_traer: [el_texto_cubre, lo_descrito_cubre, ejemplo]
    efectos: {}
    hechos:
      - {jugada: entregar, resultado: le_falta_evidencia, tarea: PLC,
         pregunta: lo_que_falta_de_la_entrega, sumo: [P1, P2, P3],
         entrega: [
           {pieza: P1, es: lo_que_escribio, describe: ausente,
            cubre: ["cómo quedó el trabajo, descrito por quien lo hizo",
                    "cómo se probó y qué dio la prueba"]},
           {pieza: P2, es: una_foto, cubre: ["una foto o una captura de la pantalla"]},
           {pieza: P3, es: una_foto, cubre: ["una foto o una captura de la pantalla"]},
           {pieza: P4, es: una_foto, mandado_antes_el: "2026-10-20",
            cubre: ["una foto o una captura de la pantalla"]},
           {pieza: P5, es: un_archivo, nombre_del_archivo: comprimidora_v3.zip,
            mandado_antes_el: "2026-10-21",
            cubre: ["un archivo del trabajo, por ejemplo el programa o la configuración"]}],
         le_falta: ausente,
         le_falta_del_criterio: ["La comprimidora arranca desde el PLC y completa 20 ciclos sin fallas"],
         ejemplo: presente, al_confirmar: ausente}
    pregunta: {tipo: lo_que_falta_de_la_entrega, tarea: PLC}
    botones: []
    estado_despues:
      pregunta_abierta: {tipo: lo_que_falta_de_la_entrega, tarea: PLC}
    dice:
      - "la tarea del PLC en su renglón con 📋"
      - "que sumó su descripción (cómo quedó y la prueba de 20 ciclos) y las dos fotos de hoy, y aparte, como mandadas antes, la foto del mar 20/10 y comprimidora_v3.zip del mié 21/10, que entran sólo si las deja"
      - "una sola vez qué falta para entregarla, hablando de la tarea: si la comprimidora arranca desde el PLC"
      - "el ejemplo, para que lo acepte o lo escriba con sus palabras; el cierre, aparte: si va así"
    no_dice:
      - que la tarea quedó entregada, en revisión o terminada
      - que falta saber si completó los 20 ciclos sin fallas (ya lo dijo)
      - qué muestran las fotos
      - los nombres de los tipos de la política
      - que falta el resultado de la prueba o que lo mande aparte
      - '"contaste" o "contarlo": lo que escribió es su descripción (decisión 10; D7)'

  # Marcos acepta el ejemplo: cuenta como lo que describe, y la entrega se puede confirmar.
  - paso: 2
    quien: Marcos
    a_las: "2026-10-22 15:11"
    escribe: "si va asi"
    jugadas:
      - {nombre: entregar, tarea: PLC, acepta_el_ejemplo: true, lo_descrito_cubre: [C1],
         puede_traer: [lo_descrito_cubre]}
    efectos: {}
    hechos:
      - {jugada: entregar, resultado: para_confirmar, tarea: PLC, pregunta: confirmar_la_entrega,
         le_falta: ausente, le_falta_del_criterio: ausente, ejemplo: ausente,
         entrega: [
           {pieza: P1, es: lo_que_escribio},
           {pieza: P2, es: una_foto},
           {pieza: P3, es: una_foto},
           {pieza: P4, es: el_ejemplo_que_acepto, dice: presente,
            describe: ["La comprimidora arranca desde el PLC y completa 20 ciclos sin fallas"]},
           {pieza: P5, es: una_foto, mandado_antes_el: "2026-10-20"},
           {pieza: P6, es: un_archivo, nombre_del_archivo: comprimidora_v3.zip}],
         al_confirmar: {queda_esperando_la_aprobacion_de: Ismael Soschinski}}
    pregunta: {tipo: confirmar_la_entrega, tarea: PLC}
    botones: [Confirmar]
    estado_despues:
      pregunta_abierta: {tipo: confirmar_la_entrega, tarea: PLC}
    dice:
      - "una pieza por renglón, con lo que cubre cada una en palabras de todos los días: su descripción, el ejemplo que aceptó, las dos fotos de hoy y, aparte, lo mandado antes"
      - que al confirmar la tarea pasa a revisión, sin nombrar a Ismael
      - "el cierre, aparte: si la entrega así, o si saca o corrige algo"
    no_dice:
      - que la tarea quedó entregada, en revisión o terminada
      - que Ismael se enteró
      - que el ejemplo lo escribió o lo contó Marcos (es el que aceptó)

  - paso: 3
    quien: Marcos
    a_las: "2026-10-22 15:12"
    escribe: "la foto del martes sacala, esa era del cableado viejo"
    jugadas:
      - {nombre: corregir, corrige: entregar, tarea: PLC, saca: [P5]}
    efectos: {}
    hechos:
      - {jugada: corregir, resultado: corregido, corrige: entregar, tarea: PLC,
         como_queda: para_confirmar, pregunta: confirmar_la_entrega,
         sacadas: [{es: una_foto, mandado_antes_el: "2026-10-20"}],
         entrega: [{pieza: P1, es: lo_que_escribio}, {pieza: P2, es: una_foto},
                   {pieza: P3, es: una_foto}, {pieza: P4, es: el_ejemplo_que_acepto},
                   {pieza: P5, es: un_archivo, nombre_del_archivo: comprimidora_v3.zip}]}
    pregunta: {tipo: confirmar_la_entrega, tarea: PLC}
    botones: [Confirmar]
    estado_despues:
      pregunta_abierta: {tipo: confirmar_la_entrega, tarea: PLC}
    dice:
      - que sacó la foto del martes
      - cómo queda la entrega, una pieza por renglón
      - "el cierre, aparte: si la entrega así"
    no_dice:
      - que la tarea quedó entregada

  - paso: 4
    quien: Marcos
    a_las: "2026-10-22 15:13"
    # El botón de la vista previa del paso 2, que la del paso 3 reemplazó (situación general 7).
    toca: Confirmar
    vieja: true
    efectos: {}
    hechos:
      - {jugada: elegir, resultado: sin_efecto, motivo: pregunta_cerrada,
         cerrada_con: {reemplazada: true, tarea: PLC}}
    pregunta: {tipo: confirmar_la_entrega, tarea: PLC, desde_antes: true}
    botones: [Confirmar]
    estado_despues:
      pregunta_abierta: {tipo: confirmar_la_entrega, tarea: PLC}
    dice:
      - que esa vista previa fue reemplazada por la que no tiene la foto del martes, que sigue esperando su confirmación
    no_dice:
      - que la entregó
      - nada técnico sobre botones o huellas

  - paso: 5
    quien: Marcos
    a_las: "2026-10-22 15:15"
    escribe: "y esta del tablero cerrado. dale mandala"
    manda: [{que: foto}]
    # Suma algo a la entrega que se está mostrando: `entregar` (su ficha; con la IA real, 5 de 5 en
    # la ronda D7). Lo que escribe es una pieza más, y la vista previa nueva espera su confirmación.
    jugadas:
      - {nombre: entregar, tarea: PLC, puede_traer: [el_texto_cubre, lo_descrito_cubre]}
    efectos: {}
    hechos:
      - {jugada: entregar, resultado: para_confirmar, tarea: PLC, sumo: [P5, P6],
         pregunta: confirmar_la_entrega,
         entrega: [{pieza: P1, es: lo_que_escribio}, {pieza: P2, es: una_foto},
                   {pieza: P3, es: una_foto}, {pieza: P4, es: el_ejemplo_que_acepto},
                   {pieza: P5, es: lo_que_escribio, dice: "y esta del tablero cerrado. dale mandala"},
                   {pieza: P6, es: una_foto},
                   {pieza: P7, es: un_archivo, nombre_del_archivo: comprimidora_v3.zip}]}
    pregunta: {tipo: confirmar_la_entrega, tarea: PLC}
    botones: [Confirmar]
    estado_despues:
      pregunta_abierta: {tipo: confirmar_la_entrega, tarea: PLC}
    dice:
      - que sumó la foto del tablero cerrado
      - cómo queda la entrega, una pieza por renglón
      - "el cierre, aparte: que la confirme así"
    no_dice:
      - que la entregó
      - que Ismael se enteró

  - paso: 6
    quien: Marcos
    a_las: "2026-10-22 15:16"
    escribe: "dale"
    jugadas:
      - {nombre: confirmar, tarea: PLC, puede_traer: [tarea]}
    efectos:
      estados: {PLC: en_revision}
      evidencias:
        - {tarea: PLC, clase: texto, cubre: [explicacion, resultado_de_prueba]}
        - {tarea: PLC, clase: imagen, cubre: [captura]}
        - {tarea: PLC, clase: imagen, cubre: [captura]}
        # El ejemplo que aceptó, con lo que describe del criterio.
        - {tarea: PLC, clase: texto, cubre: [explicacion]}
        # Lo que escribió con la foto del tablero (paso 5).
        - {tarea: PLC, clase: texto, cubre: [explicacion]}
        - {tarea: PLC, clase: imagen, cubre: [captura]}
        - {tarea: PLC, clase: archivo, cubre: [archivo]}
      # El aviso a Ismael, guardado: sale terminado el margen para corregir (ADR 0018, 9n).
      avisos_guardados:
        - {tipo: entrega_para_aprobar, tarea: PLC, a: Ismael, estado: guardado}
    hechos:
      - {jugada: confirmar, resultado: entregada, tarea: PLC, estado: en_revision,
         queda_esperando_la_aprobacion_de: Ismael Soschinski,
         se_le_avisa_cuando_decida: true, se_le_avisa_si_hace_falta_algo_mas: true,
         aviso_a_quien_aprueba: {a: Ismael Soschinski, llega: "~2026-10-22T15:26"}}
    pregunta: null
    estado_despues:
      pregunta_abierta: null
    dice:
      - que quedó entregada y pasa a revisión
      - que le avisa cuando la revisen o si hace falta algo más, en primera persona
    no_dice:
      - que la tarea está terminada o aprobada
      - que Ismael ya la vio
      - el nombre de Ismael (no lo preguntó)
      - a qué hora se entera quien la revisa (no lo preguntó)
      - un ⚠️ porque está en revisión
      - la foto del martes

  # La pregunta de a quién se le avisó (decisión 11 del usuario, 2026-10-08): no lleva jugada y
  # se contesta del registro, con el nombre que la redacción tiene sólo para si lo pregunta.
  - paso: 7
    quien: Marcos
    a_las: "2026-10-22 15:20"
    escribe: "a quien le avisaste?"
    jugadas: []
    efectos: {}
    pregunta: null
    estado_despues:
      pregunta_abierta: null
    dice:
      - que a Ismael, y que le llega hoy a las 15:26, como algo que todavía no pasó
    no_dice:
      - que Ismael ya la vio o ya se enteró
      - que la tarea está terminada o aprobada
      - una pregunta

  - paso: 8
    quien: Leda
    relojes: ["2026-10-22 15:26"]
    salen:
      - a: Ismael
        tipo: entrega_para_aprobar
        tarea: PLC
        # Las tres fotos de hoy, adjuntas en el álbum que sigue al texto; los botones, con el
        # texto (porción 3b).
        fotos: 3
        botones: [Aprobar, Pedir cambios]
        enlace: true
        hechos:
          necesita_respuesta: true
          pregunta: decision_de_la_entrega
          fotos_adjuntas: 3
          lleva_el_enlace_a_la_pagina_de_la_tarea: true
          lo_que_entrego:
            - {es: lo_que_escribio}
            - {es: una_foto, va_adjunta: true}
            - {es: una_foto, va_adjunta: true}
            # El ejemplo que aceptó: lo aceptó, no lo escribió (D8, migración 0039).
            - {es: el_ejemplo_que_acepto}
            - {es: lo_que_escribio}
            - {es: una_foto, va_adjunta: true}
            - {es: un_archivo, nombre_del_archivo: comprimidora_v3.zip}
          todavia_le_falta: ausente
    dice:
      - que Marcos entregó la tarea del PLC, en su renglón con 📋
      - lo que describió Marcos, en pocas palabras (arranca desde el PLC y 20 ciclos sin una falla)
      - que la descripción de lo que faltaba Marcos la aceptó o la confirmó, no que la escribió
      - que van tres fotos adjuntas y que comprimidora_v3.zip está en la página de la tarea
      - "el cierre, aparte: que la revise y decida, con los botones o escribiendo"
    no_dice:
      - que Marcos escribió la descripción que aceptó
      - la foto del martes
      - que la tarea está terminada
      - un juicio sobre lo que muestran las fotos
      - una dirección o un enlace escrito por la IA
