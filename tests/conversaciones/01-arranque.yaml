# Copia comprobable de la conversación: la fuente es el .md. Formato: tests/conversaciones/README.md.
fuente: tests/conversaciones/01-arranque.md
numero: "01"
titulo: "Arranqué"
mide: garantias
persona: Marcos
inicio: "2026-10-20 09:00"

tareas:
  PLC:
    titulo: Programar PLC de la comprimidora
    criterio: "La comprimidora arranca desde el PLC y completa 20 ciclos sin fallas"
    responsable: Marcos
    vence: "2026-10-23"
    estado: asignada
  COM:
    titulo: Revisar comunicaciones industriales de la comprimidora
    criterio: "Los equipos de la comprimidora se comunican con el PLC por la red de planta sin errores durante una hora"
    responsable: Marcos
    vence: "2026-10-30"
    estado: asignada

pasos:
  - paso: 1
    quien: Leda
    relojes: ["2026-10-20 10:00"]
    salen:
      - a: Marcos
        tipo: aviso_previo
        tarea: PLC
        hechos: {vence: "2026-10-23", necesita_respuesta: false,
                 dias_habiles_hasta_el_vencimiento: 3}
    estado_despues:
      ultimo_aviso: {Marcos: PLC}
      esperas_abiertas: []
      pregunta_abierta: null
    dice:
      - el título de la tarea del PLC
      - que vence el viernes 23
      - que no hace falta contestar
    no_dice:
      - la tarea de comunicaciones
      - que es urgente
      - ningún avance que nadie informó

  - paso: 2
    quien: Marcos
    a_las: "2026-10-20 11:15"
    escribe: "arranque hoy a la mañana, ya estoy en eso"
    jugadas:
      - {nombre: anotar_inicio, tarea: PLC}
    efectos:
      estados: {PLC: en_curso}
    hechos:
      - {jugada: anotar_inicio, resultado: anotado, tarea: PLC, estado: en_curso}
    pregunta: null
    estado_despues:
      pregunta_abierta: null
      para_despues: []
    dice:
      - que quedó anotado que arrancó la tarea del PLC, nombrándola
    no_dice:
      - que la tarea está terminada
      - nada de la tarea de comunicaciones
      - que la fecha cambió

  - paso: 3
    quien: nadie
    relojes: ["2026-10-21 10:00", "2026-10-21 16:00", "2026-10-22 10:00", "2026-10-22 16:00"]
    salen: []

  - paso: 4
    quien: Leda
    relojes: ["2026-10-23 10:00"]
    salen:
      - a: Marcos
        tipo: pedido_de_estado
        tarea: PLC
        hechos: {numero: 1, necesita_respuesta: true, vence: "2026-10-23",
                 atraso_dias_habiles: 0, estado: en_curso, estado_desde: "2026-10-20"}
    estado_despues:
      esperas_abiertas: [PLC]
      pregunta_abierta: {tipo: estado_de_la_tarea, tarea: PLC}
    dice:
      - que la tarea del PLC vence hoy
      - que está en curso desde el martes
      - pide el estado
    no_dice:
      - que no arrancó
      - que no contestó el aviso (no pedía respuesta)
      - nada que pida arrancarla
