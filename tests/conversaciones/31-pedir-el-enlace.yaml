# Copia comprobable de la conversación: la fuente es el .md. Formato: tests/conversaciones/README.md.
fuente: tests/conversaciones/31-pedir-el-enlace.md
numero: "31"
titulo: "Pedir el enlace a la página de una tarea"
mide: garantias
persona: Marcos
inicio: "2026-10-23 10:00"

tareas:
  PLC:
    titulo: Programar PLC de la comprimidora
    criterio: "La comprimidora arranca desde el PLC y completa 20 ciclos sin fallas"
    responsable: Marcos
    vence: "2026-10-30"
    estado: en_curso
    desde: "2026-10-19"
  COM:
    titulo: Revisar comunicaciones industriales de la comprimidora
    criterio: "Los equipos de la comprimidora se comunican con el PLC por la red de planta sin errores durante una hora"
    responsable: Marcos
    vence: "2026-10-23"
    estado: terminada
    desde: "2026-10-21"
  SRV:
    titulo: Instalar el servidor de la planta
    criterio: "El servidor queda en el rack de la planta, con su respaldo diario funcionando y probado una vez"
    responsable: Lucas
    vence: "2026-10-30"
    estado: en_curso
    desde: "2026-10-19"

pasos:
  - paso: 1
    quien: Marcos
    a_las: "2026-10-23 10:30"
    escribe: "me pasas el link de la tarea del plc"
    jugadas:
      - {nombre: pedir_enlace, tarea: PLC}
    efectos: {}
    hechos:
      - {jugada: pedir_enlace, resultado: leido, tarea: PLC,
         lleva_el_enlace_a_la_pagina_de_la_tarea: true}
    pregunta: null
    botones: []
    enlace: true
    dice:
      - que ahí va el enlace a la página de la tarea del PLC

  # No está en la lista de Ismael: está terminada y no espera su revisión. La nombra por cómo
  # la dijo (`como_la_nombra`) y la cocina la busca entre las del espacio.
  - paso: 2
    quien: Ismael
    a_las: "2026-10-23 10:45"
    escribe: "pasame el link de la de comunicaciones de marcos q ya la termino"
    jugadas:
      - {nombre: pedir_enlace, como_la_nombra: "comunicaciones de marcos"}
    efectos: {}
    hechos:
      - {jugada: pedir_enlace, resultado: leido, tarea: COM, responsable: Marcos Tarquini,
         lleva_el_enlace_a_la_pagina_de_la_tarea: true}
    pregunta: null
    botones: []
    enlace: true
    dice:
      - que ahí va el enlace a la página de la tarea de comunicaciones de Marcos

  # Ismael no aprueba el trabajo de Lucas: la ve por ser la autoridad final del espacio.
  - paso: 3
    quien: Ismael
    a_las: "2026-10-23 10:50"
    escribe: "y el de la del servidor de lucas"
    jugadas:
      - {nombre: pedir_enlace, como_la_nombra: "servidor de lucas"}
    efectos: {}
    hechos:
      - {jugada: pedir_enlace, resultado: leido, tarea: SRV, responsable: Lucas Natuche,
         lleva_el_enlace_a_la_pagina_de_la_tarea: true}
    pregunta: null
    botones: []
    enlace: true
    dice:
      - que ahí va el enlace a la página de la tarea del servidor

  # Nahuel no es su responsable, no aprueba el trabajo de Marcos ni decidió sobre ella, no es
  # el referente del área ni la autoridad final: ningún enlace.
  - paso: 4
    quien: Nahuel
    a_las: "2026-10-23 11:00"
    escribe: "hola leda me pasas el link del plc de marcos? quiero ver como viene"
    jugadas:
      - {nombre: pedir_enlace, como_la_nombra: "plc de marcos"}
    efectos: {}
    hechos:
      - {jugada: pedir_enlace, resultado: no_se_puede, motivo: no_puede_ver_esa_tarea,
         lleva_el_enlace_a_la_pagina_de_la_tarea: ausente}
    pregunta: null
    botones: []
    enlace: false
    dice:
      - que el enlace de esa tarea no se lo puede pasar, en palabras simples
    no_dice:
      - quién puede verla
      - nombres de la base, de funciones o de permisos
      - que la tarea no existe
