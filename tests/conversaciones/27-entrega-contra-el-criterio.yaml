# Copia comprobable de la conversación: la fuente es el .md. Formato: tests/conversaciones/README.md.
fuente: tests/conversaciones/27-entrega-contra-el-criterio.md
numero: "27"
titulo: "La entrega frente al criterio de aceptación"
mide: garantias
persona: Marcos
inicio: "2026-10-19 09:00"

tareas:
  PLC:
    titulo: Programar PLC de la comprimidora
    criterio: "La comprimidora arranca desde el PLC y completa 20 ciclos sin fallas"
    responsable: Marcos
    vence: "2026-10-23"
    estado: en_curso
    desde: "2026-10-19"
  COM:
    titulo: Revisar comunicaciones industriales de la comprimidora
    criterio: "Los equipos de la comprimidora se comunican con el PLC por la red de planta sin errores durante una hora"
    responsable: Marcos
    vence: "2026-10-30"
    estado: asignada

# Más corta que la del pack, para mirar sólo el criterio de aceptación.
evidencia:
  ot: [explicacion, captura]

pasos:
  - paso: 1
    quien: Marcos
    a_las: "2026-10-22 15:00"
    escribe: "termine el plc, ya arranca desde el plc"
    manda: [{que: foto}]
    # La IA juzga lo descrito punto por punto y propone un ejemplo sacado del criterio; el código
    # decide que falta y lo verifica (C-3d, D3).
    jugadas:
      - nombre: entregar
        tarea: PLC
        el_texto_cubre: [explicacion]
        lo_descrito_cubre: []
        # El ejemplo lo escribe la IA con sus palabras (sacado del criterio; la cocina lo verifica):
        # puede venir con cualquier texto, y si no viene la cocina propone el punto tal cual.
        puede_traer: [lo_descrito_cubre, ejemplo]
    efectos: {}
    hechos:
      - {jugada: entregar, resultado: le_falta_evidencia, tarea: PLC,
         pregunta: lo_que_falta_de_la_entrega, sumo: [P1, P2], le_falta: ausente,
         le_falta_del_criterio: ["La comprimidora arranca desde el PLC y completa 20 ciclos sin fallas"],
         ejemplo: presente,
         entrega: [{pieza: P1, es: lo_que_escribio, describe: ausente},
                   {pieza: P2, es: una_foto}]}
    pregunta: {tipo: lo_que_falta_de_la_entrega, tarea: PLC}
    botones: []
    estado_despues:
      pregunta_abierta: {tipo: lo_que_falta_de_la_entrega, tarea: PLC}
    dice:
      - que para revisar la tarea falta saber si la comprimidora completó los 20 ciclos sin fallas, en palabras simples y hablando de la tarea
      - "el ejemplo, para que lo acepte o lo escriba con sus palabras"
      - una sola vez qué falta para entregarla, sin repetir que todavía no se entrega o no pasa a revisión (D7)
    no_dice:
      - que la entregó o que está en revisión
      - el nombre de Ismael
      - que falta que arranque desde el PLC
      - un número o un nombre que no estén en el criterio ni en lo que escribió
      - '"contaste" o "contarlo": lo que escribió es su descripción (decisión 10; D7)'

  # Una pregunta sobre lo que Leda le pidió: no es una jugada, y la pregunta abierta vuelve con su
  # ejemplo.
  - paso: 2
    quien: Marcos
    a_las: "2026-10-22 15:02"
    escribe: "y que pongo?"
    jugadas: []
    efectos: {}
    pregunta: {tipo: lo_que_falta_de_la_entrega, tarea: PLC, desde_antes: true,
               ejemplo: presente}
    botones: []
    estado_despues:
      pregunta_abierta: {tipo: lo_que_falta_de_la_entrega, tarea: PLC}
    dice:
      - "el ejemplo, para que lo acepte tal cual o lo escriba con sus palabras"
    no_dice:
      - que la entregó
      - un dato que no esté en el criterio ni en lo que escribió

  # Insistir no la entrega: lo descrito no cubre el criterio (decisión 10 del usuario).
  - paso: 3
    quien: Marcos
    a_las: "2026-10-22 15:03"
    escribe: "no, asi esta, mandala"
    # Pide que vaya como está: `confirmar`, que no entrega con algo pendiente. Si la IA lo deja
    # fuera de la lista como respuesta a la pregunta abierta (`contesta_la_pregunta`), la maneja
    # esa pregunta y no hay aviso a la administración (C-3d, D7).
    jugadas:
      - {nombre: confirmar, tarea: PLC, puede_traer: [tarea]}
    efectos: {}
    hechos:
      - {jugada: confirmar, resultado: no_vale_la_confirmacion, motivo: le_falta_algo,
         como_queda: le_falta_evidencia, tarea: PLC, pregunta: lo_que_falta_de_la_entrega,
         le_falta_del_criterio: ["La comprimidora arranca desde el PLC y completa 20 ciclos sin fallas"],
         ejemplo: presente}
    pregunta: {tipo: lo_que_falta_de_la_entrega, tarea: PLC}
    botones: []
    estado_despues:
      pregunta_abierta: {tipo: lo_que_falta_de_la_entrega, tarea: PLC}
    dice:
      - que todavía no la puede pasar a revisión porque falta saber si completó los 20 ciclos sin fallas
      - "el ejemplo otra vez, como próximo paso"
    no_dice:
      - que la entregó
      - que Ismael se enteró
      - un reproche

  # Marcos acepta el ejemplo: cuenta como lo que describe él, una pieza más (C-3d, D3).
  - paso: 4
    quien: Marcos
    a_las: "2026-10-22 15:05"
    escribe: "si, eso"
    jugadas:
      - {nombre: entregar, tarea: PLC, acepta_el_ejemplo: true, lo_descrito_cubre: [C1],
         puede_traer: [lo_descrito_cubre, el_texto_cubre]}
    efectos: {}
    hechos:
      - {jugada: entregar, resultado: para_confirmar, tarea: PLC, pregunta: confirmar_la_entrega,
         le_falta_del_criterio: ausente, ejemplo: ausente,
         entrega: [
           {pieza: P1, es: lo_que_escribio, dice: "termine el plc, ya arranca desde el plc"},
           {pieza: P2, es: una_foto},
           # El ejemplo que aceptó: no lo escribió él, y la vista previa lo dice así (C-3d, D7).
           {pieza: P3, es: el_ejemplo_que_acepto,
            dice: presente,
            describe: ["La comprimidora arranca desde el PLC y completa 20 ciclos sin fallas"]}]}
    pregunta: {tipo: confirmar_la_entrega, tarea: PLC}
    botones: [Confirmar]
    estado_despues:
      pregunta_abierta: {tipo: confirmar_la_entrega, tarea: PLC}
    dice:
      - "la tarea del PLC en su renglón con 📋"
      - "una pieza por renglón: lo que escribió, la foto y lo que aceptó"
      - que al confirmar pasa a revisión
      - "el cierre, aparte: si la entrega así"
    no_dice:
      - que la entregó
      - el nombre de Ismael
      - que el ejemplo lo escribió o lo contó Marcos (es el que aceptó)

  - paso: 5
    quien: Marcos
    a_las: "2026-10-22 15:06"
    toca: Confirmar
    efectos:
      estados: {PLC: en_revision}
      evidencias:
        - {tarea: PLC, clase: texto, cubre: [explicacion]}
        - {tarea: PLC, clase: imagen, cubre: [captura]}
        - {tarea: PLC, clase: texto, cubre: [explicacion]}
      avisos_guardados:
        - {tipo: entrega_para_aprobar, tarea: PLC, a: Ismael, estado: guardado}
    hechos:
      - {jugada: confirmar, resultado: entregada, tarea: PLC, estado: en_revision,
         aviso_a_quien_aprueba: {a: Ismael Soschinski, llega: "~2026-10-22T15:16"}}
    pregunta: null
    estado_despues:
      pregunta_abierta: null
    dice:
      - que quedó entregada y pasa a revisión
      - que le avisa cuando la revisen o si hace falta algo más
    no_dice:
      - el nombre de Ismael
      - que la tarea está terminada o aprobada

  # El aviso a Ismael sale terminado el margen para corregir, con la foto adjunta.
  - paso: 6
    quien: Leda
    relojes: ["2026-10-22 15:16"]
    salen:
      - a: Ismael
        tipo: entrega_para_aprobar
        tarea: PLC
        fotos: 1
        botones: [Aprobar, Pedir cambios]
        hechos:
          necesita_respuesta: true
          pregunta: decision_de_la_entrega
          lo_que_entrego:
            - {es: lo_que_escribio}
            - {es: una_foto, va_adjunta: true}
            # El ejemplo que aceptó en el paso 4: lo aceptó, no lo escribió (D8).
            - {es: el_ejemplo_que_acepto}
    dice:
      - que Marcos entregó la tarea del PLC, en su renglón con 📋
      - lo que describió Marcos, en pocas palabras, y que lo de los 20 ciclos lo aceptó o confirmó
      - que va una foto adjunta
      - "el cierre, aparte: que la revise y decida, con los botones o escribiendo"
    no_dice:
      - que Marcos escribió lo de los 20 ciclos

  # La foto que retira Marcos deja la entrega sin la captura (decisión 15 del usuario,
  # 2026-10-08): Leda pide la pieza correcta y la revisión espera.
  - paso: 7
    quien: Marcos
    a_las: "2026-10-22 15:20"
    escribe: "la foto sacala, era de otra maquina"
    jugadas:
      - {nombre: corregir, corrige: entregar, tarea: PLC, saca: [P2]}
    efectos:
      retiradas: [{tarea: PLC, clase: imagen}]
    hechos:
      - {jugada: corregir, resultado: corregido, corrige: entregar, tarea: PLC,
         retiradas: [{es: una_foto}], como_queda: le_falta_evidencia,
         le_falta: ["una foto o una captura de la pantalla"], la_revision_espera: true,
         pregunta: lo_que_falta_de_la_entrega}
    pregunta: {tipo: lo_que_falta_de_la_entrega, tarea: PLC}
    botones: []
    estado_despues:
      pregunta_abierta: {tipo: lo_que_falta_de_la_entrega, tarea: PLC}
    dice:
      - que sacó la foto
      - que para revisar la tarea falta una foto o una captura de la pantalla, y que la revisión espera hasta que esté
      - "el cierre, aparte: que mande la foto correcta"
    no_dice:
      - que la tarea dejó de estar entregada o volvió a en curso
      - el nombre de Ismael

  # Ismael toca Aprobar en el aviso que ya le llegó: no cambia nada.
  - paso: 8
    quien: Ismael
    a_las: "2026-10-22 15:25"
    toca: Aprobar
    de_la_tarea: PLC
    efectos: {}
    hechos:
      - {jugada: aprobar, resultado: no_se_puede, motivo: la_entrega_se_esta_completando,
         tarea: PLC, se_le_avisa_cuando_este_completa: true}
    dice:
      - que Marcos está completando la entrega de la tarea del PLC
      - que le avisa cuando esté completa
    no_dice:
      - que la aprobó o que quedó terminada
      - qué foto se retiró o por qué

  # La foto correcta completa la entrega: se confirma como siempre.
  - paso: 9
    quien: Marcos
    a_las: "2026-10-22 15:30"
    manda: [{que: foto}]
    # Suma la foto a la entrega abierta: `entregar` (su ficha; con la IA real, 5 de 5 en la ronda
    # D7). Sin jugada, la cocina la suma igual (lo que trajo el mensaje, `entrega.para_la_duda`).
    jugadas:
      - {nombre: entregar, tarea: PLC, puede_traer: [lo_descrito_cubre, el_texto_cubre]}
    efectos: {}
    hechos:
      - {jugada: entregar, resultado: para_confirmar, tarea: PLC, pregunta: confirmar_la_entrega,
         sumo: [P1], entrega: [{pieza: P1, es: una_foto}]}
    pregunta: {tipo: confirmar_la_entrega, tarea: PLC}
    botones: [Confirmar]
    estado_despues:
      pregunta_abierta: {tipo: confirmar_la_entrega, tarea: PLC}
    dice:
      - que sumó la foto y que con eso la entrega queda completa
      - "el cierre, aparte: si la suma así"

  - paso: 10
    quien: Marcos
    a_las: "2026-10-22 15:31"
    escribe: "dale"
    jugadas:
      - {nombre: confirmar, tarea: PLC, puede_traer: [tarea]}
    efectos:
      evidencias:
        - {tarea: PLC, clase: imagen, cubre: [captura]}
      avisos_guardados:
        - {tipo: entrega_para_aprobar, tarea: PLC, a: Ismael, estado: guardado}
    hechos:
      - {jugada: confirmar, resultado: entrega_completa, tarea: PLC, estado: en_revision,
         aviso_a_quien_aprueba: {a: Ismael Soschinski, llega: "~2026-10-22T15:55"}}
    pregunta: null
    estado_despues:
      pregunta_abierta: null
    dice:
      - que la entrega quedó completa y sigue en revisión
      - que le avisa cuando la revisen o si hace falta algo más
    no_dice:
      - el nombre de Ismael
      - que la tarea está terminada o aprobada

  # A Ismael le llega un aviso nuevo con todo lo vigente (ADR 0009, enmienda T6i): terminado el
  # margen para corregir (15:41) y 30 minutos después de que tocó "Aprobar" (15:25; no
  # interrumpir, D5, la 26). A las 15:41 todavía espera.
  - paso: 11
    quien: Leda
    relojes: ["2026-10-22 15:41", "2026-10-22 15:55"]
    salen:
      - a: Ismael
        tipo: entrega_para_aprobar
        tarea: PLC
        fotos: 1
        botones: [Aprobar, Pedir cambios]
        hechos:
          necesita_respuesta: true
          pregunta: decision_de_la_entrega
          lo_que_entrego:
            - {es: lo_que_escribio}
            - {es: el_ejemplo_que_acepto}
            - {es: una_foto, va_adjunta: true}
    dice:
      - que Marcos completó la entrega de la tarea del PLC, en su renglón con 📋
      - que va la foto nueva adjunta
      - "el cierre, aparte: que la revise y decida, con los botones o escribiendo"
    no_dice:
      - la foto retirada

  # Comunicaciones nunca se arrancó: "ya está" se recibe igual (decisión 14 del usuario,
  # 2026-10-08), y lo escrito dice lo que pide su criterio, así que no se pregunta nada.
  - paso: 12
    quien: Marcos
    a_las: "2026-10-23 10:00"
    escribe: "lo de comunicaciones ya esta, los equipos se comunicaron con el plc por la red de planta una hora sin errores"
    manda: [{que: foto}]
    jugadas:
      - {nombre: entregar, tarea: COM, el_texto_cubre: [explicacion], lo_descrito_cubre: [C1]}
    efectos: {}
    hechos:
      - {jugada: entregar, resultado: para_confirmar, tarea: COM, pregunta: confirmar_la_entrega,
         le_falta_del_criterio: ausente,
         al_confirmar: {estado: en_revision, arranca_al_entregarla: true}}
    pregunta: {tipo: confirmar_la_entrega, tarea: COM}
    botones: [Confirmar]
    estado_despues:
      pregunta_abierta: {tipo: confirmar_la_entrega, tarea: COM}
    dice:
      - "la tarea de comunicaciones en su renglón con 📋"
      - "una pieza por renglón: lo que escribió y la foto"
      - que al confirmar pasa a revisión
      - "el cierre, aparte: si la entrega así"
    no_dice:
      - que le falta arrancarla o que no figura como arrancada
      - qué falta del criterio

  - paso: 13
    quien: Marcos
    a_las: "2026-10-23 10:01"
    escribe: "dale"
    jugadas:
      - {nombre: confirmar, tarea: COM, puede_traer: [tarea]}
    efectos:
      estados: {COM: en_revision}
      evidencias:
        - {tarea: COM, clase: texto, cubre: [explicacion]}
        - {tarea: COM, clase: imagen, cubre: [captura]}
      avisos_guardados:
        - {tipo: entrega_para_aprobar, tarea: COM, a: Ismael, estado: guardado}
    hechos:
      - {jugada: confirmar, resultado: entregada, tarea: COM, estado: en_revision,
         arranco_al_entregarla: true}
    pregunta: null
    estado_despues:
      pregunta_abierta: null
    dice:
      - que quedó entregada y pasa a revisión
      - que le avisa cuando la revisen o si hace falta algo más
    no_dice:
      - el nombre de Ismael
      - que la tarea está terminada o aprobada
      - una fecha de inicio anterior a hoy
