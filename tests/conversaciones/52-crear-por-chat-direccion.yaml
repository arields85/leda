# Copia comprobable de la conversación: la fuente es el .md. Formato: tests/conversaciones/README.md.
fuente: tests/conversaciones/52-crear-por-chat-direccion.md
numero: "52"
titulo: "Crear por chat: Dirección"
mide: garantias
persona: Ismael
inicio: "2026-10-19 09:00"

tareas:
  SRV:
    titulo: Aprobar la compra del servidor nuevo
    criterio: "La compra del servidor queda aprobada por escrito con su presupuesto"
    responsable: Ismael
    vence: "2026-10-23"
    estado: asignada

# Por chat no se crea nada (ADR 0017, decisión 2): la cocina dice quién lo crea según quién es la
# persona (D12). Dirección crea tareas y objetivos: la respuesta lleva el botón que abre el
# formulario en su web (ADR 0024, decisión 2: "Cargar la tarea", "Crear el objetivo";
# `enlace_web`), que pone el despachador. Ningún enlace de entrada se emite.
pasos:
  - paso: 1
    quien: Ismael
    a_las: "2026-10-19 10:30"
    escribe: "quiero crear una tarea nueva para lucas, que instale el servidor"
    jugadas:
      - {nombre: pedir_crear, que_quiere_crear: tarea}
    efectos: {}
    hechos:
      - {jugada: pedir_crear, resultado: lo_puede_crear, que_quiere_crear: tarea,
         lleva_el_boton: Cargar la tarea}
    pregunta: null
    botones: []
    enlace: false
    enlace_web: true
    estado_despues:
      pregunta_abierta: null
    dice:
      - que la carga él mismo, tocando «Cargar la tarea»
    no_dice:
      - que creó la tarea
      - que por chat no se creó nada
      - un enlace, o que pida uno
      - una dirección escrita por la IA

  - paso: 2
    quien: Ismael
    a_las: "2026-10-19 11:00"
    escribe: "y un objetivo nuevo para la ampliación de la planta como lo armo?"
    jugadas:
      - {nombre: pedir_crear, que_quiere_crear: objetivo}
    efectos: {}
    hechos:
      - {jugada: pedir_crear, resultado: lo_puede_crear, que_quiere_crear: objetivo,
         lleva_el_boton: Crear el objetivo}
    pregunta: null
    botones: []
    enlace: false
    enlace_web: true
    estado_despues:
      pregunta_abierta: null
    dice:
      - que lo crea él mismo, tocando «Crear el objetivo»
    no_dice:
      - que creó el objetivo
      - que por chat no se creó nada
      - un enlace, o que pida uno
      - una dirección escrita por la IA
