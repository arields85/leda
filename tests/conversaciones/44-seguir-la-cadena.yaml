# Copia comprobable de la conversación: la fuente es el .md. Formato: tests/conversaciones/README.md.
fuente: tests/conversaciones/44-seguir-la-cadena.md
numero: "44"
titulo: "Seguir la cadena hasta quien puede destrabarla"
mide: garantias
persona: Marcos
inicio: "2026-10-20 09:00"
foco: [PLC, SRV]

tareas:
  SRV:
    titulo: Configurar el servidor de CoreLabs de la comprimidora
    criterio: "El servidor de CoreLabs de la comprimidora tiene su IP fija en la red de planta y responde desde el PLC"
    responsable: Ariel
    vence: "2026-11-13"
    estado: en_curso
    desde: "2026-10-19"
  PLC:
    titulo: Programar PLC de la comprimidora
    criterio: "La comprimidora arranca desde el PLC y completa 20 ciclos sin fallas"
    responsable: Marcos
    vence: "2026-11-13"
    estado: en_curso
    desde: "2026-10-19"
    depende_de: SRV

pasos:
  - paso: 1
    quien: Ariel
    a_las: "2026-10-20 10:20"
    escribe: "estoy parado con el servidor xq falta el switch nuevo, lo pone lucas"
    jugadas:
      - {nombre: anotar_bloqueo, tarea: SRV, causa: "falta el switch nuevo"}
      - {nombre: anotar_quien_destraba, quien: "lucas", puede_traer: [tarea]}
    efectos:
      estados: {SRV: bloqueada}
      bloqueos: [{tarea: SRV, causa: presente}]
      destraban: [{tarea: SRV, integrante: Lucas, alguien: true, no_sabe: false, de: Ariel}]
      avisos_guardados:
        - {tipo: pregunta_a_quien_destraba, tarea: SRV, a: Lucas, estado: guardado}
    hechos:
      - {jugada: anotar_bloqueo, resultado: anotado, tarea: SRV, avisos_a_quienes_esperan: ausente}
      - {jugada: anotar_quien_destraba, resultado: anotado,
         se_le_pregunta_a: {a: Lucas Natuche, llega: "~2026-10-20T10:30"}}
    pregunta: null
    dice:
      - que quedó anotado que está trabado con el servidor y que lo destraba Lucas
      - que Leda le pregunta a Lucas

  - paso: 2
    quien: Leda
    relojes: ["2026-10-20 10:30"]
    salen:
      - a: Lucas
        tipo: pregunta_a_quien_destraba
        tarea: SRV
        hechos: {necesita_respuesta: true, pregunta: cuando_se_destraba,
                 responsable: Ariel De Simone, causa: presente}
    estado_despues:
      de: Lucas
      pregunta_abierta: {tipo: cuando_se_destraba, tarea: SRV}
      esperas_abiertas: [SRV]

  - paso: 3
    quien: Lucas
    a_las: "2026-10-20 10:45"
    escribe: "el switch llega el jueves"
    jugadas:
      - {nombre: decir_cuando_destraba, tarea: SRV, para_cuando: "2026-10-22",
         puede_traer: [lo_que_dice]}
    # El día que dijo, Leda le vuelve a preguntar si llegó (decisión 42).
    efectos:
      dicen_quien_destraba: [{tarea: SRV, de: Lucas, para_cuando: "2026-10-22", ya_esta: false}]
      avisos_guardados:
        - {tipo: lo_que_dijo_quien_destraba, tarea: SRV, a: Ariel, estado: guardado,
           hechos: {necesita_respuesta: false, quien_destraba: Lucas Natuche,
                    dice_quien_destraba: {para_cuando: "2026-10-22"}}}
        - {tipo: el_dia_que_dijo_quien_destraba, tarea: SRV, a: Lucas, estado: guardado,
           hechos: {necesita_respuesta: true, pregunta: cuando_se_destraba,
                    responsable: Ariel De Simone, causa: presente,
                    habia_dicho: {para_cuando: "2026-10-22"}}}
    hechos:
      - {jugada: decir_cuando_destraba, resultado: anotado, tarea: SRV,
         aviso_a_quien_esta_trabado: {a: Ariel De Simone, llega: "~2026-10-20T10:55"},
         le_vuelve_a_preguntar: {llega: "~2026-10-22T10:00"}}
    pregunta: null
    estado_despues:
      de: Lucas
      pregunta_abierta: null
      esperas_abiertas: []
    dice:
      - que quedó anotado
      - que Ariel se va a enterar
      - que el jueves le pregunta si llegó

  - paso: 4
    quien: Leda
    relojes: ["2026-10-20 10:55"]
    salen:
      - a: Ariel
        tipo: lo_que_dijo_quien_destraba
        tarea: SRV
        hechos: {necesita_respuesta: false, quien_destraba: Lucas Natuche,
                 dice_quien_destraba: {para_cuando: "2026-10-22"}}
    dice:
      - "a Ariel: que Lucas dice que el switch llega el jueves (jue 22/10)"

  - paso: 5
    quien: Marcos
    a_las: "2026-10-20 11:20"
    escribe: "estoy trabado con el plc me falta la ip del servidor de corelabs"
    jugadas:
      - {nombre: anotar_bloqueo, tarea: PLC, causa: "me falta la ip del servidor de corelabs"}
    efectos:
      estados: {PLC: bloqueada}
      bloqueos: [{tarea: PLC, causa: presente}]
    hechos:
      - {jugada: anotar_bloqueo, resultado: anotado, tarea: PLC, pregunta: quien_destraba}
    pregunta: {tipo: quien_destraba, tarea: PLC}
    dice:
      - que quedó anotado el bloqueo
      - "una sola pregunta: quién lo puede destrabar"

  # Ariel ya está trabado con lo que le falta a Marcos: Leda no le pide lo que no puede dar.
  - paso: 6
    quien: Marcos
    a_las: "2026-10-20 11:22"
    escribe: "me la tiene q pasar ariel"
    jugadas:
      - {nombre: anotar_quien_destraba, quien: "ariel", puede_traer: [tarea]}
    efectos:
      destraban: [{tarea: PLC, integrante: Ariel, alguien: true, no_sabe: false, de: Marcos}]
    hechos:
      - {jugada: anotar_quien_destraba, resultado: anotado, se_le_pregunta_a: ausente,
         ya_esta_trabado: {a: Ariel De Simone, se_entera_de_cada_avance: true,
                           esperando_a: [{de: Ariel De Simone, tarea: SRV, causa: presente,
                                          lo_destraba: Lucas Natuche,
                                          dice_quien_lo_destraba: {para_cuando: "2026-10-22"}}]}}
    pregunta: null
    dice:
      - que Ariel está esperando que llegue el switch para el servidor, que lo pone Lucas
      - que Lucas dice que llega el jueves (jue 22/10)
      - que le avisa apenas se mueva
    no_dice:
      - que Leda le pregunta a Ariel

  - paso: 7
    quien: nadie
    relojes: ["2026-10-20 11:32", "2026-10-20 12:00"]
    salen: []

  - paso: 8
    quien: nadie
    relojes: ["2026-10-21 10:00"]
    salen: []

  # El día que dijo Lucas.
  - paso: 9
    quien: Leda
    relojes: ["2026-10-22 10:00"]
    salen:
      - a: Lucas
        tipo: el_dia_que_dijo_quien_destraba
        tarea: SRV
        hechos: {necesita_respuesta: true, pregunta: cuando_se_destraba,
                 responsable: Ariel De Simone, causa: presente,
                 habia_dicho: {para_cuando: "2026-10-22"}}
    estado_despues:
      de: Lucas
      pregunta_abierta: {tipo: cuando_se_destraba, tarea: SRV}
      esperas_abiertas: [SRV]
    dice:
      - "a Lucas: que hoy es el día que dijo para el switch de la tarea del servidor de Ariel; si llegó"

  - paso: 10
    quien: Lucas
    a_las: "2026-10-22 10:30"
    escribe: "no llego, el proveedor dice que mañana"
    jugadas:
      - {nombre: decir_cuando_destraba, tarea: SRV, para_cuando: "2026-10-23",
         puede_traer: [lo_que_dice]}
    efectos:
      dicen_quien_destraba: [{tarea: SRV, de: Lucas, para_cuando: "2026-10-23", ya_esta: false}]
      avisos_guardados:
        - {tipo: lo_que_dijo_quien_destraba, tarea: SRV, a: Ariel, estado: guardado,
           hechos: {quien_destraba: Lucas Natuche,
                    dice_quien_destraba: {para_cuando: "2026-10-23"}}}
        - {tipo: novedad_de_lo_que_espera, tarea: PLC, a: Marcos, estado: guardado,
           hechos: {necesita_respuesta: false,
                    esperando_a: [{de: Ariel De Simone, tarea: SRV}],
                    novedad: {de: Ariel De Simone, tarea: SRV, quien_destraba: Lucas Natuche,
                              dice_quien_destraba: {para_cuando: "2026-10-23"}}}}
        - {tipo: el_dia_que_dijo_quien_destraba, tarea: SRV, a: Lucas, estado: guardado,
           hechos: {habia_dicho: {para_cuando: "2026-10-23"}}}
    hechos:
      - {jugada: decir_cuando_destraba, resultado: anotado, tarea: SRV,
         aviso_a_quien_esta_trabado: {a: Ariel De Simone, llega: "~2026-10-22T10:40"},
         avisos_a_quienes_esperan: [{aviso_a_quien_espera: {a: Marcos Tarquini, tarea: PLC,
                                                            llega: "~2026-10-22T10:40"}}],
         le_vuelve_a_preguntar: {llega: "~2026-10-23T10:00"}}
    pregunta: null
    estado_despues:
      de: Lucas
      pregunta_abierta: null
      esperas_abiertas: []
    dice:
      - que quedó anotado
      - que Ariel se va a enterar

  - paso: 11
    quien: Leda
    relojes: ["2026-10-22 10:40"]
    salen:
      - a: Ariel
        tipo: lo_que_dijo_quien_destraba
        tarea: SRV
        hechos: {quien_destraba: Lucas Natuche, dice_quien_destraba: {para_cuando: "2026-10-23"}}
      - a: Marcos
        tipo: novedad_de_lo_que_espera
        tarea: PLC
        hechos: {necesita_respuesta: false,
                 novedad: {de: Ariel De Simone, tarea: SRV, quien_destraba: Lucas Natuche,
                           dice_quien_destraba: {para_cuando: "2026-10-23"}}}
    dice:
      - "a Ariel: que Lucas dice que el switch llega mañana (vie 23/10)"
      - "a Marcos: que Lucas, que destraba la tarea del servidor de Ariel, dice que el switch llega mañana (vie 23/10)"
      - "a Marcos: que no hace falta responder, en el último renglón"
    no_dice:
      - "a Marcos: que la tarea del PLC se destrabó"

  - paso: 12
    quien: Leda
    relojes: ["2026-10-23 10:00"]
    salen:
      - a: Lucas
        tipo: el_dia_que_dijo_quien_destraba
        tarea: SRV
        hechos: {necesita_respuesta: true, pregunta: cuando_se_destraba,
                 habia_dicho: {para_cuando: "2026-10-23"}}
    estado_despues:
      de: Lucas
      pregunta_abierta: {tipo: cuando_se_destraba, tarea: SRV}
      esperas_abiertas: [SRV]

  # No contesta: la regla de la decisión 38, sin escalar.
  - paso: 13
    quien: Leda
    relojes: ["2026-10-26 10:00"]
    salen:
      - a: Lucas
        tipo: repregunta
        tarea: SRV
        hechos: {necesita_respuesta: true, pregunta: cuando_se_destraba, numero: 2,
                 avisa_que_va_a_escalar: ausente}
    no_dice:
      - un reproche
      - que se va a avisar a alguien si no contesta

  - paso: 14
    quien: Lucas
    a_las: "2026-10-26 11:00"
    escribe: "listo ya quedo instalado el switch"
    jugadas:
      - {nombre: decir_cuando_destraba, tarea: SRV, ya_esta: true, puede_traer: [lo_que_dice]}
    efectos:
      dicen_quien_destraba: [{tarea: SRV, de: Lucas, ya_esta: true}]
      avisos_guardados:
        - {tipo: lo_que_dijo_quien_destraba, tarea: SRV, a: Ariel, estado: guardado,
           hechos: {dice_quien_destraba: {ya_esta: true}}}
        - {tipo: novedad_de_lo_que_espera, tarea: PLC, a: Marcos, estado: guardado,
           hechos: {novedad: {de: Ariel De Simone, tarea: SRV, quien_destraba: Lucas Natuche,
                              dice_quien_destraba: {ya_esta: true}}}}
    hechos:
      - {jugada: decir_cuando_destraba, resultado: anotado, tarea: SRV,
         le_vuelve_a_preguntar: ausente}
    pregunta: null
    dice:
      - que quedó anotado
    no_dice:
      - que la tarea del servidor se destrabó

  - paso: 15
    quien: Leda
    relojes: ["2026-10-26 11:10"]
    salen:
      - a: Ariel
        tipo: lo_que_dijo_quien_destraba
        tarea: SRV
        hechos: {dice_quien_destraba: {ya_esta: true}}
      - a: Marcos
        tipo: novedad_de_lo_que_espera
        tarea: PLC
        hechos: {necesita_respuesta: false,
                 novedad: {de: Ariel De Simone, tarea: SRV, quien_destraba: Lucas Natuche,
                           dice_quien_destraba: {ya_esta: true}}}
    dice:
      - "a Ariel: que Lucas dice que ya está; que cuando pueda seguir, lo diga"
      - "a Marcos: que Lucas dice que el switch de la tarea del servidor de Ariel ya está instalado"
      - "a Marcos: que no hace falta responder, en el último renglón"

  # Ariel puede seguir: ahora sí puede pasarle la IP a Marcos, y Leda le pregunta para cuándo.
  - paso: 16
    quien: Ariel
    a_las: "2026-10-26 11:30"
    escribe: "buenisimo ya sigo con el servidor"
    jugadas:
      - {nombre: destrabar, tarea: SRV}
    efectos:
      estados: {SRV: en_curso}
      bloqueos_resueltos: [SRV]
      avisos_guardados:
        - {tipo: novedad_de_lo_que_espera, tarea: PLC, a: Marcos, estado: guardado,
           hechos: {novedad: {de: Ariel De Simone, tarea: SRV, se_destrabo: true}}}
        - {tipo: ya_no_hace_falta_que_destrabe, tarea: SRV, a: Lucas, estado: guardado,
           hechos: {necesita_respuesta: false, como_se_cerro: ya_se_destrabo,
                    habia_dicho: {ya_esta: true}}}
        - {tipo: pregunta_a_quien_destraba, tarea: PLC, a: Ariel, estado: guardado,
           hechos: {necesita_respuesta: true, pregunta: cuando_se_destraba,
                    responsable: Marcos Tarquini, causa: presente}}
    hechos:
      - {jugada: destrabar, resultado: anotado, tarea: SRV, estado: en_curso,
         avisos_a_quienes_esperan: [{aviso_a_quien_espera: {a: Marcos Tarquini, tarea: PLC,
                                                            llega: "~2026-10-26T11:40"}}],
         lo_esperan: [{le_pregunta_para_cuando: {responsable: Marcos Tarquini, tarea: PLC,
                                                 llega: "~2026-10-26T12:00"}}]}
    pregunta: null
    dice:
      - que quedó anotado que sigue con el servidor
      - que Marcos se va a enterar
      - que Marcos espera la IP y que Leda le pregunta para cuándo

  - paso: 17
    quien: Leda
    relojes: ["2026-10-26 11:40"]
    salen:
      - a: Marcos
        tipo: novedad_de_lo_que_espera
        tarea: PLC
        hechos: {necesita_respuesta: false,
                 esperando_a: [{de: Ariel De Simone, tarea: SRV}],
                 novedad: {de: Ariel De Simone, tarea: SRV, se_destrabo: true}}
      - a: Lucas
        tipo: ya_no_hace_falta_que_destrabe
        tarea: SRV
        hechos: {necesita_respuesta: false, como_se_cerro: ya_se_destrabo}
    dice:
      - "a Marcos: que Ariel ya pudo seguir con la tarea del servidor"
      - "a Lucas: que Ariel ya pudo seguir con la tarea del servidor; que no hace falta responder"
    no_dice:
      - "a Marcos: que la tarea del PLC se destrabó"

  - paso: 18
    quien: Leda
    relojes: ["2026-10-26 12:00"]
    salen:
      - a: Ariel
        tipo: pregunta_a_quien_destraba
        tarea: PLC
        hechos: {necesita_respuesta: true, pregunta: cuando_se_destraba,
                 responsable: Marcos Tarquini, causa: presente}
    estado_despues:
      de: Ariel
      pregunta_abierta: {tipo: cuando_se_destraba, tarea: PLC}
      esperas_abiertas: [PLC]
    dice:
      - "a Ariel: que Marcos está trabado con la tarea del PLC porque le falta la IP del servidor; para cuándo se la puede pasar"

  - paso: 19
    quien: Ariel
    a_las: "2026-10-26 12:15"
    escribe: "se la paso mañana temprano"
    jugadas:
      - {nombre: decir_cuando_destraba, tarea: PLC, para_cuando: "2026-10-27",
         puede_traer: [lo_que_dice]}
    efectos:
      dicen_quien_destraba: [{tarea: PLC, de: Ariel, para_cuando: "2026-10-27", ya_esta: false}]
      avisos_guardados:
        - {tipo: lo_que_dijo_quien_destraba, tarea: PLC, a: Marcos, estado: guardado,
           hechos: {quien_destraba: Ariel De Simone,
                    dice_quien_destraba: {para_cuando: "2026-10-27"}}}
        - {tipo: el_dia_que_dijo_quien_destraba, tarea: PLC, a: Ariel, estado: guardado,
           hechos: {habia_dicho: {para_cuando: "2026-10-27"}}}
    hechos:
      - {jugada: decir_cuando_destraba, resultado: anotado, tarea: PLC,
         aviso_a_quien_esta_trabado: {a: Marcos Tarquini, llega: "~2026-10-26T12:25"},
         avisos_a_quienes_esperan: ausente,
         le_vuelve_a_preguntar: {llega: "~2026-10-27T10:00"}}
    pregunta: null
    estado_despues:
      de: Ariel
      pregunta_abierta: null
      esperas_abiertas: []
    dice:
      - que quedó anotado
      - que Marcos se va a enterar

  - paso: 20
    quien: Leda
    relojes: ["2026-10-26 12:25"]
    salen:
      - a: Marcos
        tipo: lo_que_dijo_quien_destraba
        tarea: PLC
        hechos: {necesita_respuesta: false, quien_destraba: Ariel De Simone,
                 dice_quien_destraba: {para_cuando: "2026-10-27"}}
    dice:
      - "a Marcos: que Ariel dice que le pasa la IP mañana (mar 27/10) temprano"
