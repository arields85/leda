# Copia comprobable de la conversación: la fuente es el .md. Formato: tests/conversaciones/README.md.
fuente: tests/conversaciones/39-pases-sin-respuesta-y-de-su-gente.md
numero: "39"
titulo: "El encargado pasa una tarea de su gente, la revisión sigue a quien era la tarea y un pase sin respuesta"
mide: garantias
persona: Marcos
inicio: "2026-10-20 09:00"

tareas:
  PLC:
    titulo: Programar PLC de la comprimidora
    criterio: "La comprimidora arranca desde el PLC y completa 20 ciclos sin fallas"
    responsable: Marcos
    vence: "2026-11-06"
    estado: en_curso
    desde: "2026-10-19"
  SEN:
    titulo: Calibrar los sensores de la envasadora
    criterio: "Los seis sensores de la envasadora miden dentro de la tolerancia del fabricante en una prueba de una hora"
    responsable: Nahuel
    vence: "2026-11-06"
    estado: asignada
  TOR:
    titulo: Ajustar el tornillo del tablero de la envasadora
    criterio: "El tornillo del tablero de la envasadora queda ajustado al torque que indica el fabricante"
    responsable: Nahuel
    vence: "2026-11-06"
    estado: en_curso
    desde: "2026-10-19"

# Más corta que la del pack: la entrega de la del tornillo pide sólo cómo quedó el trabajo.
evidencia:
  ot: [explicacion]

