  # --- El encargado pasa una tarea de Nahuel (decisión 27) -----------------------------------------
  - paso: 1
    quien: Marcos
    a_las: "2026-10-20 10:00"
    escribe: "pasale la de los sensores de nahuel a lucas, nahuel esta tapado con lo de la paila"
    jugadas:
      - {nombre: pedir_reasignacion, como_la_nombra: "sensores de nahuel", a: lucas}
    efectos: {}
    hechos:
      - {jugada: pedir_reasignacion, resultado: pase_para_confirmar, tarea: SEN,
         pase: {la_tiene: Nahuel Gimenez, pasaria_a: Lucas Natuche},
         al_confirmar_el_pase: {lo_decide: Martín Forte, la_tiene_que_tomar: Lucas Natuche},
         pregunta: confirmar_el_pase}
    pregunta: {tipo: confirmar_el_pase, tarea: SEN}
    botones: [Confirmar]
    estado_despues:
      pregunta_abierta: {tipo: confirmar_el_pase, tarea: SEN}
      responsables: {SEN: Nahuel}
    dice:
      - "la vista previa: que la de los sensores pasa de Nahuel a Lucas"
      - que primero lo decide Martín y después le pregunta a Lucas si la toma
      - que confirme con el botón o escribiéndolo
