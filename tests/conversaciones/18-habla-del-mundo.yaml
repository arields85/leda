# Copia comprobable de la conversación: la fuente es el .md. Formato: tests/conversaciones/README.md.
fuente: tests/conversaciones/18-habla-del-mundo.md
numero: "18"
titulo: "Habla de lo que pasa en el mundo, no de la cocina"
mide: garantias
persona: Marcos
inicio: "2026-10-20 09:00"

tareas:
  PLC:
    titulo: Programar PLC de la comprimidora
    responsable: Marcos
    vence: "2026-10-23"
    estado: en_curso
    desde: "2026-10-19"
  COM:
    titulo: Revisar comunicaciones industriales de la comprimidora
    responsable: Marcos
    vence: "2026-11-06"
    estado: asignada
    depende_de: PLC

# Lo que ya se envió (estado inicial del .md): el aviso previo del martes 20, que no pide
# respuesta. Corre por el motor; los textos los redacta la IA de la corrida.
preludio:
  - quien: Leda
    relojes: ["2026-10-20 10:00"]
    salen: [{a: Marcos, tipo: aviso_previo, tarea: PLC}]

# La regla (usuario, 2026-10-06): los hechos de lo que pasa después dicen quién se entera y
# cuándo (`llega`), nunca el estado interno de un aviso (`estado`, `sale`).
pasos:
  - paso: 1
    quien: Leda
    relojes: ["2026-10-23 10:00"]
    salen:
      - a: Marcos
        tipo: pedido_de_estado
        tarea: PLC
        hechos: {numero: 1, necesita_respuesta: true, vence: "2026-10-23",
                 atraso_dias_habiles: 0, si_no_hay_respuesta: ausente}
    estado_despues:
      pregunta_abierta: {tipo: estado_de_la_tarea, tarea: PLC}
      esperas_abiertas: [PLC]
    dice:
      - que la tarea del PLC vence hoy
      - pide el estado
    no_dice:
      - que va a avisar a Ismael
      - un reproche

  - paso: 2
    quien: Marcos
    a_las: "2026-10-23 11:00"
    escribe: "voy bien, casi la tengo"
    jugadas:
      - {nombre: informar_avance, tarea: PLC, palabras: "voy bien, casi la tengo"}
    efectos:
      avances: [{tarea: PLC}]
      avisos_guardados:
        - {tipo: repregunta_de_estado, tarea: PLC, a: Marcos, estado: guardado}
    hechos:
      - jugada: informar_avance
        resultado: anotado
        tarea: PLC
        avance: {dijo: presente}
        el_pedido_de_estado: sigue_abierto
        vuelve_a_pedir_el_estado: {llega: "~2026-10-26", estado: ausente, sale: ausente}
        veces_sin_algo_cierto: 1
        vencida: ausente
        pregunta: ausente
    pregunta: null
    estado_despues:
      pregunta_abierta: null
      para_despues: []
      esperas_abiertas: [PLC]
    dice:
      - que anotó lo que Marcos contó
      - que el lunes 26 le vuelve a preguntar, como algo que todavía no pasó
    no_dice:
      - que algo quedó guardado, programado, en cola o sin enviar
      - ninguna pregunta

  - paso: 3
    quien: nadie
    relojes: ["2026-10-23 16:00"]
    salen: []

  - paso: 4
    quien: Marcos
    a_las: "2026-10-26 08:30"
    escribe: "la tengo para el miercoles"
    jugadas:
      - {nombre: anotar_prevision, tarea: PLC, fecha: "2026-10-28"}
    efectos:
      previsiones: [{tarea: PLC, fecha: "2026-10-28", motivo: ausente}]
      avisos_guardados:
        - tipo: nueva_prevision
          tarea: PLC
          a: Ismael
          estado: guardado
          hechos: {prevision: "2026-10-28", fecha_comprometida: "2026-10-23",
                   atraso_si_se_cumple_la_prevision_dias_habiles: 3, dependientes: [COM]}
    hechos:
      - jugada: anotar_prevision
        resultado: anotado
        tarea: PLC
        prevision: "2026-10-28"
        fecha_comprometida: "2026-10-23"
        atraso_si_se_cumple_la_prevision_dias_habiles: 3
        aviso_al_referente: {a: Ismael Soschinski, llega: "~2026-10-26T10:00", estado: ausente,
                             sale: ausente}
        lo_que_sigue: {pide_el_estado_el: {fecha: "2026-10-28", estado: ausente}}
    pregunta: null
    estado_despues:
      pregunta_abierta: null
      para_despues: []
      esperas_abiertas: []
    dice:
      - que anotó que la tiene el miércoles 28
      - que la fecha comprometida sigue siendo el viernes 23
      - que Ismael se va a enterar hoy, como algo que todavía no pasó
      - "el próximo paso concreto: que Leda le pide el estado el miércoles 28"
    no_dice:
      - que el aviso a Ismael está guardado, en cola, programado o todavía sin enviar
      - que Ismael ya se enteró
      - "que un pedido o un aviso \"ya no sale\", \"se retiró\" o \"quedó sin efecto\" (si lo dice, como lo que va a pasar: que hoy no le vuelve a preguntar)"
      - que hoy le vuelve a pedir el estado

  - paso: 5
    quien: Leda
    relojes: ["2026-10-26 10:00"]
    salen:
      - a: Ismael
        tipo: nueva_prevision
        tarea: PLC
        hechos: {prevision: "2026-10-28", fecha_comprometida: "2026-10-23",
                 atraso_si_se_cumple_la_prevision_dias_habiles: 3, dependientes: [COM]}
    estado_avisos:
      - {tipo: repregunta_de_estado, tarea: PLC, a: Marcos, estado: omitido,
         motivo: ya_respondio}
    estado_despues:
      de: Ismael
      pregunta_abierta: null
    dice:
      - que Marcos prevé terminar la tarea del PLC el miércoles 28
      - que la fecha comprometida era el viernes 23
      - el atraso, tres días hábiles
      - que la de comunicaciones depende de ella
    no_dice:
      - que Ismael tiene que hacer algo
      - cómo funciona el aviso

  - paso: 6
    quien: nadie
    relojes: ["2026-10-26 16:00", "2026-10-27 10:00", "2026-10-27 16:00"]
    salen: []

  - paso: 7
    quien: Leda
    relojes: ["2026-10-28 10:00"]
    salen:
      - a: Marcos
        tipo: pedido_de_estado
        tarea: PLC
        hechos:
          numero: 1
          necesita_respuesta: true
          seguimiento_por: prevision
          prevision_vigente:
            fecha: "2026-10-28"
            aviso_al_referente: {a: Ismael Soschinski, llega: ya_le_llego, estado: ausente}
    estado_despues:
      pregunta_abierta: {tipo: estado_de_la_tarea, tarea: PLC}
      esperas_abiertas: [PLC]
    dice:
      - que hoy es el día que Marcos dio para la tarea del PLC
      - pide el estado
      - si nombra a Ismael, como alguien que ya está al tanto
    no_dice:
      - que un aviso salió, se envió o estaba guardado
      - que va a avisar a Ismael
      - un reproche
