        tarea: PLC
        hechos: {necesita_respuesta: false, responsable: Marcos Tarquini,
                 como_se_cerro: ya_se_destrabo}
    estado_despues:
      de: Ariel
      pregunta_abierta: null
      esperas_abiertas: []
    dice:
      - la tarea del PLC
      - que ya se resolvió por otro lado
      - que no hace falta que consiga el cable
      - que no hace falta responder, en el último renglón
