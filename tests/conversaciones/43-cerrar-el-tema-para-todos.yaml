                    dice_quien_destraba: {lo_que_dice: presente},
                    ya_se_habia_destrabado: true, se_lo_pasa_si_contesta: true}}
    hechos:
      - {jugada: decir_cuando_destraba, resultado: anotado, tarea: PLC,
