# Copia comprobable de la conversación: la fuente es el .md. Formato: tests/conversaciones/README.md.
fuente: tests/conversaciones/43-cerrar-el-tema-para-todos.md
numero: "43"
titulo: "Cerrar el tema para todos"
mide: garantias
persona: Marcos
inicio: "2026-10-20 09:00"
foco: [PLC, HMI, TAB]
# Mariano no tiene un chat con Leda (en el pack, su Telegram está PENDIENTE).
sin_telegram: [Mariano]

tareas:
  PLC:
    titulo: Programar PLC de la comprimidora
    criterio: "La comprimidora arranca desde el PLC y completa 20 ciclos sin fallas"
    responsable: Marcos
    vence: "2026-10-30"
    estado: en_curso
    desde: "2026-10-19"
  HMI:
    titulo: Instalar el panel HMI de la comprimidora
    criterio: "El panel HMI muestra el estado de la comprimidora y permite arrancarla y pararla desde la planta"
    responsable: Marcos
    vence: "2026-11-06"
    estado: en_curso
    desde: "2026-10-19"
  TAB:
    titulo: Cablear tablero de la máquina 3
    criterio: "El tablero de la máquina 3 queda cableado y probado con la máquina en marcha"
    responsable: Marcos
    vence: "2026-11-06"
    estado: en_curso
    desde: "2026-10-19"

pasos:
  # --- Se resolvió por otro lado: a quien le preguntaba se le cierra el tema (decisión 39) ---------
  - paso: 1
    quien: Marcos
    a_las: "2026-10-20 10:20"
    escribe: "estoy trabado con el plc, me falta el cable de programacion. lo consigue ariel"
    jugadas:
      - {nombre: anotar_bloqueo, tarea: PLC, causa: "me falta el cable de programacion"}
      - {nombre: anotar_quien_destraba, quien: "ariel", puede_traer: [tarea]}
    efectos:
      estados: {PLC: bloqueada}
      bloqueos: [{tarea: PLC, causa: presente}]
      destraban: [{tarea: PLC, integrante: Ariel, alguien: true, no_sabe: false, de: Marcos}]
      avisos_guardados:
        - {tipo: pregunta_a_quien_destraba, tarea: PLC, a: Ariel, estado: guardado}
    hechos:
      - {jugada: anotar_bloqueo, resultado: anotado, tarea: PLC}
      - {jugada: anotar_quien_destraba, resultado: anotado,
         se_le_pregunta_a: {a: Ariel De Simone, llega: "~2026-10-20T10:30"}}
    pregunta: null
    dice:
      - que quedó anotado el bloqueo y que lo destraba Ariel
      - que le pregunta a Ariel y le avisa apenas sepa algo

  - paso: 2
    quien: Leda
    relojes: ["2026-10-20 10:30"]
    salen:
      - a: Ariel
        tipo: pregunta_a_quien_destraba
        tarea: PLC
        hechos: {necesita_respuesta: true, pregunta: cuando_se_destraba,
                 responsable: Marcos Tarquini, causa: presente}
    estado_despues:
      de: Ariel
      pregunta_abierta: {tipo: cuando_se_destraba, tarea: PLC}
      esperas_abiertas: [PLC]

  - paso: 3
    quien: Ariel
    a_las: "2026-10-20 10:50"
    escribe: "lo compro mañana y se lo llevo el jueves"
    jugadas:
      - {nombre: decir_cuando_destraba, para_cuando: "2026-10-22",
         puede_traer: [tarea, lo_que_dice]}
    efectos:
      dicen_quien_destraba: [{tarea: PLC, de: Ariel, para_cuando: "2026-10-22", ya_esta: false}]
      avisos_guardados:
        - {tipo: el_dia_que_dijo_quien_destraba, tarea: PLC, a: Ariel, estado: guardado,
           hechos: {habia_dicho: {para_cuando: "2026-10-22"}}}
