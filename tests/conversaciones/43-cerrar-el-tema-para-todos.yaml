      - que Ariel se va a enterar

  - paso: 10
    quien: Leda
    relojes: ["2026-10-20 15:10"]
    salen:
      - a: Ariel
        tipo: lo_que_dijo_quien_esta_trabado
        tarea: PLC
        hechos: {necesita_respuesta: false, quien_esta_trabado: Marcos Tarquini,
