# Copia comprobable de la conversación: la fuente es el .md. Formato: tests/conversaciones/README.md.
fuente: tests/conversaciones/36-bloqueo-viejo.md
numero: "36"
titulo: "El bloqueo viejo"
mide: garantias
persona: Marcos
inicio: "2026-10-20 09:00"
foco: [PLC, HMI]
# El espacio tiene informe al grupo, como CoreWork en el pack (decisión 35).
grupo: -1001
cadencias:
  - {nombre: informe_semanal, cuando: "viernes 16:15", audiencia: grupo}

tareas:
  PLC:
    titulo: Programar PLC de la comprimidora
    criterio: "La comprimidora arranca desde el PLC y completa 20 ciclos sin fallas"
    responsable: Marcos
    vence: "2026-11-13"
    estado: en_curso
    desde: "2026-10-19"
  HMI:
    titulo: Instalar el panel HMI de la comprimidora
    criterio: "El panel HMI muestra el estado de la comprimidora y permite arrancarla y pararla desde la planta"
    responsable: Marcos
    vence: "2026-11-13"
    estado: en_curso
    desde: "2026-10-19"

pasos:
  - paso: 1
    quien: Marcos
    a_las: "2026-10-20 10:20"
    escribe: "estoy trabado con el plc me falta la ip del servidor de corelabs"
    jugadas:
      - {nombre: anotar_bloqueo, tarea: PLC, causa: "me falta la ip del servidor de corelabs"}
    efectos:
      estados: {PLC: bloqueada}
      bloqueos: [{tarea: PLC, causa: presente}]
    pregunta: {tipo: quien_destraba, tarea: PLC}

  - paso: 2
    quien: Marcos
    a_las: "2026-10-20 10:22"
    escribe: "me la tiene q pasar ariel"
    jugadas:
      - {nombre: anotar_quien_destraba, quien: "ariel", puede_traer: [tarea]}
    efectos:
      destraban: [{tarea: PLC, integrante: Ariel, alguien: true, no_sabe: false, de: Marcos}]
      avisos_guardados:
        - {tipo: pregunta_a_quien_destraba, tarea: PLC, a: Ariel, estado: guardado}
    pregunta: null

  - paso: 3
    quien: Leda
    relojes: ["2026-10-20 10:32"]
    salen:
      - {a: Ariel, tipo: pregunta_a_quien_destraba, tarea: PLC}
    estado_despues:
      de: Ariel
      pregunta_abierta: {tipo: cuando_se_destraba, tarea: PLC}

  - paso: 4
    quien: Ariel
    a_las: "2026-10-20 11:00"
    escribe: "te la paso el jueves"
    jugadas:
      - {nombre: decir_cuando_destraba, tarea: PLC, para_cuando: "2026-10-22",
         puede_traer: [lo_que_dice]}
    efectos:
      dicen_quien_destraba: [{tarea: PLC, de: Ariel, para_cuando: "2026-10-22", ya_esta: false}]
      avisos_guardados:
        - {tipo: lo_que_dijo_quien_destraba, tarea: PLC, a: Marcos, estado: guardado}
    pregunta: null

  - paso: 5
    quien: Leda
    relojes: ["2026-10-20 11:10"]
    salen:
      - {a: Marcos, tipo: lo_que_dijo_quien_destraba, tarea: PLC}

  - paso: 6
    quien: Ariel
    a_las: "2026-10-22 16:00"
    escribe: "se me complico con otra cosa, no llego, la tengo el lunes"
    jugadas:
      - {nombre: decir_cuando_destraba, tarea: PLC, para_cuando: "2026-10-26",
         puede_traer: [lo_que_dice]}
    efectos:
      dicen_quien_destraba: [{tarea: PLC, de: Ariel, para_cuando: "2026-10-26", ya_esta: false}]
      avisos_guardados:
        - {tipo: lo_que_dijo_quien_destraba, tarea: PLC, a: Marcos, estado: guardado}
    pregunta: null

  - paso: 7
    quien: Leda
    relojes: ["2026-10-22 16:10"]
    salen:
      - {a: Marcos, tipo: lo_que_dijo_quien_destraba, tarea: PLC,
         hechos: {dice_quien_destraba: {para_cuando: "2026-10-26"}}}

  - paso: 8
    quien: Marcos
    a_las: "2026-10-26 10:20"
    escribe: "el hmi tambien esta parado, ariel tiene q liberar la licencia"
    jugadas:
      - {nombre: anotar_bloqueo, tarea: HMI, causa: "ariel tiene q liberar la licencia"}
      - {nombre: anotar_quien_destraba, quien: "ariel", puede_traer: [tarea]}
    efectos:
      estados: {HMI: bloqueada}
      bloqueos: [{tarea: HMI, causa: presente}]
      destraban: [{tarea: HMI, integrante: Ariel, alguien: true, no_sabe: false, de: Marcos}]
      avisos_guardados:
        - {tipo: pregunta_a_quien_destraba, tarea: HMI, a: Ariel, estado: guardado}
    pregunta: null

  - paso: 9
    quien: Leda
    relojes: ["2026-10-26 10:30"]
    salen:
      - {a: Ariel, tipo: pregunta_a_quien_destraba, tarea: HMI}
    estado_despues:
      de: Ariel
      pregunta_abierta: {tipo: cuando_se_destraba, tarea: HMI}

  - paso: 10
    quien: Ariel
    a_las: "2026-10-26 10:45"
    escribe: "la licencia la libero hoy a la tarde"
    jugadas:
      - {nombre: decir_cuando_destraba, tarea: HMI, para_cuando: "2026-10-26",
         puede_traer: [lo_que_dice]}
    efectos:
      dicen_quien_destraba: [{tarea: HMI, de: Ariel, para_cuando: "2026-10-26", ya_esta: false}]
      avisos_guardados:
        - {tipo: lo_que_dijo_quien_destraba, tarea: HMI, a: Marcos, estado: guardado}
    pregunta: null

  # El bloqueo del PLC lleva cuatro días hábiles: nada sale por él.
  - paso: 11
    quien: Leda
    relojes: ["2026-10-26 10:55"]
    salen:
      - {a: Marcos, tipo: lo_que_dijo_quien_destraba, tarea: HMI}

  - paso: 12
    quien: Marcos
    a_las: "2026-10-26 15:00"
    escribe: "listo ya tengo la licencia sigo con el hmi"
    jugadas:
      - {nombre: destrabar, tarea: HMI}
    efectos:
      estados: {HMI: en_curso}
      bloqueos_resueltos: [HMI]
      # Ariel había dado el lunes para la licencia: se entera de que ya no hace falta (decisión
      # 39, desde la C-5c).
      avisos_guardados:
        - {tipo: ya_no_hace_falta_que_destrabe, tarea: HMI, a: Ariel, estado: guardado,
           hechos: {necesita_respuesta: false, como_se_cerro: ya_se_destrabo,
                    habia_dicho: {para_cuando: "2026-10-26"}}}
    pregunta: null

  - paso: 12b
    quien: Leda
    relojes: ["2026-10-26 15:10"]
    salen:
      - a: Ariel
        tipo: ya_no_hace_falta_que_destrabe
        tarea: HMI
        hechos: {necesita_respuesta: false, como_se_cerro: ya_se_destrabo}
    dice:
      - que lo del panel HMI ya se resolvió y no hace falta que libere la licencia
      - que no hace falta responder, en el último renglón

  - paso: 13
    quien: Leda
    relojes: ["2026-10-27 10:00"]
    salen:
      - a: Ismael
        tipo: bloqueo_que_sigue_abierto
        tarea: PLC
        hechos: {necesita_respuesta: false, responsable: Marcos Tarquini, causa: presente,
                 trabada_desde: "2026-10-20", dias_habiles_trabada: 5,
                 historia: [{el: "2026-10-20", de: Marcos Tarquini, le_toca_a: Ariel De Simone},
                            {el: "2026-10-20", de: Ariel De Simone, para_cuando: "2026-10-22"},
                            {el: "2026-10-22", de: Ariel De Simone, para_cuando: "2026-10-26"}]}
      - a: Marcos
        tipo: asentado_que_sigue_trabada
        tarea: PLC
        hechos: {necesita_respuesta: false, causa: presente, trabada_desde: "2026-10-20",
                 dias_habiles_trabada: 5,
                 queda_asentado: {figura_en_el_informe_al_grupo: true, a: Ismael Soschinski}}
    dice:
      - "a Ismael: que Marcos está trabado con la tarea del PLC desde el martes 20 (mar 20/10), hace cinco días hábiles, porque le falta la IP del servidor de CoreLabs"
      - "a Ismael: la historia: Marcos dijo que se la pasa Ariel; Ariel dijo que el jueves (jue 22/10) y después que el lunes (lun 26/10), porque se le complicó"
      - "a Ismael: que no hace falta responder, en el último renglón"
      - "a Marcos: que quedó asentado que el PLC lleva cinco días hábiles trabado, para que el equipo esté al tanto"
      - "a Marcos: que no hace falta responder, en el último renglón"
    no_dice:
      - "a Ismael: una pregunta"
      - "a Ismael: algo del panel HMI"
      - "a Marcos: que se le informó a alguien, ni el nombre de Ismael"

  - paso: 14
    quien: Ismael
    a_las: "2026-10-27 10:40"
    escribe: "y eso quien lo tiene q resolver?"
    jugadas: []
    efectos: {}
    pregunta: null
    dice:
      - que lo destraba Ariel, que dio el lunes 26 y todavía no lo resolvió

  # Ya se informó: no sale otra vez hasta dentro de cinco días hábiles.
  - paso: 15
    quien: Leda
    relojes: ["2026-10-28 10:00"]
    salen: []

  - paso: 16
    quien: Ariel
    a_las: "2026-10-29 11:00"
    escribe: "todavia no la consegui, el lunes 2 sin falta"
    jugadas:
      - {nombre: decir_cuando_destraba, tarea: PLC, para_cuando: "2026-11-02",
         puede_traer: [lo_que_dice]}
    efectos:
      dicen_quien_destraba: [{tarea: PLC, de: Ariel, para_cuando: "2026-11-02", ya_esta: false}]
      avisos_guardados:
        - {tipo: lo_que_dijo_quien_destraba, tarea: PLC, a: Marcos, estado: guardado}
    pregunta: null

  - paso: 17
    quien: Leda
    relojes: ["2026-10-29 11:10"]
    salen:
      - {a: Marcos, tipo: lo_que_dijo_quien_destraba, tarea: PLC,
         hechos: {dice_quien_destraba: {para_cuando: "2026-11-02"}}}

  # Desde la vez anterior van cuatro días hábiles: nada.
  - paso: 18
    quien: Leda
    relojes: ["2026-11-02 10:00"]
    salen: []

  # Diez días hábiles y sigue abierto: se vuelve a asentar, con lo que pasó desde el martes 27.
  - paso: 19
    quien: Leda
    relojes: ["2026-11-03 10:00"]
    salen:
      - a: Ismael
        tipo: bloqueo_que_sigue_abierto
        tarea: PLC
        hechos: {necesita_respuesta: false, responsable: Marcos Tarquini, causa: presente,
                 trabada_desde: "2026-10-20", dias_habiles_trabada: 10,
                 la_vez_anterior: "2026-10-27",
                 desde_la_vez_anterior: [{el: "2026-10-29", de: Ariel De Simone,
                                          para_cuando: "2026-11-02"}],
                 historia: ausente}
      - a: Marcos
        tipo: asentado_que_sigue_trabada
        tarea: PLC
        hechos: {necesita_respuesta: false, dias_habiles_trabada: 10,
                 queda_asentado: {figura_en_el_informe_al_grupo: true, a: Ismael Soschinski}}
    dice:
      - "a Ismael: que Marcos sigue trabado con la tarea del PLC desde el martes 20, hace diez días hábiles"
      - "a Ismael: lo que pasó desde la vez anterior (mar 27/10): Ariel dijo el jueves 29 que todavía no la consiguió y que el lunes 2 sin falta"
      - "a Marcos: que volvió a quedar asentado que el PLC sigue trabado, ya diez días hábiles, para que el equipo esté al tanto"
    no_dice:
      - "a Ismael: una pregunta"
      - "a Marcos: que se le informó a alguien, ni el nombre de Ismael"

  # Decisión 41 (C-5d): lo que dice quien recibió el bloqueo viejo se anota y le llega a Marcos,
  # pero no lo cierra.
  - paso: 20
    quien: Ismael
    a_las: "2026-11-04 10:30"
    escribe: "ya esta, llega mañana"
    jugadas:
      - {nombre: decir_cuando_destraba, tarea: PLC, ya_esta: true, para_cuando: "2026-11-05",
         puede_traer: [lo_que_dice]}
    efectos:
      dicen_quien_destraba: [{tarea: PLC, de: Ismael, para_cuando: "2026-11-05", ya_esta: true}]
      avisos_guardados:
        - {tipo: lo_que_dijo_quien_destraba, tarea: PLC, a: Marcos, estado: guardado,
           hechos: {quien_destraba: Ismael Soschinski}}
    hechos:
      - {jugada: decir_cuando_destraba, resultado: anotado, tarea: PLC,
         aviso_a_quien_esta_trabado: {a: Marcos Tarquini, llega: "~2026-11-04T10:40"}}
    pregunta: null
    dice:
      - que quedó anotado
      - que Marcos se va a enterar
    no_dice:
      - que la tarea ya se destrabó

  - paso: 21
    quien: Leda
    relojes: ["2026-11-04 10:40"]
    salen:
      - {a: Marcos, tipo: lo_que_dijo_quien_destraba, tarea: PLC,
         hechos: {necesita_respuesta: false, quien_destraba: Ismael Soschinski,
                  dice_quien_destraba: {ya_esta: true, para_cuando: "2026-11-05"}}}
    dice:
      - "a Marcos: que Ismael dice que ya está y que llega mañana (jue 5/11)"
      - "a Marcos: que cuando pueda seguir, lo diga; que no hace falta responder"
    no_dice:
      - "a Marcos: que la tarea ya se destrabó"

  - paso: 22
    quien: Marcos
    a_las: "2026-11-05 11:00"
    escribe: "llego la ip, sigo con el plc"
    jugadas:
      - {nombre: destrabar, tarea: PLC}
    efectos:
      estados: {PLC: en_curso}
      bloqueos_resueltos: [PLC]
      # Se enteran todos los que estaban en el tema: Ariel, que había dado el lunes 2, e Ismael,
      # que dijo que ya estaba (regla 39, derivada en la C-5d).
      avisos_guardados:
        - {tipo: ya_no_hace_falta_que_destrabe, tarea: PLC, a: Ariel, estado: guardado,
           hechos: {necesita_respuesta: false, como_se_cerro: ya_se_destrabo,
                    habia_dicho: {para_cuando: "2026-11-02"}}}
        - {tipo: ya_no_hace_falta_que_destrabe, tarea: PLC, a: Ismael, estado: guardado,
           hechos: {necesita_respuesta: false, como_se_cerro: ya_se_destrabo}}
    pregunta: null

  - paso: 23
    quien: Leda
    relojes: ["2026-11-05 11:10"]
    salen:
      - {a: Ariel, tipo: ya_no_hace_falta_que_destrabe, tarea: PLC,
         hechos: {necesita_respuesta: false, como_se_cerro: ya_se_destrabo}}
      - {a: Ismael, tipo: ya_no_hace_falta_que_destrabe, tarea: PLC,
         hechos: {necesita_respuesta: false, como_se_cerro: ya_se_destrabo}}
    dice:
      - "a Ismael: que Marcos ya pudo seguir con el PLC; que no hace falta responder"
      - "a Ariel: que lo del PLC ya se resolvió y no hace falta que consiga la IP"
