# Copia comprobable de la conversación: la fuente es el .md. Formato: tests/conversaciones/README.md.
fuente: tests/conversaciones/20-formato-de-los-mensajes.md
numero: "20"
titulo: "El formato de los mensajes"
mide: garantias
persona: Marcos
inicio: "2026-10-20 09:00"

tareas:
  PLC:
    titulo: Programar PLC de la comprimidora
    responsable: Marcos
    vence: "2026-10-23"
    estado: asignada
  COM:
    titulo: Revisar comunicaciones industriales de la comprimidora
    responsable: Marcos
    vence: "2026-10-30"
    estado: en_curso
    desde: "2026-10-19"

# Lo que ya se envió (estado inicial del .md): el aviso previo del martes 20, que no pide
# respuesta. Corre por el motor; los textos los redacta la IA de la corrida.
preludio:
  - quien: Leda
    relojes: ["2026-10-20 10:00"]
    salen: [{a: Marcos, tipo: aviso_previo, tarea: PLC}]

# El formato (usuario, 2026-10-07, segunda vuelta): renglones y emojis, sin negrita. El corredor
# comprueba lo que hace el código (jugadas, efectos, hechos, estado) y mide solo el formato de
# cada mensaje (`comprobar.fallas_de_formato`); lo demás de la forma se lee en las
# transcripciones.
pasos:
  - paso: 1
    quien: Marcos
    a_las: "2026-10-20 10:10"
    escribe: "que tengo pendiente?"
    jugadas:
      - {nombre: consultar_pendientes}
    efectos: {}
    hechos:
      - jugada: consultar_pendientes
        resultado: leido
        tareas:
          - {titulo: PLC, estado: asignada, vence: "2026-10-23"}
          - {titulo: COM, estado: en_curso, vence: "2026-10-30"}
    pregunta: null
    estado_despues:
      pregunta_abierta: null
    dice:
      - primero, en un renglón, que tiene dos tareas pendientes
      - "las dos, cada una en su renglón con 📅, su nombre completo, su estado y su fecha corta: la del PLC sin empezar, que vence el vie 23/10; la de comunicaciones en curso, que vence el vie 30/10"
      - el próximo paso, aparte y al final
    no_dice:
      - tareas de otras personas
      - las dos tareas en un mismo renglón
      - negrita, viñetas u otra marca (títulos, enlaces, cursiva, código)
      - una fecha larga ("viernes 23 de octubre")

  - paso: 2
    quien: Marcos
    a_las: "2026-10-20 10:15"
    escribe: "arranque con el plc. y lo de comunicaciones no llego al 30, va a ser el miercoles 4 xq espero el switch nuevo"
    jugadas:
      - {nombre: anotar_inicio, tarea: PLC}
      - {nombre: anotar_prevision, tarea: COM, fecha: "2026-11-04",
         motivo: "espera el switch nuevo"}
    efectos:
      estados: {PLC: en_curso}
      previsiones: [{tarea: COM, fecha: "2026-11-04", motivo: presente}]
      avisos_guardados:
        - tipo: nueva_prevision
          tarea: COM
          a: Ismael
          hechos: {prevision: "2026-11-04", fecha_comprometida: "2026-10-30",
                   atraso_si_se_cumple_la_prevision_dias_habiles: 3,
                   dependientes: [], motivo: presente}
    hechos:
      - {jugada: anotar_inicio, resultado: anotado, tarea: PLC}
      - {jugada: anotar_prevision, resultado: anotado, tarea: COM, prevision: "2026-11-04",
         fecha_comprometida: "2026-10-30", atraso_si_se_cumple_la_prevision_dias_habiles: 3}
    pregunta: null
    estado_despues:
      pregunta_abierta: null
      para_despues: []
    dice:
      - primero, en un renglón, lo que anotó
      - "cada tarea en su bloque, separado por un renglón en blanco: un renglón con 📋 y su nombre solo, y debajo, con ✏️, lo anotado: arrancó la del PLC; la de comunicaciones la termina el mié 4/11 porque espera el switch nuevo"
      - "con ⚠️, la consecuencia: vence el vie 30/10, tres días hábiles de atraso"
      - que Ismael se va a enterar hoy, como algo que todavía no pasó
      - el próximo paso, en pocas palabras, aparte y al final
    no_dice:
      - los dos hechos mezclados en un renglón o en un párrafo corrido
      - que la fecha de la tarea de comunicaciones cambió
      - el nombre completo de una tarea dos veces
      - negrita

  - paso: 3
    quien: Leda
    relojes: ["2026-10-20 10:16"]
    salen:
      - a: Ismael
        tipo: nueva_prevision
        tarea: COM
        hechos: {prevision: "2026-11-04", fecha_comprometida: "2026-10-30",
                 atraso_si_se_cumple_la_prevision_dias_habiles: 3,
                 dependientes: [], motivo: presente}
    dice:
      - "un renglón por idea: primero, lo que pasó; la tarea de comunicaciones en su renglón con 📋"
      - que Marcos la termina el mié 4/11 porque espera el switch nuevo
      - "con ⚠️, que vence el vie 30/10 y el atraso, tres días hábiles"
      - que no hace falta que conteste, solo en el último renglón
    no_dice:
      - nada de la tarea del PLC
      - que la fecha cambió
      - un párrafo corrido
      - Marcos con su apellido
      - negrita
