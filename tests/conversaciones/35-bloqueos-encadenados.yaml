    estado_despues:
      de: Lucas
      pregunta_abierta: {tipo: cuando_se_destraba, tarea: TAB}

  - paso: 16
    quien: Nahuel
    a_las: "2026-10-23 10:45"
    escribe: "estoy trabado con los planos necesito el tablero armado, eso lo tiene mariano"
    jugadas:
      - {nombre: anotar_bloqueo, tarea: PLA, causa: "necesito el tablero armado"}
      - {nombre: anotar_quien_destraba, quien: "mariano", puede_traer: [tarea]}
    efectos:
      estados: {PLA: bloqueada}
      bloqueos: [{tarea: PLA, causa: presente}]
      destraban: [{tarea: PLA, integrante: Mariano, alguien: true, no_sabe: false, de: Nahuel}]
      avisos_guardados:
        - {tipo: pregunta_a_quien_destraba, tarea: PLA, a: Mariano, estado: guardado}
