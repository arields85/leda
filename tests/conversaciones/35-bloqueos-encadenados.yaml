      - {jugada: anotar_quien_destraba, resultado: anotado,
         se_le_pregunta_a: {a: Mariano Naim, llega: "~2026-10-23T10:55"}}
    pregunta: null

  - paso: 17
    quien: Leda
    relojes: ["2026-10-23 10:55"]
    salen:
      - a: Mariano
        tipo: pregunta_a_quien_destraba
        tarea: PLA
        hechos: {necesita_respuesta: true, pregunta: cuando_se_destraba,
                 responsable: Nahuel Gimenez, causa: presente}
    estado_despues:
      de: Mariano
      pregunta_abierta: {tipo: cuando_se_destraba, tarea: PLA}

  - paso: 18
    quien: Mariano
    a_las: "2026-10-23 11:15"
    escribe: "no puedo hasta tener los guardamotores, sigo parado con el tablero"
    jugadas:
      - {nombre: decir_cuando_destraba, tarea: PLA, su_tarea_trabada: TAB,
         puede_traer: [lo_que_dice]}
    # El enlace lo dice Mariano: lo que le falta a Nahuel espera el bloqueo del tablero.
    efectos:
      dicen_quien_destraba: [{tarea: PLA, de: Mariano, ya_esta: false, espera_la_tarea: TAB}]
      avisos_guardados:
        - {tipo: lo_que_dijo_quien_destraba, tarea: PLA, a: Nahuel, estado: guardado,
           hechos: {necesita_respuesta: false, quien_destraba: Mariano Naim,
                    dice_quien_destraba: {su_tarea_trabada: {tarea: TAB, causa: presente,
                                                             lo_destraba: Lucas Natuche}}}}
