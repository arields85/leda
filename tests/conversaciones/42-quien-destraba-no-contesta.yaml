# Copia comprobable de la conversación: la fuente es el .md. Formato: tests/conversaciones/README.md.
fuente: tests/conversaciones/42-quien-destraba-no-contesta.md
numero: "42"
titulo: "Quien destraba no contesta"
mide: garantias
persona: Marcos
inicio: "2026-10-20 09:00"
foco: [PLC, SRV]

tareas:
  PLC:
    titulo: Programar PLC de la comprimidora
    criterio: "La comprimidora arranca desde el PLC y completa 20 ciclos sin fallas"
    responsable: Marcos
    vence: "2026-11-13"
    estado: en_curso
    desde: "2026-10-19"
  SRV:
    titulo: Instalar el servidor de CoreLabs
    criterio: "El servidor de CoreLabs responde en la red de planta y tiene su IP fija anotada"
    responsable: Ariel
    vence: "2026-11-13"

pasos:
  - paso: 1
    quien: Marcos
    a_las: "2026-10-20 10:20"
    escribe: "estoy trabado con el plc me falta la ip del servidor de corelabs"
    jugadas:
      - {nombre: anotar_bloqueo, tarea: PLC, causa: "me falta la ip del servidor de corelabs"}
    efectos:
      estados: {PLC: bloqueada}
      bloqueos: [{tarea: PLC, causa: presente}]
    pregunta: {tipo: quien_destraba, tarea: PLC}
    dice:
      - que quedó anotado el bloqueo
      - "una sola pregunta: quién lo puede destrabar"

  - paso: 2
    quien: Marcos
    a_las: "2026-10-20 10:22"
    escribe: "me la tiene que pasar ariel"
    jugadas:
      - {nombre: anotar_quien_destraba, quien: "ariel", puede_traer: [tarea]}
    efectos:
      destraban: [{tarea: PLC, integrante: Ariel, alguien: true, no_sabe: false}]
      avisos_guardados:
        - {tipo: pregunta_a_quien_destraba, tarea: PLC, a: Ariel, estado: guardado}
    hechos:
      - {jugada: anotar_quien_destraba, resultado: anotado,
         se_le_pregunta_a: {a: Ariel De Simone, llega: "~2026-10-20T10:32"}}
    pregunta: null
    dice:
      - que Leda le pregunta a Ariel para cuándo y le avisa a Marcos apenas sepa algo

  # Día 1: la pregunta.
  - paso: 3
    quien: Leda
    relojes: ["2026-10-20 10:32"]
    salen:
      - a: Ariel
        tipo: pregunta_a_quien_destraba
        tarea: PLC
        hechos: {necesita_respuesta: true, pregunta: cuando_se_destraba,
                 responsable: Marcos Tarquini, causa: presente}
    estado_despues:
      de: Ariel
      pregunta_abierta: {tipo: cuando_se_destraba, tarea: PLC}
      esperas_abiertas: [PLC]
    dice:
      - que Marcos está trabado con la tarea del PLC porque le falta la IP del servidor de CoreLabs
      - "la pregunta: para cuándo se la puede pasar"

  # Días 2 y 3: una vez por día.
  - paso: 4
    quien: Leda
    relojes: ["2026-10-21 10:00"]
    salen:
      - a: Ariel
        tipo: repregunta
        tarea: PLC
        hechos: {necesita_respuesta: true, pregunta: cuando_se_destraba, numero: 2,
                 avisa_que_va_a_escalar: ausente}
    dice:
      - la misma pregunta, recordando quién está trabado y por qué
    no_dice:
      - un reproche
      - que se va a avisar a alguien si no contesta

  - paso: 5
    quien: Leda
    relojes: ["2026-10-22 10:00"]
    salen:
      - a: Ariel
        tipo: repregunta
        tarea: PLC
        hechos: {necesita_respuesta: true, pregunta: cuando_se_destraba, numero: 3,
                 avisa_que_va_a_escalar: ausente}
    no_dice:
      - un reproche
      - que se va a avisar a alguien si no contesta

  # Día 4: desde acá, cada 2 días hábiles.
  - paso: 6
    quien: nadie
    relojes: ["2026-10-23 10:00"]
    salen: []

  - paso: 7
    quien: Leda
    relojes: ["2026-10-26 10:00"]
    salen:
      - a: Ariel
        tipo: repregunta
        tarea: PLC
        hechos: {necesita_respuesta: true, pregunta: cuando_se_destraba, numero: 4,
                 avisa_que_va_a_escalar: ausente}
    no_dice:
      - un reproche
      - que se va a avisar a alguien si no contesta

  # Escribe por otra cosa: Leda le contesta lo suyo y la pregunta vuelve aparte (decisión 50).
  - paso: 8
    quien: Ariel
    a_las: "2026-10-26 11:00"
    escribe: "arranque con la instalacion del servidor"
    jugadas:
      - {nombre: anotar_inicio, tarea: SRV}
    efectos:
      estados: {SRV: en_curso}
      avisos_guardados:
        - {tipo: vuelve_la_pregunta, tarea: PLC, a: Ariel, estado: guardado,
           hechos: {pregunta: cuando_se_destraba, necesita_respuesta: true}}
    hechos:
      - {jugada: anotar_inicio, resultado: anotado, tarea: SRV}
    pregunta: null
    estado_despues:
      de: Ariel
      pregunta_abierta: {tipo: cuando_se_destraba, tarea: PLC}
    dice:
      - que quedó anotado que arrancó con el servidor
    no_dice:
      - nada de la tarea del PLC

  - paso: 9
    quien: Leda
    relojes: ["2026-10-26 11:01"]
    salen:
      - a: Ariel
        tipo: vuelve_la_pregunta
        tarea: PLC
        hechos: {pregunta: cuando_se_destraba, necesita_respuesta: true}
    estado_despues:
      de: Ariel
      pregunta_abierta: {tipo: cuando_se_destraba, tarea: PLC}
    dice:
      - "la vuelta a la pregunta: para cuándo le puede pasar a Marcos la IP del servidor"
    no_dice:
      - nada del servidor que arrancó

  # Cinco días hábiles: el bloqueo viejo queda asentado (decisiones 7, 34 y 35). A Ariel, nada.
  - paso: 10
    quien: Leda
    relojes: ["2026-10-27 10:00"]
    salen:
      - a: Ismael
        tipo: bloqueo_que_sigue_abierto
        tarea: PLC
        hechos: {necesita_respuesta: false, responsable: Marcos Tarquini, causa: presente,
                 trabada_desde: "2026-10-20", dias_habiles_trabada: 5}
      - a: Marcos
        tipo: asentado_que_sigue_trabada
        tarea: PLC
        hechos: {necesita_respuesta: false, causa: presente, trabada_desde: "2026-10-20",
                 dias_habiles_trabada: 5,
                 queda_asentado: {figura_en_el_informe_al_grupo: false, a: Ismael Soschinski}}
    dice:
      - "a Ismael: que Marcos está trabado con la tarea del PLC desde el martes 20, hace cinco días hábiles"
      - "a Marcos: que quedó asentado que el PLC lleva cinco días hábiles trabado"
    no_dice:
      - "a Marcos: que se le informó a alguien, ni el nombre de Ismael"

  - paso: 11
    quien: Leda
    relojes: ["2026-10-28 10:00"]
    salen:
      - a: Ariel
        tipo: repregunta
        tarea: PLC
        hechos: {necesita_respuesta: true, pregunta: cuando_se_destraba, numero: 5,
                 avisa_que_va_a_escalar: ausente}
    no_dice:
      - un reproche
      - que se va a avisar a alguien si no contesta

  - paso: 12
    quien: Ariel
    a_las: "2026-10-28 10:30"
    escribe: "perdon perdi el celular, mañana a primera hora se la paso"
    jugadas:
      - {nombre: decir_cuando_destraba, tarea: PLC, para_cuando: "2026-10-29",
         puede_traer: [lo_que_dice]}
    efectos:
      dicen_quien_destraba: [{tarea: PLC, de: Ariel, para_cuando: "2026-10-29", ya_esta: false}]
      avisos_guardados:
        - {tipo: lo_que_dijo_quien_destraba, tarea: PLC, a: Marcos, estado: guardado}
    hechos:
      - {jugada: decir_cuando_destraba, resultado: anotado, tarea: PLC,
         dice_quien_destraba: {para_cuando: "2026-10-29"},
         aviso_a_quien_esta_trabado: {a: Marcos Tarquini, llega: "~2026-10-28T10:40"}}
    pregunta: null
    estado_despues:
      de: Ariel
      pregunta_abierta: null
      esperas_abiertas: []
    dice:
      - que quedó anotado
      - que Marcos se va a enterar
    no_dice:
      - un reproche por no haber contestado

  - paso: 13
    quien: Leda
    relojes: ["2026-10-28 10:40"]
    salen:
      - {a: Marcos, tipo: lo_que_dijo_quien_destraba, tarea: PLC,
         hechos: {necesita_respuesta: false, dice_quien_destraba: {para_cuando: "2026-10-29"}}}
    dice:
      - que Ariel dice que mañana (jue 29/10) a primera hora le pasa la IP
      - que no hace falta responder, en el último renglón

  # Ya contestó: no se le pregunta más.
  - paso: 14
    quien: nadie
    relojes: ["2026-10-30 10:00"]
    salen: []
