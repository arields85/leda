id: b-0029
objetivo: >
  Quien pide revisa antes de enviar (ADR 0005 decisión 1, precisión del
  2026-09-29; T9-R1c-4): quien pide el alta de una tarea suya no es quien la
  confirma. Con el último dato esperando su Sí, la persona toca Sí y el alta
  termina: ve SU propio resumen para revisar, con Enviar a aprobación, Modificar
  y Cancelar, como respuesta a su toque. Nada se le manda todavía a su
  aprobador (no dice que se lo mandó a nadie) y no se crea ninguna tarea.
actor: Nahuel Gimenez
mensajes: []
precondiciones:
  tareas:
    - id: t1
      titulo: Cablear tablero de la máquina 3 (simulado)
      area: ot
      responsable: Marcos Tarquini
  # Nahuel pide el alta de una tarea suya: su aprobador es Marcos. El último dato
  # (el criterio de aceptación) queda propuesto, esperando su Sí
  # (`corrida._sembrar_borrador_de_alta`, `criterio_por_confirmar`).
  borrador_de_alta:
    solicitante: Nahuel Gimenez
    titulo: Cablear tablero norte
    objetivo: Objetivo simulado de Cablear tablero de la máquina 3 (simulado)
    responsable: Nahuel Gimenez
    area: ot
    fecha_objetivo: "2030-12-30"
    criterio_aceptacion: Prueba firmada
    criterio_por_confirmar: true
toques:
  - etiqueta: "Sí"
herramientas_prohibidas:
  - actualizar_estado
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - aprobar_tarea
  - adjuntar_evidencia
efectos:
  conteos_delta:
    task: 0
    task_state_event: 0
    evidence: 0
    approval: 0
# El resumen de siempre (`ingreso_tareas.render_preview`): si T10 cambia su
# redacción, actualizar acá.
respuesta_menciona:
  - "Resumen para revisar"
  - "Cablear tablero norte"
respuesta_no_contiene_patron:
  - "Le mandé el borrador"
  - "No pude completar"
# El alta es justamente lo que se prueba: un borrador es esperable.
permite_borrador_de_tarea: true
severidad: alta
