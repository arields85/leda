id: b-0022-i
variante_de: b-0022
objetivo: >
  Variante de b-0022, el borrador espera a otra persona (ADR 0013 regla 1,
  enmienda "una sola rama de conversación abierta", T9-R1d): quien pidió la
  tarea (Marcos) no es quien tiene el botón Confirmar (Ismael). El borrador no
  es una rama abierta de Marcos: su consulta sigue el camino normal, sin
  pregunta de la rama, y aparece la tarea. El borrador sigue esperando.
actor: Marcos Tarquini
mensajes: []
precondiciones:
  tareas:
    - id: t1
      titulo: Cablear tablero de la máquina 3 (simulado)
      area: ot
      responsable: Marcos Tarquini
  # El alta ya armada y esperando confirmación, sembrada en la base con las
  # mismas filas que crea el alta real (`corrida._sembrar_borrador_de_alta`).
  # Marcos escribe, pero lo suyo lo confirma Ismael.
  borrador_de_alta:
    solicitante: Marcos Tarquini
    titulo: Cablear tablero norte
    objetivo: Objetivo simulado de Cablear tablero de la máquina 3 (simulado)
    responsable: Marcos Tarquini
    area: ot
    fecha_objetivo: "2030-12-30"
    criterio_aceptacion: Prueba firmada
mensajes_tras_toques:
  - "¿qué tareas tengo abiertas?"
herramientas_prohibidas:
  - actualizar_estado
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - aprobar_tarea
efectos:
  conteos_delta:
    task: 0
    task_state_event: 0
    evidence: 0
    approval: 0
# La consulta se atiende de verdad (aparece la tarea) y no hay pregunta de la rama.
respuesta_menciona:
  - "Cablear tablero"
respuesta_no_contiene_patron:
  - "Estábamos con"
# El alta es justamente lo que se prueba: un borrador es esperable.
permite_borrador_de_tarea: true
permite_pregunta_sin_opciones: true
severidad: alta
