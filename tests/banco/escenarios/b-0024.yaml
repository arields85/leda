id: b-0024
objetivo: >
  La aclaración con botones ("¿A cuál te referís?") es una rama abierta (ADR
  0013 regla 1, enmienda "una sola rama de conversación abierta", T9-R1d-1c):
  con la aclaración de una referencia ambigua esperando (dos tareas candidatas),
  la persona pide otra cosa (una consulta sobre sus tareas). Leda no la
  atiende todavía: hace una sola pregunta con dos botones sobre lo pendiente
  ("Estábamos con la tarea a la que te referías con «el cableado». ¿Seguimos con
  eso?"). La consulta no se contesta y no se aplica nada. La aclaración se
  siembra (no depende de que Jev deje la referencia ambigua). El mensaje que se
  evalúa es el que llega después de la aclaración (`mensajes_tras_toques`).
actor: Nahuel Gimenez
mensajes: []
precondiciones:
  aclaracion:
    mensaje: "quedé trabado con el cableado, todavía no me pasaron el plano que prometieron"
    referencia: el cableado
    tareas:
      - Cablear tablero de la máquina 3 (simulado)
      - Cablear tablero de la máquina 4 (simulado)
  tareas:
    - id: t1
      titulo: Cablear tablero de la máquina 3 (simulado)
      area: ot
      responsable: Nahuel Gimenez
    - id: t2
      titulo: Cablear tablero de la máquina 4 (simulado)
      area: ot
      responsable: Nahuel Gimenez
    - id: t3
      titulo: Revisar variador de la línea 2 (simulado)
      area: ot
      responsable: Nahuel Gimenez
mensajes_tras_toques:
  - "¿qué tareas tengo abiertas?"
herramientas_prohibidas:
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - quitar_dependencia
  - aprobar_tarea
  - actualizar_estado
efectos:
  conteos_delta:
    task: 0
    blocker: 0
    task_state_event: 0
    evidence: 0
    approval: 0
# La pregunta de la rama (`gateway.PREGUNTA_RAMA_ABIERTA` y el nombre de la
# aclaración en `gateway._pregunta_de_la_eleccion`; si T10 cambia su redacción,
# actualizar acá) y la consulta sin contestar: la tercera tarea no aparece.
respuesta_menciona:
  - "Estábamos con la tarea a la que te referías con «el cableado»"
  - "Seguimos con eso"
respuesta_no_contiene_patron:
  - "Revisar variador"
severidad: alta
