id: b-0023
objetivo: >
  La vista previa de un cambio que la persona pidió es una rama abierta (ADR
  0013 regla 1, enmienda "una sola rama de conversación abierta", T9-R1d-1b):
  con la vista previa de un bloqueo esperando su Confirmar, la persona pide otra
  cosa (una consulta sobre sus tareas). Prisma no la atiende todavía: hace una
  sola pregunta con dos botones sobre lo pendiente ("Estábamos con el cambio que
  te mostré. ¿Seguimos con eso?"). La consulta no se contesta y no se aplica
  nada antes del Confirmar; ese toque lo simula el corredor al final, sobre la
  vista previa original, que sigue esperando. El mensaje que se evalúa es el que
  llega después de la vista previa (`mensajes_tras_toques`).
actor: Nahuel Gimenez
mensajes:
  - "quedé trabado con el cableado, todavía no me pasaron el plano que prometieron"
precondiciones:
  tareas:
    - id: t1
      titulo: Cablear tablero de la máquina 3 (simulado)
      area: ot
      responsable: Nahuel Gimenez
    - id: t2
      titulo: Revisar variador de la línea 2 (simulado)
      area: ot
      responsable: Nahuel Gimenez
mensajes_tras_toques:
  - "¿qué tareas tengo abiertas?"
herramientas_esperadas:
  - registrar_bloqueo
herramientas_prohibidas:
  - resolver_bloqueo
  - crear_dependencia
  - quitar_dependencia
  - aprobar_tarea
  - actualizar_estado
efectos:
  conteos_delta:
    blocker: 1
# La pregunta de la rama (`gateway.PREGUNTA_RAMA_ABIERTA` y
# `gateway.NOMBRE_VISTA_PREVIA`; si T10 cambia su redacción, actualizar acá) y
# la consulta sin contestar: la otra tarea no aparece.
respuesta_menciona:
  - "Estábamos con el cambio que te mostré"
  - "Seguimos con eso"
respuesta_no_contiene_patron:
  - "Revisar variador"
severidad: alta
