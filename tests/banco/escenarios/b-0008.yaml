  Hay dos tareas de "tablero" abiertas a la vez para el mismo actor y el
  mensaje no dice cuál. Observar si Leda frena y pregunta cuál en vez de
  adivinar o mover la que no corresponde.
actor: Marcos Tarquini
mensajes:
  - "ya termine lo del tablero, pasala a revision"
precondiciones:
  tareas:
