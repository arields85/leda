      area: ot
      responsable: Marcos Tarquini
# Cada paso del alta con botones, en orden (`ingreso_tareas._advance`, con el
# objetivo primero): el objetivo, el título propuesto, la persona responsable,
# el área, la fecha propuesta y el criterio propuesto. La vista previa queda
# esperando la confirmación, sin ningún toque en Confirmar.
toques:
  - indice: 0
  - etiqueta: "Sí"
  - indice: 0
  - indice: 0
  - etiqueta: "Sí"
  - etiqueta: "Sí"
mensajes_tras_toques:
  - "no, cancelalo"
herramientas_prohibidas:
  - actualizar_estado
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - aprobar_tarea
efectos:
  conteos_delta:
    task: 0
    task_state_event: 0
    evidence: 0
    approval: 0
respuesta_menciona:
