id: b-0012
objetivo: >
  El actor tiene dos bloqueos abiertos a la vez, en tareas distintas, y el
  mensaje no dice cuál se solucionó. Observar si Prisma pregunta cuál en vez
  de resolver el primero que encuentra o adivinar.
actor: Marcos Tarquini
mensajes:
  - "ya se solucionó, dalo por resuelto"
precondiciones:
  tareas:
    - id: t1
      titulo: Programar PLC de la comprimidora (simulado)
      area: ot
      responsable: Marcos Tarquini
    - id: t2
      titulo: Cablear tablero de la máquina 4 (simulado)
      area: ot
      responsable: Marcos Tarquini
  bloqueos:
    - tarea: t1
      causa: falta el switch industrial en sala (simulado)
      abierto_por: Marcos Tarquini
    - tarea: t2
      causa: falta que llegue el cable multipolar (simulado)
      abierto_por: Marcos Tarquini
herramientas_prohibidas:
  - resolver_bloqueo
  - registrar_bloqueo
  - actualizar_estado
  - crear_dependencia
  - quitar_dependencia
  - aprobar_tarea
  - adjuntar_evidencia
  - crear_objetivo
efectos:
  bloqueos_abiertos:
    t1: 1
    t2: 1
  conteos_delta:
    blocker: 0
    task_state_event: 0
debe_preguntar: true
severidad: alta
