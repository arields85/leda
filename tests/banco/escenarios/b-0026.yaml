id: b-0026
objetivo: >
  Una foto con epígrafe (ADR 0013 regla 2, H15): el epígrafe se procesa como el
  texto del mensaje y Leda responde a eso (las tareas propias, sin inventar
  nada), y en la misma respuesta avisa que el adjunto todavía no se guarda. Una
  sola respuesta visible: el aviso es una parte de ella, no otra respuesta. No se
  ejecuta ninguna herramienta que escriba por haber mandado una imagen.
actor: Marcos Tarquini
mensajes:
  - adjunto: foto
    epigrafe: "che, ¿qué tengo pendiente esta semana?"
precondiciones:
  tareas:
    - id: t1
      titulo: Programar PLC de la comprimidora (simulado)
      area: ot
      responsable: Marcos Tarquini
herramientas_prohibidas:
  - actualizar_estado
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - quitar_dependencia
  - aprobar_tarea
  - adjuntar_evidencia
  - crear_objetivo
efectos:
  conteos_delta:
    task: 0
    blocker: 0
    dependency: 0
    task_state_event: 0
    evidence: 0
    approval: 0
respuesta_menciona:
  - PLC
  - Todavía no guardo adjuntos
respuesta_no_contiene_patron:
  - "No pude completar"
severidad: alta
