id: b-0022-e
variante_de: b-0022
objetivo: >
  Variante de b-0022, el borrador esperando confirmación: la persona escribe
  "sí, dale". Un mensaje no confirma el borrador (la conversión es explícita,
  con el botón Confirmar): Prisma lo dice y el borrador sigue esperando.
actor: Marcos Tarquini
mensajes: []
precondiciones:
  tareas:
    - id: t1
      titulo: Cablear tablero de la máquina 3 (simulado)
      area: ot
      responsable: Marcos Tarquini
  # El alta ya armada y esperando confirmación, sembrada en la base con las
  # mismas filas que crea el alta real (`corrida._sembrar_borrador_de_alta`):
  # lo que se evalúa es lo que pasa con el mensaje que llega después
  # (`mensajes_tras_toques`), no el armado del alta con el modelo.
  borrador_de_alta:
    solicitante: Marcos Tarquini
    titulo: Cablear tablero norte
    objetivo: Objetivo simulado de Cablear tablero de la máquina 3 (simulado)
    responsable: Marcos Tarquini
    area: ot
    fecha_objetivo: "2030-12-30"
    criterio_aceptacion: Prueba firmada
mensajes_tras_toques:
  - "sí, dale"
herramientas_prohibidas:
  - actualizar_estado
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - aprobar_tarea
efectos:
  conteos_delta:
    task: 0
    task_state_event: 0
    evidence: 0
    approval: 0
# La respuesta es `ingreso_tareas.DRAFT_AWAITING_CONFIRMATION`: si
# cambia su redacción, actualizar acá.
respuesta_menciona:
  - "esperando confirmación"
  - "Confirmar"
# El alta es justamente lo que se prueba: un borrador es esperable.
permite_borrador_de_tarea: true
# La respuesta es un texto sin botones a propósito: se exime la
# comprobación de ADR 0007 sobre preguntas sin opciones.
permite_pregunta_sin_opciones: true
severidad: alta
