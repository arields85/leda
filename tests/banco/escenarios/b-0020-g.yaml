id: b-0020-g
variante_de: b-0020
objetivo: >
  Variante de b-0020, seguir con lo pendiente (ADR 0013 regla 1, enmienda "una
  sola rama de conversación abierta", T9-R1d): con Modificar tocado, la
  persona pide otra cosa y Prisma pregunta si sigue con lo pendiente; la
  persona toca "Seguir con eso". Prisma vuelve a preguntar qué cambiar, la
  consulta no se contesta y no hay ningún efecto.
actor: Nahuel Gimenez
mensajes:
  - "quedé trabado con el cableado, todavía no me pasaron el plano que prometieron"
precondiciones:
  tareas:
    - id: t1
      titulo: Cablear tablero de la máquina 3 (simulado)
      area: ot
      responsable: Nahuel Gimenez
toques:
  - etiqueta: "Modificar"
mensajes_tras_toques:
  - "¿qué tareas tengo abiertas?"
# El toque en la pregunta de la rama: la respuesta que se evalúa es la de este
# toque (`gateway.ETIQUETA_SEGUIR_RAMA`; si T10 cambia su redacción, actualizar acá).
toques_tras_mensajes:
  - etiqueta: "Seguir con eso"
herramientas_prohibidas:
  - resolver_bloqueo
  - crear_dependencia
  - quitar_dependencia
  - aprobar_tarea
  - actualizar_estado
  - registrar_bloqueo
efectos:
  tareas:
    t1:
      estado: asignada
  conteos_delta:
    task: 0
    blocker: 0
    task_state_event: 0
    evidence: 0
    approval: 0
# Vuelve la pregunta pendiente (fragmento de `gateway.PREGUNTA_MODIFICAR`; si
# T10 cambia su redacción, actualizar acá) y la consulta sigue sin atenderse.
respuesta_menciona:
  - "cambiar"
respuesta_no_contiene_patron:
  - "Cablear tablero"
  - "Estábamos con"
permite_pregunta_sin_opciones: true
severidad: alta
