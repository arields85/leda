id: b-0022-f
variante_de: b-0022
objetivo: >
  Variante de b-0022, corregir el borrador: con la vista previa esperando, la
  persona pide cambiar la fecha. Un mensaje que corrige lleva al mismo camino
  que el botón Modificar (T9-R1c-3): Leda pregunta qué dato cambiar, con un
  botón por dato, y no aplica nada.
actor: Ismael Soschinski
mensajes: []
precondiciones:
  tareas:
    - id: t1
      titulo: Cablear tablero de la máquina 3 (simulado)
      area: ot
      responsable: Marcos Tarquini
  # El alta ya armada y esperando confirmación, sembrada en la base con las
  # mismas filas que crea el alta real (`corrida._sembrar_borrador_de_alta`).
  # Quien escribe (Ismael) es quien confirma lo de Marcos: sólo entonces el
  # borrador es una pregunta abierta suya (ADR 0013 regla 1, enmienda):
  # lo que se evalúa es lo que pasa con el mensaje que llega después
  # (`mensajes_tras_toques`), no el armado del alta con el modelo.
  borrador_de_alta:
    solicitante: Ismael Soschinski
    titulo: Cablear tablero norte
    objetivo: Objetivo simulado de Cablear tablero de la máquina 3 (simulado)
    responsable: Marcos Tarquini
    area: ot
    fecha_objetivo: "2030-12-30"
    criterio_aceptacion: Prueba firmada
mensajes_tras_toques:
  - "cambiale la fecha para el 5 de enero"
herramientas_prohibidas:
  - actualizar_estado
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - aprobar_tarea
efectos:
  conteos_delta:
    task: 0
    task_state_event: 0
    evidence: 0
    approval: 0
# La respuesta es `ingreso_tareas.MODIFY_PICKER_PROMPT`, con un botón por dato: si
# cambia su redacción, actualizar acá.
respuesta_menciona:
  - "qué dato querés cambiar"
# El alta es justamente lo que se prueba: un borrador es esperable.
permite_borrador_de_tarea: true
severidad: alta
