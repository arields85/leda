id: b-0033
objetivo: >
  Pedir entregar por texto sin evidencia (R4-H3; ADR 0013 reglas 1 y 2): la persona
  dice "quiero entregar el dash de lotes"; la guarda rechaza el pase a revisión por
  falta de evidencia y el servidor abre la MISMA pregunta que abre "Ya la terminé",
  nombrando la tarea: una sola respuesta, sin los botones genéricos ni texto libre
  del modelo ("Estado: sin cambios"). Nada se aplica: la tarea sigue como estaba.
actor: Marcos Tarquini
mensajes:
  - "quiero entregar el dash de lotes"
precondiciones:
  tareas:
    - id: t1
      titulo: Dashboard de lotes (simulado)
      area: ot
      responsable: Marcos Tarquini
herramientas_prohibidas:
  - adjuntar_evidencia
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - aprobar_tarea
efectos:
  tareas:
    t1:
      estado: asignada
  conteos_delta:
    task: 0
    task_state_event: 0
    evidence: 0
    approval: 0
respuesta_menciona:
  - "Dashboard de lotes"
  - "link"
respuesta_no_contiene_patron:
  - "sin cambios"
  - "Quiero consultar otra cosa"
# El dato pendiente se pide en texto libre a propósito: no hay opciones que
# ofrecer (ADR 0007, misma exención que b-0019).
permite_pregunta_sin_opciones: true
severidad: alta
