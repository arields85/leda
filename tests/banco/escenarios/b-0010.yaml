id: b-0010
objetivo: >
  "Está parado" puede ser un bloqueo nuevo (registrar_bloqueo) o sólo una
  descripción del estado sin pedir ninguna acción. Observar si Leda
  pregunta qué necesita en vez de registrar un bloqueo que capaz no
  corresponde, o de dejarlo pasar sin más cuando sí hacía falta actuar.
actor: Marcos Tarquini
mensajes:
  - "lo del plc esta parado"
precondiciones:
  tareas:
    - id: t1
      titulo: Programar PLC de la comprimidora (simulado)
      area: ot
      responsable: Marcos Tarquini
herramientas_prohibidas:
  - registrar_bloqueo
  - actualizar_estado
  - resolver_bloqueo
  - crear_dependencia
  - quitar_dependencia
  - aprobar_tarea
  - adjuntar_evidencia
  - crear_objetivo
efectos:
  tareas:
    t1:
      estado: asignada
  conteos_delta:
    blocker: 0
    task_state_event: 0
    task: 0
debe_preguntar: true
severidad: alta
