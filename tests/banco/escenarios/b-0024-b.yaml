id: b-0024-b
variante_de: b-0024
objetivo: >
  Variante de b-0024, dejar la aclaración para ver lo otro: con la aclaración de
  una referencia ambigua esperando, la persona pide otra cosa y Prisma pregunta
  si sigue con lo pendiente; la persona toca "Dejarlo y ver lo otro". Se cierra
  la aclaración sin aplicar nada, se dice qué se dejó de lado y, en la misma
  respuesta, se atiende la consulta guardada (aparece la tercera tarea).
actor: Nahuel Gimenez
mensajes: []
precondiciones:
  aclaracion:
    mensaje: "quedé trabado con el cableado, todavía no me pasaron el plano que prometieron"
    referencia: el cableado
    tareas:
      - Cablear tablero de la máquina 3 (simulado)
      - Cablear tablero de la máquina 4 (simulado)
  tareas:
    - id: t1
      titulo: Cablear tablero de la máquina 3 (simulado)
      area: ot
      responsable: Nahuel Gimenez
    - id: t2
      titulo: Cablear tablero de la máquina 4 (simulado)
      area: ot
      responsable: Nahuel Gimenez
    - id: t3
      titulo: Revisar variador de la línea 2 (simulado)
      area: ot
      responsable: Nahuel Gimenez
mensajes_tras_toques:
  - "¿qué tareas tengo abiertas?"
# El toque en la pregunta de la rama (`gateway.ETIQUETA_DEJAR_RAMA`; si T10
# cambia su redacción, actualizar acá).
toques_tras_mensajes:
  - etiqueta: "Dejarlo y ver lo otro"
herramientas_prohibidas:
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - quitar_dependencia
  - aprobar_tarea
  - actualizar_estado
efectos:
  conteos_delta:
    task: 0
    blocker: 0
    task_state_event: 0
    evidence: 0
    approval: 0
respuesta_menciona:
  - "dejé de lado la aclaración"
  - "Revisar variador"
respuesta_no_contiene_patron:
  - "Estábamos con"
permite_pregunta_sin_opciones: true
severidad: alta
