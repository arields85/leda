id: b-0022-h
variante_de: b-0022
objetivo: >
  Variante de b-0022, otro tema con el borrador esperando confirmación (ADR
  0013 regla 1, enmienda "una sola rama de conversación abierta", T9-R1d): quien
  tiene el botón Confirmar (Ismael) consulta sus tareas. Prisma no la atiende
  todavía: hace una sola pregunta con dos botones sobre el borrador ("Estábamos
  con la confirmación del borrador de la tarea nueva. ¿Seguimos con eso?"). El
  borrador sigue esperando y la consulta no se contesta.
actor: Ismael Soschinski
mensajes: []
precondiciones:
  tareas:
    - id: t1
      titulo: Cablear tablero de la máquina 3 (simulado)
      area: ot
      responsable: Marcos Tarquini
  # El alta ya armada y esperando confirmación, sembrada en la base con las
  # mismas filas que crea el alta real (`corrida._sembrar_borrador_de_alta`).
  # Quien escribe (Ismael) es quien confirma lo de Marcos: sólo entonces el
  # borrador es una pregunta abierta suya.
  borrador_de_alta:
    solicitante: Ismael Soschinski
    titulo: Cablear tablero norte
    objetivo: Objetivo simulado de Cablear tablero de la máquina 3 (simulado)
    responsable: Marcos Tarquini
    area: ot
    fecha_objetivo: "2030-12-30"
    criterio_aceptacion: Prueba firmada
mensajes_tras_toques:
  - "¿qué tareas tengo abiertas?"
herramientas_prohibidas:
  - actualizar_estado
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - aprobar_tarea
efectos:
  conteos_delta:
    task: 0
    task_state_event: 0
    evidence: 0
    approval: 0
# La pregunta de la rama (`gateway.PREGUNTA_RAMA_ABIERTA`; si T10 cambia su
# redacción, actualizar acá) y la consulta sin contestar: la tarea no aparece.
respuesta_menciona:
  - "Estábamos con"
  - "Seguimos con eso"
respuesta_no_contiene_patron:
  - "Cablear tablero de la máquina"
# El alta es justamente lo que se prueba: un borrador es esperable.
permite_borrador_de_tarea: true
severidad: alta
