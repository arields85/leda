id: b-0023-e
variante_de: b-0023
objetivo: >
  Variante de b-0023, dejar la vista previa para ver lo otro: con la vista
  previa de un bloqueo esperando su Confirmar, la persona pide otra cosa y
  Leda pregunta si sigue con lo pendiente; la persona toca "Dejarlo y ver lo
  otro". Se cancela la vista previa sin aplicar nada, se dice qué se dejó de
  lado y, en la misma respuesta, se atiende la consulta guardada (aparece la
  otra tarea) sin volver a proponer el bloqueo que se acaba de dejar. La vista
  previa se siembra (T9-R1d-1c): con dos tareas en juego, el primer mensaje
  dejaba a Jev con una referencia ambigua y abría la aclaración con botones, no
  la vista previa.
actor: Nahuel Gimenez
mensajes: []
precondiciones:
  vista_previa:
    herramienta: registrar_bloqueo
    tarea: Cablear tablero de la máquina 3 (simulado)
    args:
      causa: no me pasaron el plano que prometieron
  tareas:
    - id: t1
      titulo: Cablear tablero de la máquina 3 (simulado)
      area: ot
      responsable: Nahuel Gimenez
    - id: t2
      titulo: Revisar variador de la línea 2 (simulado)
      area: ot
      responsable: Nahuel Gimenez
mensajes_tras_toques:
  - "¿qué tareas tengo abiertas?"
# El toque en la pregunta de la rama (`gateway.ETIQUETA_DEJAR_RAMA`; si T10
# cambia su redacción, actualizar acá).
toques_tras_mensajes:
  - etiqueta: "Dejarlo y ver lo otro"
herramientas_prohibidas:
  - resolver_bloqueo
  - crear_dependencia
  - quitar_dependencia
  - aprobar_tarea
  - actualizar_estado
  - registrar_bloqueo
efectos:
  tareas:
    t1:
      estado: asignada
  conteos_delta:
    task: 0
    blocker: 0
    task_state_event: 0
    evidence: 0
    approval: 0
respuesta_menciona:
  - "dejé de lado"
  - "Revisar variador"
respuesta_no_contiene_patron:
  - "Estábamos con"
permite_pregunta_sin_opciones: true
severidad: alta
