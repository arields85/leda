id: b-0021-c
variante_de: b-0021
objetivo: >
  Variante de b-0021, otro tema (ADR 0013 regla 1, enmienda "una sola rama de
  conversación abierta", T9-R1d): con la pregunta del título abierta, la
  persona consulta sus tareas. Leda no la atiende todavía: hace una sola
  pregunta con dos botones sobre lo pendiente ("Estábamos con el título de la
  tarea nueva. ¿Seguimos con eso?"). La consulta no se contesta, no se toma
  como título y no se vuelve a proponer el alta.
actor: Marcos Tarquini
mensajes:
  - "armame una tarea nueva"
precondiciones:
  tareas:
    - id: t1
      titulo: Cablear tablero de la máquina 3 (simulado)
      area: ot
      responsable: Marcos Tarquini
# El primer toque elige el objetivo (el alta guiada pide primero las opciones
# con botones); el mensaje que se evalúa es el que llega después, con la
# pregunta del título abierta (`mensajes_tras_toques`).
toques:
  - indice: 0
mensajes_tras_toques:
  - "¿qué tareas tengo abiertas?"
herramientas_prohibidas:
  - actualizar_estado
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - aprobar_tarea
efectos:
  conteos_delta:
    task: 0
    task_state_event: 0
    evidence: 0
    approval: 0
# La pregunta de la rama (`gateway.PREGUNTA_RAMA_ABIERTA`; si T10 cambia su
# redacción, actualizar acá) y la consulta sin contestar: la tarea no aparece.
# La regla H7 (T10-5: hasta tres tareas se nombran) rige cuando la consulta se contesta;
# acá no se contesta -- la respuesta es la pregunta de la rama --, así que sigue sin nombrarla.
respuesta_menciona:
  - "Estábamos con"
  - "Seguimos con eso"
respuesta_no_contiene_patron:
  - "Cablear tablero"
# El alta es justamente lo que se prueba: un borrador es esperable. La
# pregunta de la rama trae sus botones, pero la exención se conserva porque
# toda la familia b-0021 la declara (el título es de texto libre).
permite_borrador_de_tarea: true
permite_pregunta_sin_opciones: true
severidad: alta
