id: b-0021-c
variante_de: b-0021
objetivo: >
  Variante de b-0021, otro tema: con la pregunta del título abierta, la
  persona consulta sus tareas. Se atiende la consulta (aparece la tarea) y
  Prisma retoma el título dentro de la misma respuesta, sin tomar la
  consulta como título ni volver a proponer el alta.
actor: Marcos Tarquini
mensajes:
  - "armame una tarea nueva"
precondiciones:
  tareas:
    - id: t1
      titulo: Cablear tablero de la máquina 3 (simulado)
      area: ot
      responsable: Marcos Tarquini
# El primer toque elige el objetivo (el alta guiada pide primero las opciones
# con botones); el mensaje que se evalúa es el que llega después, con la
# pregunta del título abierta (`mensajes_tras_toques`).
toques:
  - indice: 0
mensajes_tras_toques:
  - "¿qué tareas tengo abiertas?"
herramientas_prohibidas:
  - actualizar_estado
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - aprobar_tarea
efectos:
  conteos_delta:
    task: 0
    task_state_event: 0
    evidence: 0
    approval: 0
# Se atiende de verdad (la tarea) y se retoma la pregunta abierta
# (`ingreso_tareas._free_text_prompt`).
respuesta_menciona:
  - "Cablear tablero"
  - "título"
# El alta es justamente lo que se prueba: un borrador es esperable. La
# pregunta del título es de texto libre a propósito (no hay opciones que
# ofrecer): se exime la comprobación de ADR 0007 sobre preguntas sin botones.
permite_borrador_de_tarea: true
permite_pregunta_sin_opciones: true
severidad: alta
