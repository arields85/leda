id: b-0025
objetivo: >
  Modificar en la vista previa del borrador del alta (ADR 0005 decisión 1,
  precisión del 2026-09-29): con la vista previa esperando, la persona toca
  Modificar, elige el título y manda el título corregido. Cambia sólo ese dato:
  la vista previa vuelve con el título nuevo y lo demás como estaba. La tarea no
  se crea (sólo Confirmar la crea).
actor: Ismael Soschinski
mensajes: []
precondiciones:
  tareas:
    - id: t1
      titulo: Cablear tablero de la máquina 3 (simulado)
      area: ot
      responsable: Marcos Tarquini
    - id: t2
      titulo: Revisar tablero eléctrico (simulado)
      area: ot
      responsable: Marcos Tarquini
  # El alta ya armada y esperando confirmación, sembrada por el corredor DENTRO
  # de la corrida (`corrida._sembrar_borrador_de_alta`) para que sus botones
  # cuenten como de ella: este escenario toca Modificar. Quien escribe (Ismael)
  # es quien confirma lo de Marcos, así que Modificar es suyo.
  borrador_de_alta:
    solicitante: Ismael Soschinski
    titulo: Cablear tablero norte
    objetivo: Objetivo simulado de Cablear tablero de la máquina 3 (simulado)
    responsable: Marcos Tarquini
    area: ot
    fecha_objetivo: "2030-12-30"
    criterio_aceptacion: Prueba firmada
toques:
  - etiqueta: "Modificar"
  - etiqueta: "Título"
# El título corregido es lo que se evalúa: el corredor no lo confirma (una vista
# previa de borrador no se confirma sola).
mensajes_tras_toques:
  - "Cablear tablero sur"
herramientas_prohibidas:
  - actualizar_estado
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - aprobar_tarea
efectos:
  conteos_delta:
    task: 0
    task_state_event: 0
    evidence: 0
    approval: 0
# La vista previa vuelve (`ingreso_tareas.render_preview`) con el título nuevo y
# los demás datos como estaban.
respuesta_menciona:
  - "Título: Cablear tablero sur"
  - "Fecha objetivo: 30/12/2030"
  - "Criterio de aceptación: Prueba firmada"
respuesta_no_contiene_patron:
  - "Cablear tablero norte"
# El alta es justamente lo que se prueba: un borrador es esperable.
permite_borrador_de_tarea: true
severidad: alta
