id: b-0032
objetivo: >
  Dejar de lado el saludo (R4-H2; ADR 0013): a "hola" Prisma contesta con los
  botones genéricos y la persona toca "Quiero consultar otra cosa". El cierre es
  "Dale, escribime qué necesitás." a secas: un saludo no es un tema y no se
  nombra ("dejamos de lado «Hola…»").
actor: Marcos Tarquini
mensajes:
  - "hola"
toques:
  - etiqueta: "Quiero consultar otra cosa"
precondiciones:
  tareas:
    - id: t1
      titulo: Programar PLC de la comprimidora (simulado)
      area: ot
      responsable: Marcos Tarquini
herramientas_prohibidas:
  - actualizar_estado
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - aprobar_tarea
  - adjuntar_evidencia
  - crear_objetivo
efectos:
  conteos_delta:
    task: 0
    task_state_event: 0
    evidence: 0
    approval: 0
respuesta_menciona:
  - "escribime qué necesitás"
respuesta_no_contiene_patron:
  - "dejamos de lado"
permite_pregunta_sin_opciones: true
severidad: media
