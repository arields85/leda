id: b-0022-b
variante_de: b-0022
objetivo: >
  Variante de b-0022, otro tema: con la elección del objetivo abierta, la
  persona consulta sus tareas. Se atiende la consulta (aparece la tarea) y no
  se elige ningún objetivo por ella.
actor: Marcos Tarquini
mensajes:
  - "armame una tarea nueva"
precondiciones:
  tareas:
    - id: t1
      titulo: Cablear tablero de la máquina 3 (simulado)
      area: ot
      responsable: Marcos Tarquini
# La elección del objetivo queda abierta apenas empieza el alta: el
# mensaje que se evalúa es el que llega después (`mensajes_tras_toques`).
mensajes_tras_toques:
  - "¿qué tareas tengo abiertas?"
herramientas_prohibidas:
  - actualizar_estado
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - aprobar_tarea
efectos:
  conteos_delta:
    task: 0
    task_state_event: 0
    evidence: 0
    approval: 0
# La lista de tareas trae sus propios botones, así que la regla 1 no
# agrega el retome (`_interacciones_pendientes`): no se exige acá.
respuesta_menciona:
  - "Cablear tablero"
# El alta es justamente lo que se prueba: un borrador es esperable.
permite_borrador_de_tarea: true
severidad: alta
