id: b-0022-b
variante_de: b-0022
objetivo: >
  Variante de b-0022, otro tema (ADR 0013 regla 1, enmienda "una sola rama de
  conversación abierta", T9-R1d): con la elección del objetivo abierta, la
  persona consulta sus tareas. Prisma no la atiende todavía: hace una sola
  pregunta con dos botones sobre lo pendiente ("Estábamos con la elección
  sobre el objetivo de la tarea nueva. ¿Seguimos con eso?"). No se elige
  ningún objetivo por ella y la consulta no se contesta.
actor: Marcos Tarquini
mensajes:
  - "armame una tarea nueva"
precondiciones:
  tareas:
    - id: t1
      titulo: Cablear tablero de la máquina 3 (simulado)
      area: ot
      responsable: Marcos Tarquini
# La elección del objetivo queda abierta apenas empieza el alta: el
# mensaje que se evalúa es el que llega después (`mensajes_tras_toques`).
mensajes_tras_toques:
  - "¿qué tareas tengo abiertas?"
herramientas_prohibidas:
  - actualizar_estado
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - aprobar_tarea
efectos:
  conteos_delta:
    task: 0
    task_state_event: 0
    evidence: 0
    approval: 0
# La pregunta de la rama (`gateway.PREGUNTA_RAMA_ABIERTA`; si T10 cambia su
# redacción, actualizar acá) y la consulta sin contestar: la tarea no aparece.
respuesta_menciona:
  - "Estábamos con"
  - "Seguimos con eso"
respuesta_no_contiene_patron:
  - "Cablear tablero"
# El alta es justamente lo que se prueba: un borrador es esperable.
permite_borrador_de_tarea: true
severidad: alta
