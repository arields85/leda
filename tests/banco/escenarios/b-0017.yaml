id: b-0017
objetivo: >
  Prisma orienta, no charla (ADR 0007, T4): tocar una tarea de la lista abre
  su menú de acciones (T2) y tocar una acción que cambia algo llega a la
  vista previa de siempre -- nada se aplica en PostgreSQL antes de tocar
  Confirmar (ADR 0005, decisión 1). Los dos toques ("indice: 0" -- la primera
  tarea de la lista -- y la etiqueta del menú) los simula el corredor
  (`corrida.ejecutar_escenario`, T4), no el modelo: representan a la persona
  tocando los botones que Prisma ofreció.
actor: Marcos Tarquini
mensajes:
  - "pasame la lista completa de mis tareas"
precondiciones:
  tareas:
    - id: t1
      titulo: Programar PLC de la comprimidora (simulado)
      area: ot
      responsable: Marcos Tarquini
      # ADR 0009: "Ya la terminé" ahora pide la evidencia que falta antes de
      # la vista previa, cuando la política la exige -- el corredor no tiene
      # un paso de texto libre intercalado entre dos toques (`toques` sólo
      # resuelve botones), así que esta tarea no la exige a propósito. Lo
      # que este escenario prueba (tocar hasta el Confirmar automático) no
      # cambia; extender el corredor queda PENDIENTE, fuera de esta unidad.
      evidencia_requerida: []
toques:
  - indice: 0
  - etiqueta: "Ya la terminé"
efectos:
  tareas:
    t1:
      estado: en_revision
severidad: alta
