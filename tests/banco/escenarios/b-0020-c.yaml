id: b-0020-c
variante_de: b-0020
objetivo: >
  Variante de b-0020, otro tema (ADR 0013 regla 1, enmienda "una sola rama de
  conversación abierta", T9-R1d): con Modificar tocado, la persona pide otra
  cosa (una consulta sobre sus tareas). Leda no la atiende todavía: hace una
  sola pregunta con dos botones sobre lo pendiente ("Estábamos con la
  corrección de la propuesta. ¿Seguimos con eso?"). La consulta no se
  contesta, no se toma como la corrección y no hay ningún efecto sobre la tarea.
actor: Nahuel Gimenez
mensajes:
  - "quedé trabado con el cableado, todavía no me pasaron el plano que prometieron"
precondiciones:
  tareas:
    - id: t1
      titulo: Cablear tablero de la máquina 3 (simulado)
      area: ot
      responsable: Nahuel Gimenez
toques:
  - etiqueta: "Modificar"
mensajes_tras_toques:
  - "¿qué tareas tengo abiertas?"
herramientas_prohibidas:
  - resolver_bloqueo
  - crear_dependencia
  - quitar_dependencia
  - aprobar_tarea
  - actualizar_estado
  - registrar_bloqueo
efectos:
  tareas:
    t1:
      estado: asignada
  conteos_delta:
    task: 0
    blocker: 0
    task_state_event: 0
    evidence: 0
    approval: 0
# La pregunta de la rama (`gateway.PREGUNTA_RAMA_ABIERTA`; si T10 cambia su
# redacción, actualizar acá) y la consulta sin contestar: la tarea no aparece.
# La regla H7 (T10-5: hasta tres tareas se nombran) rige cuando la consulta se contesta;
# acá no se contesta -- la respuesta es la pregunta de la rama --, así que sigue sin nombrarla.
respuesta_menciona:
  - "Estábamos con"
  - "Seguimos con eso"
respuesta_no_contiene_patron:
  - "Cablear tablero"
severidad: alta
