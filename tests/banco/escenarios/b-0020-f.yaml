id: b-0020-f
variante_de: b-0020
objetivo: >
  Variante de b-0020, dejar lo pendiente para ver lo otro (ADR 0013 regla 1,
  enmienda "una sola rama de conversación abierta", T9-R1d): con Modificar
  tocado, la persona pide otra cosa y Leda pregunta si sigue con lo
  pendiente; la persona toca "Dejarlo y ver lo otro". Se cierra la corrección
  sin aplicar nada, se dice qué se dejó de lado y, en la misma respuesta, se
  atiende la consulta guardada (aparece la tarea) sin pedir que la repita.
actor: Nahuel Gimenez
mensajes:
  - "quedé trabado con el cableado, todavía no me pasaron el plano que prometieron"
precondiciones:
  tareas:
    - id: t1
      titulo: Cablear tablero de la máquina 3 (simulado)
      area: ot
      responsable: Nahuel Gimenez
toques:
  - etiqueta: "Modificar"
mensajes_tras_toques:
  - "¿qué tareas tengo abiertas?"
# El toque en la pregunta de la rama: la respuesta que se evalúa es la de este
# toque (`gateway.ETIQUETA_DEJAR_RAMA`; si T10 cambia su redacción, actualizar acá).
toques_tras_mensajes:
  - etiqueta: "Dejarlo y ver lo otro"
herramientas_prohibidas:
  - resolver_bloqueo
  - crear_dependencia
  - quitar_dependencia
  - aprobar_tarea
  - actualizar_estado
  - registrar_bloqueo
efectos:
  tareas:
    t1:
      estado: asignada
  conteos_delta:
    task: 0
    blocker: 0
    task_state_event: 0
    evidence: 0
    approval: 0
# Lo que se dejó de lado (`gateway.AVISO_MODIFICACION_DEJADA`) y la consulta
# atendida de verdad: aparece la tarea. Ni se vuelve a preguntar qué cambiar ni
# se vuelve a preguntar por la rama.
respuesta_menciona:
  - "dejé de lado"
  - "Cablear tablero"
respuesta_no_contiene_patron:
  - "qué querés cambiar"
  - "Estábamos con"
permite_pregunta_sin_opciones: true
severidad: alta
