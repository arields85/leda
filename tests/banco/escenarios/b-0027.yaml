id: b-0027
objetivo: >
  Decir el estado real (ADR 0013 regla 3, T9-R3): quien pide el alta de una tarea
  suya no es quien la confirma. Con el último dato esperando su Sí, la persona
  toca Sí y el alta termina. Su respuesta dice a quién se le mandó el borrador para
  que lo confirme y que la tarea todavía no existe; nunca el aviso neutro "No pude
  completar eso" (el flujo salió bien). El borrador queda esperando a su
  aprobador y no se crea ninguna tarea.
actor: Nahuel Gimenez
mensajes: []
precondiciones:
  tareas:
    - id: t1
      titulo: Cablear tablero de la máquina 3 (simulado)
      area: ot
      responsable: Marcos Tarquini
  # Nahuel pide el alta de una tarea suya: su aprobador es Marcos. El último dato
  # (el criterio de aceptación) queda propuesto, esperando su Sí
  # (`corrida._sembrar_borrador_de_alta`, `criterio_por_confirmar`).
  borrador_de_alta:
    solicitante: Nahuel Gimenez
    titulo: Cablear tablero norte
    objetivo: Objetivo simulado de Cablear tablero de la máquina 3 (simulado)
    responsable: Nahuel Gimenez
    area: ot
    fecha_objetivo: "2030-12-30"
    criterio_aceptacion: Prueba firmada
    criterio_por_confirmar: true
toques:
  - etiqueta: "Sí"
herramientas_prohibidas:
  - actualizar_estado
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - aprobar_tarea
  - adjuntar_evidencia
efectos:
  conteos_delta:
    task: 0
    task_state_event: 0
    evidence: 0
    approval: 0
# `ingreso_tareas.DRAFT_SENT_TO_APPROVER`: si T10 cambia su redacción, actualizar acá.
respuesta_menciona:
  - "Marcos Tarquini"
  - "confirme"
respuesta_no_contiene_patron:
  - "No pude completar"
# El alta es justamente lo que se prueba: un borrador es esperable.
permite_borrador_de_tarea: true
# La respuesta es un texto sin botones a propósito.
permite_pregunta_sin_opciones: true
severidad: alta
