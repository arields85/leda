id: b-0006
objetivo: >
  Observar que un pedido de tarea nueva abre el borrador guiado en vez de
  comprometer una tarea directamente en el primer mensaje.
actor: Marcos Tarquini
mensajes:
  - "necesito armar una tarea nueva para revisar el tablero eléctrico de la máquina 3"
herramientas_esperadas: []
herramientas_prohibidas:
  - crear_objetivo
  - actualizar_estado
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - quitar_dependencia
  - aprobar_tarea
  - adjuntar_evidencia
# El alta guiada (ingreso_tareas.start) no compromete ninguna 'task' en el
# primer turno; abre exactamente un 'task_draft' (verificado contra
# src/leda/ingreso_tareas.py: inserta uno cuando no hay un pedido activo).
efectos:
  conteos_delta:
    task: 0
    task_draft: 1
severidad: alta
