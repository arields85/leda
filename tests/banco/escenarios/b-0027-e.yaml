  no es su aprobador. Como el pedido nombra UNA tarea clara, la respuesta cierra con
  su estado real ("«Programar PLC (simulado)» sigue en revisión.") en lugar de
  "Estado: sin cambios.", y no dice que pidió cambios ni avisó a nadie.
