id: b-0016
objetivo: >
  Leda orienta, no charla (ADR 0007, T4): al pedir la lista de tareas
  propias, la respuesta las presenta como botones (T3, garantizado por el
  servidor) sin preguntar nada en texto abierto -- no hace falta ninguna
  elección todavía, sólo mostrar la lista.
actor: Marcos Tarquini
mensajes:
  - "pasame la lista completa de mis tareas"
precondiciones:
  tareas:
    - id: t1
      titulo: Programar PLC de la comprimidora (simulado)
      area: ot
      responsable: Marcos Tarquini
    - id: t2
      titulo: Revisar comunicaciones industriales (simulado)
      area: ot
      responsable: Marcos Tarquini
# Regla del usuario (R3-H7, T10-5): con hasta tres tareas el texto las nombra
# enteras, siempre -- el servidor lo garantiza (`agente._nombrar_tareas_listadas`)
# y los botones las muestran igual. Esta lista tiene dos. Lo que sigue prohibido es
# lo del hallazgo 4 (sesión 2 por Telegram, 2026-09-27): con más de tres, enumerarlas
# una por una en el texto ("- Backup de servidores... (simulado)" x 12); eso lo
# cubre la prueba de la guarda, no este escenario.
respuesta_menciona:
  - "Programar PLC de la comprimidora"
  - "Revisar comunicaciones industriales"
herramientas_prohibidas:
  - actualizar_estado
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - quitar_dependencia
  - aprobar_tarea
  - adjuntar_evidencia
  - crear_objetivo
efectos:
  conteos_delta:
    task: 0
    blocker: 0
    dependency: 0
    task_state_event: 0
severidad: media
