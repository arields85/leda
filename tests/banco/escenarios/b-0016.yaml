id: b-0016
objetivo: >
  Prisma orienta, no charla (ADR 0007, T4): al pedir la lista de tareas
  propias, la respuesta las presenta como botones (T3, garantizado por el
  servidor) sin preguntar nada en texto abierto -- no hace falta ninguna
  elección todavía, sólo mostrar la lista.
actor: Marcos Tarquini
mensajes:
  - "pasame la lista completa de mis tareas"
precondiciones:
  tareas:
    - id: t1
      titulo: Programar PLC de la comprimidora (simulado)
      area: ot
      responsable: Marcos Tarquini
    - id: t2
      titulo: Revisar comunicaciones industriales (simulado)
      area: ot
      responsable: Marcos Tarquini
# Hallazgo 4 (sesión 2 por Telegram, 2026-09-27): una corrida real listó las
# tareas en botones (T3) Y ADEMÁS las enumeró una por una en el texto ("-
# Backup de servidores... (simulado)" x 12) -- el texto tiene que resumir,
# nunca repetir lo que ya muestran los botones. Ninguna de las dos tareas de
# este escenario tiene un estado notable (bloqueada/en revisión/vencida), así
# que una respuesta que cumple la regla no tiene motivo para nombrar a
# ninguna por su título -- si aparece cualquiera de los dos, es que las
# enumeró.
respuesta_no_contiene_patron:
  - "Programar PLC de la comprimidora"
  - "Revisar comunicaciones industriales"
herramientas_prohibidas:
  - actualizar_estado
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - quitar_dependencia
  - aprobar_tarea
  - adjuntar_evidencia
  - crear_objetivo
efectos:
  conteos_delta:
    task: 0
    blocker: 0
    dependency: 0
    task_state_event: 0
severidad: media
