id: b-0028-b
variante_de: b-0028
objetivo: >
  Variante de b-0028, doble toque en un botón de la lista de tareas: la persona
  pide la lista y toca la primera tarea dos veces seguidas (a los 3 segundos). El
  segundo toque se absorbe: sale un solo menú de la tarea, sin "ya no está
  vigente" ni error, y no cambia nada.
actor: Nahuel Gimenez
mensajes:
  - "pasame la lista completa de mis tareas"
precondiciones:
  tareas:
    - id: t1
      titulo: Programar PLC (simulado)
      area: ot
      responsable: Nahuel Gimenez
toques:
  - indice: 0
    veces: 2
    cada_s: 3
herramientas_prohibidas:
  - actualizar_estado
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - aprobar_tarea
  - adjuntar_evidencia
efectos:
  tareas:
    t1:
      estado: asignada
  conteos_delta:
    task: 0
    task_state_event: 0
    evidence: 0
    approval: 0
respuesta_menciona:
  - "Programar PLC"
respuesta_no_contiene_patron:
  - "ya no está vigente"
  - "No pude completar"
severidad: alta
