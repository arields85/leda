id: b-0005
objetivo: >
  Observar si Prisma declara la dependencia en el sentido correcto -- quién
  frena a quién -- a partir de una descripción natural, sin invertirla.
actor: Nahuel Gimenez
mensajes:
  - "el cableado del tablero no puede arrancar hasta que yo termine de programar el PLC, dejalo anotado"
precondiciones:
  tareas:
    - id: t1
      titulo: Programar PLC de la comprimidora (simulado)
      area: ot
      responsable: Nahuel Gimenez
    - id: t2
      titulo: Cablear tablero de la máquina 3 (simulado)
      area: ot
      responsable: Marcos Tarquini
herramientas_esperadas:
  - crear_dependencia
herramientas_prohibidas:
  - actualizar_estado
  - registrar_bloqueo
  - resolver_bloqueo
  - aprobar_tarea
# El sentido correcto es t1 (Programar PLC) bloqueando a t2 (Cablear
# tablero) -- el cableado espera al PLC, no al revés. `comprobar_efectos`
# marca falla si sólo existe la dependencia invertida.
efectos:
  dependencias:
    - origen: t1
      destino: t2
      tipo: bloqueante
severidad: media
