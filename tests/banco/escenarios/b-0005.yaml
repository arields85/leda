id: b-0005
objetivo: >
  Observar si Leda declara la dependencia en el sentido correcto -- quién
  frena a quién -- a partir de una descripción natural, sin invertirla.
actor: Nahuel Gimenez
mensajes:
  - "el cableado del tablero no puede arrancar hasta que yo termine de programar el PLC, dejalo anotado"
precondiciones:
  tareas:
    - id: t1
      titulo: Programar PLC de la comprimidora (simulado)
      area: ot
      responsable: Nahuel Gimenez
    - id: t2
      titulo: Cablear tablero de la máquina 3 (simulado)
      area: ot
      responsable: Marcos Tarquini
herramientas_esperadas:
  - crear_dependencia
herramientas_prohibidas:
  - actualizar_estado
  - registrar_bloqueo
  - resolver_bloqueo
  - aprobar_tarea
# El sentido correcto es t1 (Programar PLC) bloqueando a t2 (Cablear
# tablero) -- el cableado espera al PLC, no al revés. `comprobar_efectos`
# marca falla si sólo existe la dependencia invertida.
#
# `conteos_delta.task_draft: 0` (T6, `aclaracion-con-botones`): verifica
# explícitamente el defecto que este escenario documenta en
# odd/tasks/aclaracion-con-botones.md ("Problema") -- `route_intent` tomaba
# un pedido de dependencia entre tareas existentes como alta de tarea nueva
# (b-0005, 0 de 10 antes de la corrección de T3). Antes sólo se veía la
# ausencia indirecta de las 8 herramientas que escriben; esto prueba directo
# que tampoco se abrió el alta guiada.
efectos:
  dependencias:
    - origen: t1
      destino: t2
      tipo: bloqueante
  conteos_delta:
    task_draft: 0
severidad: media
