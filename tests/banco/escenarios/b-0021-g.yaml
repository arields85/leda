id: b-0021-g
variante_de: b-0021
objetivo: >
  Variante de b-0021: un agradecimiento con el título abierto. Tampoco es el
  título: la pregunta vuelve.
actor: Marcos Tarquini
mensajes:
  - "armame una tarea nueva"
precondiciones:
  tareas:
    - id: t1
      titulo: Cablear tablero de la máquina 3 (simulado)
      area: ot
      responsable: Marcos Tarquini
# El primer toque elige el objetivo (el alta guiada pide primero las opciones
# con botones); el mensaje que se evalúa es el que llega después, con la
# pregunta del título abierta (`mensajes_tras_toques`).
toques:
  - indice: 0
mensajes_tras_toques:
  - "gracias!"
herramientas_prohibidas:
  - actualizar_estado
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - aprobar_tarea
efectos:
  conteos_delta:
    task: 0
    task_state_event: 0
    evidence: 0
    approval: 0
# Ver b-0021-f.
respuesta_menciona:
  - "título"
# El alta es justamente lo que se prueba: un borrador es esperable. La
# pregunta del título es de texto libre a propósito (no hay opciones que
# ofrecer): se exime la comprobación de ADR 0007 sobre preguntas sin botones.
permite_borrador_de_tarea: true
permite_pregunta_sin_opciones: true
severidad: alta
