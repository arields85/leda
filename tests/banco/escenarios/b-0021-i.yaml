id: b-0021-i
variante_de: b-0021
objetivo: >
  Variante de b-0021, dejar el alta para ver lo otro (ADR 0013 regla 1,
  enmienda "una sola rama de conversación abierta", T9-R1d): con la pregunta
  del título abierta, la persona consulta sus tareas y Prisma pregunta si
  sigue con lo pendiente; la persona toca "Dejarlo y ver lo otro". El borrador
  se guarda (no se cancela, F-C6), se dice y, en la misma respuesta, se atiende
  la consulta guardada (aparece la tarea) sin pedir el título de nuevo.
actor: Marcos Tarquini
mensajes:
  - "armame una tarea nueva"
precondiciones:
  tareas:
    - id: t1
      titulo: Cablear tablero de la máquina 3 (simulado)
      area: ot
      responsable: Marcos Tarquini
# El primer toque elige el objetivo (el alta guiada pide primero las opciones
# con botones); después llega el otro tema, con la pregunta del título abierta
# (`mensajes_tras_toques`), y se toca la pregunta de la rama.
toques:
  - indice: 0
mensajes_tras_toques:
  - "¿qué tareas tengo abiertas?"
toques_tras_mensajes:
  - etiqueta: "Dejarlo y ver lo otro"
herramientas_prohibidas:
  - actualizar_estado
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - aprobar_tarea
efectos:
  conteos_delta:
    task: 0
    task_state_event: 0
    evidence: 0
    approval: 0
# Lo que se guardó (`gateway.AVISO_ALTA_PAUSADA`) y la consulta atendida
# de verdad: aparece la tarea. No se vuelve a pedir el título.
respuesta_menciona:
  - "dejé guardado"
  - "Cablear tablero"
respuesta_no_contiene_patron:
  - "Escribí el título"
  - "Estábamos con"
# El alta es justamente lo que se prueba: un borrador es esperable.
permite_borrador_de_tarea: true
permite_pregunta_sin_opciones: true
severidad: alta
