id: b-0022-a
variante_de: b-0022
objetivo: >
  Variante de b-0022, otra forma de escribir la opción: en minúsculas. Se
  reconoce igual (mismo texto normalizado, sin distinguir mayúsculas) y el
  alta sigue con el título.
actor: Marcos Tarquini
mensajes:
  - "armame una tarea nueva"
precondiciones:
  tareas:
    - id: t1
      titulo: Cablear tablero de la máquina 3 (simulado)
      area: ot
      responsable: Marcos Tarquini
# La elección del objetivo queda abierta apenas empieza el alta: el
# mensaje que se evalúa es el que llega después (`mensajes_tras_toques`).
mensajes_tras_toques:
  - "objetivo simulado de cablear tablero de la máquina 3 (simulado)"
herramientas_prohibidas:
  - actualizar_estado
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - aprobar_tarea
efectos:
  conteos_delta:
    task: 0
    task_state_event: 0
    evidence: 0
    approval: 0
respuesta_menciona:
  - "título"
respuesta_no_contiene_patron:
  - "Elegí el objetivo"
# El alta es justamente lo que se prueba: un borrador es esperable.
permite_borrador_de_tarea: true
# La respuesta es un texto sin botones a propósito: se exime la
# comprobación de ADR 0007 sobre preguntas sin opciones.
permite_pregunta_sin_opciones: true
severidad: alta
