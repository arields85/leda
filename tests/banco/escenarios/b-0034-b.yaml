id: b-0034-b
variante_de: b-0034
objetivo: >
  Contraparte de b-0034 (R4-H9): con la pregunta de evidencia abierta, un texto
  descriptivo SIN enlace ("ya quedó andando en la planta") sigue como hasta ahora:
  el ruteo lo toma como lo que se pidió ("qué hiciste") y sigue la vista previa de
  la entrega. La señal de enlace no cambia nada acá. Si el modelo real lo marca
  como dudoso, este escenario lo muestra: mantiene la pregunta "¿Esto es la
  evidencia…?" de R3-H17 y hay que decidir si es lo esperado.
