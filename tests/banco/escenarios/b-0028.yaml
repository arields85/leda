id: b-0028
objetivo: >
  Tocar dos veces Confirmar (ADR 0013 regla 4, T9-R4): la persona pide poner una
  tarea en curso, Prisma muestra la vista previa y ella toca Confirmar dos veces
  seguidas (a los 3 segundos). El segundo toque de la misma persona sobre el mismo
  botón, dentro de los 10 segundos, se absorbe: el cambio se aplica una sola vez
  (un solo evento de estado), hay una sola respuesta visible y nunca sale "ya no
  está vigente" ni un error.
actor: Marcos Tarquini
mensajes:
  - "arranqué con el PLC de la comprimidora, dejalo en curso"
precondiciones:
  tareas:
    - id: t1
      titulo: Programar PLC de la comprimidora (simulado)
      area: ot
      responsable: Marcos Tarquini
herramientas_esperadas:
  - actualizar_estado
confirmar:
  veces: 2
  cada_s: 3
efectos:
  tareas:
    t1:
      estado: en_curso
  conteos_delta:
    task: 0
    task_state_event: 1
    evidence: 0
    approval: 0
respuesta_menciona:
  - "Programar PLC"
respuesta_no_contiene_patron:
  - "ya no está vigente"
  - "No pude completar"
permite_pregunta_sin_opciones: true
severidad: alta
