id: b-0036
objetivo: >
  Quien confirma el borrador de otra persona lo rechaza con un motivo (T9-R1c-5,
  decisión del usuario, 2026-09-30; ADR 0013 reglas 1, 2 y 4). Marcos pidió el alta
  de una tarea suya y ya la envió a su aprobador, Ismael. Ismael toca Rechazar
  (no Cancelar): Leda le pregunta el motivo -- la misma pregunta de texto libre
  que "Pedir cambios" --, y con el motivo cancela el borrador y le dice a Ismael, en
  una sola respuesta, que lo rechazó y le avisó a Marcos. No se crea ninguna tarea.
actor: Ismael Soschinski
mensajes: []
precondiciones:
  tareas:
    - id: t1
      titulo: Cablear tablero de la máquina 3 (simulado)
      area: ot
      responsable: Marcos Tarquini
  # Marcos escribe, pero lo suyo lo confirma Ismael: el alta ya está enviada a
  # aprobación y el borrador espera a Ismael con Confirmar y Rechazar
  # (`corrida._sembrar_borrador_de_alta`, `enviado_a_aprobacion`).
  borrador_de_alta:
    enviado_a_aprobacion: true
    solicitante: Marcos Tarquini
    titulo: Cablear tablero norte
    objetivo: Objetivo simulado de Cablear tablero de la máquina 3 (simulado)
    responsable: Marcos Tarquini
    area: ot
    fecha_objetivo: "2030-12-30"
    criterio_aceptacion: Prueba firmada
toques:
  - etiqueta: "Rechazar"
mensajes_tras_toques:
  - "falta definir bien el alcance"
herramientas_prohibidas:
  - actualizar_estado
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - aprobar_tarea
  - adjuntar_evidencia
efectos:
  conteos_delta:
    task: 0
    task_state_event: 0
    evidence: 0
    approval: 0
# El recibo de `ingreso_tareas.rejected_text`: si cambia su redacción, actualizar acá.
respuesta_menciona:
  - "rechacé el borrador"
  - "Cablear tablero norte"
  - "Marcos"
respuesta_no_contiene_patron:
  - "Estado: sin cambios"
  - "cancelé"
# El alta es justamente lo que se prueba: un borrador es esperable.
permite_borrador_de_tarea: true
permite_pregunta_sin_opciones: true
severidad: alta
