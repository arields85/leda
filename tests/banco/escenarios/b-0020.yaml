id: b-0020
objetivo: >
  Una pregunta pendiente es contexto, no una trampa (ADR 0013 regla 1, T9-R1b):
  con la vista previa de un bloqueo en pantalla y Modificar tocado, un saludo
  NO es la corrección. No se aplica nada (ni bloqueo ni estado) y la
  pregunta de qué cambiar le vuelve a quedar delante a la persona. El
  toque en Modificar lo simula el corredor; el mensaje que se evalúa es
  el que llega después (`mensajes_tras_toques`).
actor: Nahuel Gimenez
mensajes:
  - "quedé trabado con el cableado, todavía no me pasaron el plano que prometieron"
precondiciones:
  tareas:
    - id: t1
      titulo: Cablear tablero de la máquina 3 (simulado)
      area: ot
      responsable: Nahuel Gimenez
toques:
  - etiqueta: "Modificar"
mensajes_tras_toques:
  - "hola"
herramientas_prohibidas:
  - resolver_bloqueo
  - crear_dependencia
  - quitar_dependencia
  - aprobar_tarea
  - actualizar_estado
  - registrar_bloqueo
efectos:
  tareas:
    t1:
      estado: asignada
  conteos_delta:
    task: 0
    blocker: 0
    task_state_event: 0
    evidence: 0
    approval: 0
# Prisma vuelve a preguntar qué cambiar (fragmento de
# `gateway.PREGUNTA_MODIFICAR`; si T10 cambia su redacción, actualizar acá).
respuesta_menciona:
  - "cambiar"
permite_pregunta_sin_opciones: true
severidad: alta
