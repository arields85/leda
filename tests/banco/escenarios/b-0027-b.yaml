id: b-0027-b
variante_de: b-0027
objetivo: >
  Variante de b-0027, evidencia sobre una tarea en curso (R3-H20): la persona pasa
  un link como evidencia de una tarea que sigue en curso y confirma la vista
  previa. La respuesta dice que la evidencia quedó registrada y que la tarea SIGUE
  en curso (todavía no la entregó, nadie puede revisarla), y ofrece la entrega
  como botón. La tarea no cambia de estado sola.
actor: Nahuel Gimenez
mensajes:
  - "te paso el link de la captura como evidencia de Programar PLC: https://ejemplo.invalid/captura-plc"
precondiciones:
  tareas:
    - id: t1
      titulo: Programar PLC (simulado)
      area: ot
      responsable: Nahuel Gimenez
      estado: en_curso
herramientas_esperadas:
  - adjuntar_evidencia
herramientas_prohibidas:
  - actualizar_estado
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - aprobar_tarea
efectos:
  tareas:
    t1:
      estado: en_curso
  conteos_delta:
    task: 0
    task_state_event: 0
    evidence: 1
    approval: 0
# `gateway._responder_evidencia_registrada`: si T10 cambia su redacción, actualizar acá.
respuesta_menciona:
  - "quedó registrada"
  - "sigue en curso"
severidad: alta
