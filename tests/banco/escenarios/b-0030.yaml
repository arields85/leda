id: b-0030
objetivo: >
  Reproducir H19 (ronda 3 por Telegram, T9-H19; ADR 0013 regla 2): después de
  "Pedir cambios" el responsable abre su tarea, toca "Ya la terminé" y manda
  SOLO un link como la nueva entrega. Ese único mensaje recibe exactamente una
  respuesta -- la vista previa de la entrega con ese link --, nunca además una
  aclaración ("¿A cuál te referís…?") en paralelo. Además de contar las respuestas,
  el banco falla si el control estructural (`respuesta_unica`) tuvo que descartar
  una segunda: la causa (dos respuestas armadas para un mensaje) importa aunque el
  síntoma quede suprimido. Nada se aplica antes de Confirmar.
actor: Nahuel Gimenez
mensajes:
  - "pasame la lista completa de mis tareas"
precondiciones:
  tareas:
    - id: t1
      titulo: Programar PLC (simulado)
      area: ot
      responsable: Nahuel Gimenez
      # La tarea como la deja "Pedir cambios": entregada, rechazada por su aprobador
      # y de vuelta por hacer (`corrida._pedir_cambios_semilla`).
      cambios_pedidos:
        por: Marcos Tarquini
        motivo: falta la captura del tablero con la hora visible
toques:
  - indice: 0
  - etiqueta: "Ya la terminé"
mensajes_tras_toques:
  - "https://example.com/capturas"
herramientas_esperadas:
  - actualizar_estado
herramientas_prohibidas:
  - registrar_bloqueo
  - resolver_bloqueo
  - crear_dependencia
  - aprobar_tarea
efectos:
  tareas:
    t1:
      estado: en_revision
  conteos_delta:
    task: 0
    evidence: 1
    task_state_event: 1
    approval: 0
respuesta_menciona:
  - "https://example.com/capturas"
respuesta_no_contiene_patron:
  - "A cuál te referís"
severidad: alta
