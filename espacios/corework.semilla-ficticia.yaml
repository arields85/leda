# Semilla de datos ficticios para la tercera ronda por Telegram
# (T7, `odd/tasks/leda-orienta.md`).
#
# Mismas 12 tareas y las mismas seis personas responsables del pack
# `corework.yaml` que ya se habían cargado a mano en las sesiones 1 y 2 --
# extraídas de sólo lectura de la base de mantenimiento local (`postgres`,
# la misma a la que apunta `LEDA_TEST_DB_URL`) el 2026-09-27 -- pero:
#
#   - sin el sufijo " (simulado)" en el título: el título es un campo de
#     compromiso inmutable (`bloquear_estado_directo`, `db/esquema.sql`) y
#     no se puede renombrar en la base ya cargada; de ahí esta semilla, para
#     una base nueva.
#   - con estados iniciales pensados para probar la tercera ronda -- entrega
#     con evidencia y "Pedir cambios" (ADR 0009 y su enmienda T6c) --, no una
#     copia de cómo habían quedado las tareas al final de las sesiones 1 y 2.
#
# Se carga con:
#   python -m leda sembrar corework --semilla espacios/corework.semilla-ficticia.yaml
#
# en un espacio recién importado con `importar corework --activar` y sin
# ninguna tarea todavía: `sembrar` rechaza si el espacio ya tiene alguna, para
# no mezclar datos ficticios con datos reales ni con una siembra anterior.
#
# Cada tarea cuelga de uno de los objetivos operativos ("frentes") que ya trae
# el pack (`objetivo_inicial.frentes` en `corework.yaml`), no de un objetivo
# nuevo por tarea -- eso último fue un atajo de la carga a mano de la sesión 1
# (quedó como "Objetivo simulado de <título>", un objetivo por tarea, que no
# es como el resto del producto modela objetivos).
#
# `fecha_objetivo.dias` es relativo al día en que se corre `sembrar` (mismo
# desplazamiento para las 12, igual que la base original tenía la misma
# fecha para todas), para que la semilla sea reproducible sin fechas fijas
# que terminen vencidas solas.
#
# `evidencia_requerida: [explicacion]` es coherente con la política del pack
# (`evidencia.por_area` en `corework.yaml`): "explicacion" está en la lista
# de evidencia admitida de las seis áreas, así que vale para cualquiera de
# estas tareas sin importar su área.
#
# Estados iniciales (ninguna aprobada, ninguna en revisión -- ADR 0009,
# "nada preaprobado"):
#   - una `en_curso` por cada responsable con aprobador (las seis personas
#     de esta semilla lo tienen): lista para entregarse con "Ya la terminé"
#     y evidencia.
#   - una tarea `en_curso` (la segunda de Marcos) con una dependencia
#     bloqueante abierta hacia una tarea todavía sin terminar (la primera de
#     Marcos): para probar "Pedir cambios" con la dependencia abierta (T6c),
#     que restaura `en_curso` sin pasar por el freno de arranque.
#   - el resto, `asignada`: todavía no arrancaron.

version: 1

tareas:
  - titulo: "Cablear tablero de la máquina 3"
    area: electricidad
    objetivo: "Construir o adaptar tableros preparados para la integración"
    responsable: "Mariano Naim"
    criterio_aceptacion: "Simulado: criterio de prueba del banco."
    evidencia_requerida: [explicacion]
    fecha_objetivo: {dias: 10}
    estado_inicial: en_curso
    motivo_estado_inicial: >
      En curso, con evidencia pendiente: para probar "Ya la terminé" con
      entrega de evidencia (ADR 0009).

  - titulo: "Revisar tablero de la máquina 4"
