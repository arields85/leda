    fecha_objetivo: {dias: 10}
    estado_inicial: asignada
    motivo_estado_inicial: >
      Asignada y sin terminar a propósito: es el origen de la dependencia
      bloqueante abierta sobre la tarea siguiente (para probar "Pedir
