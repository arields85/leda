    fecha_objetivo: {dias: 10}
    estado_inicial: asignada
    motivo_estado_inicial: "Asignada: todavía sin arrancar."

  - titulo: "Programar PLC de la comprimidora"
    area: ot
    objetivo: "Conectar y automatizar equipos para que produzcan y entreguen datos"
    responsable: "Marcos Tarquini"
    criterio_aceptacion: "Simulado: criterio de prueba del banco."
